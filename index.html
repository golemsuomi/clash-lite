  }

  // 掘地矿工：地下赶路计时（到点由 G.pending 里的 q.burrow 负责冒头）
  if (G.burrows && G.burrows.length){
    for (const b of G.burrows) b.t -= dt;
    G.burrows = G.burrows.filter(b => b.t > 0);
  }

  // 实体
  for (const e of G.ents) updateEnt(e, dt);

  // 卡死保险：地面单位如果 1.5 秒一步都没挪、目标又还在射程外，就往侧面顶一下绕开。
  //   正常走路 / 在射程内站桩开火都不会触发（后者目标在射程内）。
  //   同时兜底「部署动画卡住」：落地 1 秒还没完成的一律强制结束，免得留下半透明的假单位。
  for (const e of G.ents){
    if (e.dead || e.isTower || e.isBuilding || e.flying){ e.stuckT = 0; e._px = e.x; e._py = e.y; continue; }
    if (e.spawnT > 0){
      e.spawnElapsed = (e.spawnElapsed || 0) + dt;
      if (e.spawnElapsed > 2.5) e.spawnT = 0;          // 兜底：卡在部署动画里就强制落地
    }
    const moved = Math.hypot(e.x - (e._px == null ? e.x : e._px), e.y - (e._py == null ? e.y : e._py));
    e._px = e.x; e._py = e.y;
    const tg = e.target;
    const farTarget = tg && !tg.dead && Math.hypot(tg.x - e.x, tg.y - e.y) > e.range + tg.radius + 8;
    if (e.spawnT > 0 || e.rootT > 0 || e.stun > 0 || e.hookWind > 0 || !farTarget) e.stuckT = 0;
    else if (moved < 0.4) e.stuckT = (e.stuckT || 0) + dt;
    else e.stuckT = 0;
    if (e.stuckT > 1.5){
      e.stuckT = 0;
      const ang = Math.atan2(tg.y - e.y, tg.x - e.x) + Math.PI / 2;
      e.x = clamp(e.x + Math.cos(ang) * 7, e.radius + 4, AW - e.radius - 4);
      e.y = clamp(e.y + Math.sin(ang) * 7, e.radius + 4, AH - e.radius - 4);
    }
  }

  // 分离
  separate();

  // 滚动法术（滚木 / 野蛮人滚筒）
  if (G.rolls && G.rolls.length) updateRolls(dt);

  // 特效
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.life);

  // 清理
  G.ents = G.ents.filter(e => !e.dead);
}

// 带「沿塔身滑动」的位移：先按目标方向走，撞上塔身就贴着塔的侧面滑过去。
//   只做推出（pushOutOfTowers）是不够的 —— 单位正对着塔走时，每帧都被沿来路顶回去，
//   净位移为 0，看起来就是「卡在公主塔后面不动」（实测把兵放在自己公主塔正后方，
//   它会顶着塔站 4 秒以上）。这里把撞墙后的切向分量保留下来；正撞（切向≈0）时
//   朝「离路点更近的一侧」滑，绕过去继续走。
function moveStep(e, sx, sy, wp){
  e.x += sx;
  e.y += sy;
  if (e.flying){                                        // 空中单位从塔顶掠过，不参与碰撞
    e.x = clamp(e.x, e.radius + 4, AW - e.radius - 4);
    e.y = clamp(e.y, e.radius + 4, AH - e.radius - 4);
    return;
  }
  for (const o of G.ents){
    if (!o.isTower || o.dead) continue;
    const hw = o.radius * 0.9 + e.radius;
    const dx = e.x - o.x, dy = e.y - o.y;
    if (Math.abs(dx) >= hw || Math.abs(dy) >= hw) continue;   // 没碰到这座塔
    const ox = hw - Math.abs(dx), oy = hw - Math.abs(dy);
    const len = Math.hypot(sx, sy);
    if (ox < oy){
      // 撞的是左右两面 → 沿竖直方向滑
      e.x = o.x + (dx < 0 ? -hw : hw);
      // 方向取「自己已经偏出的那一侧」：用路点方向会在中心线上左右来回抖
      // （向左滑 0.7px → 路点又变成在右边 → 滑回来，实测原地抖一整天）
      const dir = Math.abs(dy) > 0.5 ? Math.sign(dy) : (Math.sign(wp.y - e.y) || 1);
      e.y += Math.abs(sy) > len * 0.15 ? sy : dir * len;
    } else {
      // 撞的是上下两面 → 沿水平方向滑
      e.y = o.y + (dy < 0 ? -hw : hw);
      const dir = Math.abs(dx) > 0.5 ? Math.sign(dx) : (Math.sign(wp.x - e.x) || 1);
      e.x += Math.abs(sx) > len * 0.15 ? sx : dir * len;
    }
  }
  e.x = clamp(e.x, e.radius + 4, AW - e.radius - 4);
  e.y = clamp(e.y, e.radius + 4, AH - e.radius - 4);
}

// 塔是实体：地面单位不能穿过塔身（飞行单位从塔顶掠过，不参与碰撞）。
//   塔画出来是 1.8×半径的**方块**（见 drawTower 的 s = radius * 1.8），所以碰撞也用矩形：
//   半宽 = radius * 0.9（正好是塔身侧边的位置），单位被推到「塔身 + 自己半径」的矩形外，
//   侧面能贴着塔身站，四角也不会压进去。近战距离（range + 塔半径）远大于此，不影响开火。
function pushOutOfTowers(e){
  if (e.isTower || e.isBuilding || e.flying) return;
  for (const o of G.ents){
    if (!o.isTower || o.dead) continue;
    const hw = o.radius * 0.9 + e.radius;
    const dx = e.x - o.x, dy = e.y - o.y;
    if (Math.abs(dx) < hw && Math.abs(dy) < hw){
      const ox = hw - Math.abs(dx), oy = hw - Math.abs(dy);
      if (ox < oy) e.x = o.x + (dx < 0 ? -hw : hw);      // 从更浅的一侧推出去
      else         e.y = o.y + (dy < 0 ? -hw : hw);
    }
  }
  e.x = clamp(e.x, e.radius + 4, AW - e.radius - 4);
  e.y = clamp(e.y, e.radius + 4, AH - e.radius - 4);
}

// 渔夫的钩子找目标：3.5~7 格内**最近的**敌方地面单位 / 建筑（跳过空中、隐身）。
//   和「当前攻击目标」无关 —— 他在拆塔时，路过的兵照样会被钩。
function findHookTarget(e){
  let cand = null, best = Infinity;
  for (const o of G.ents){
    if (o.dead || o.team === e.team) continue;
    if (o.flying || o.cloak) continue;        // 塔和建筑也能钩（钩到建筑时是自己飞过去）
    const d = dist(e, o);
    if (d < e.hookMin || d > e.hookMax) continue;
    if (d < best){ best = d; cand = o; }
  }
  return cand;
}

function updateEnt(e, dt){
  if (e.dead) return;
  pushOutOfTowers(e);          // 投放点压在塔上 / 被击退进塔：先推出来，避免卡在塔身里
  e.anim += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.spawnT > 0) e.spawnT -= dt;
  // 眩晕（雷电法术）：攻击冷却不推进；下面还会提前 return，不索敌 / 不移动 / 不开火
  // 减速（大雪球 / 冰人亡语）：攻击冷却按 SLOW_RATE 慢放，移动同理（见下面的 step）
  if (e.slowT > 0) e.slowT -= dt;
  if (e.rageT > 0) e.rageT -= dt;
  // 攻速：减速 ×0.65，狂暴 ×1.3（两者可以同时存在，各自生效）
  if (e.stun > 0) e.stun -= dt;
  else e.cool -= dt * (e.slowT > 0 ? SLOW_RATE : 1) * (e.rageT > 0 ? RAGE_RATE : 1);

  // 定身（藤蔓）：计时结束把被拽下来的飞行单位放回去
  if (e.rootT > 0){
    e.rootT -= dt;
    if (e.rootT <= 0){
      e.rootT = 0;
      if (e.wasFlying){ e.flying = true; e.wasFlying = false; }
    }
  }
  if (e.quakeT > 0) e.quakeT -= dt;          // 地震减速
  if (e.invuln > 0) e.invuln -= dt;          // 幻影刺客突袭无敌
  if (e.frozenT > 0) e.frozenT -= dt;        // 冰冻法术：冰壳视觉（机制走 stun）
  if (e.poisonT > 0) e.poisonT -= dt;        // 毒药法术：15% 减速
  if (e.dashCd > 0) e.dashCd -= dt;          // 突袭冷却
  // 皇家幽灵：出手就显形，**只要还在交战就一直显形**，脱战 2 秒才重新隐身。
  //   （原来只按「上次出手 +2 秒」算，攻速 1.8 秒、首击还要 0.7 秒前摇，
  //     两刀之间可能空出 2 秒以上，于是打着打着就隐身了。）
  if (e.stealth){
    const foe = e.target;
    if (!e.cloak && foe && !foe.dead && dist(e, foe) <= e.range + foe.radius + 4)
      e.visibleT = Math.max(e.visibleT, 2);        // 射程内有活目标 = 还在打，刷新显形时间
    if (e.visibleT > 0){
      e.visibleT -= dt;
      if (e.visibleT <= 0) e.cloak = true;
    }
  }

  // 攻城炸弹人：落地时喊一声就够了（整张卡只喊一次，不循环）
  if (e.cardId === 'wallBreakers' && !e.screamed && !(e.spawnT > 0) && e.stun <= 0){
    e.screamed = true;
    sfxWallRun();
  }

  // 建筑的「血量」和「持续时间」共用同一个生命池：
  //   · 时间流逝 → 每帧按 maxHp/lifetime 的速度自然流失
  //   · 受到伤害 → damage() 按实际伤害扣
  //   池子见底就是倒：时间到 / 被打爆，走同一个死法
  //   （部署那 1 秒不流失，落地后才开始计时）
  if (e.isBuilding && !(e.spawnT > 0)){
    e.hp -= e.decay * dt;
    if (e.hp <= 0){ e.hp = 0; kill(e); return; }
  }

  // 召唤型建筑（骷髅墓碑）：**落地立刻先出一个**，之后每 spawnEvery 秒一个；
  //   出兵点固定在墓碑**正前方**（朝敌方那一侧），不是身后。
  const bc = e.cardId ? CARDS[e.cardId] : null;
  if (bc && bc.spawnEvery && !(e.spawnT > 0) && !e.dead){
    const fwd = e.team === 'ai' ? 1 : -1;            // 玩家的「前方」是 y 变小，AI 相反
    const doSummon = () => {
      // 每次出兵 spawnCount 个（骷髅墓碑是 2 个），在正前方并排站开。
      //   **逐个出场**：第一个当场出，后面的按 SUMMON_STAGGER 排队，
      //   看起来是「一个接一个走出来」，而不是同一帧一起冒出来。
      const n = bc.spawnCount || 1;
      const sy = clamp(e.y + fwd * (e.radius + 16), 40, AH - 40);
      const px = clamp(e.x, 34, AW - 34);              // 两只**同一个出生点**
      const lane = e.x < AW / 2 ? 0 : 1;               // 并锁定墓碑所在的那一路
      for (let k = 0; k < n; k++){
        if (k === 0) summonAt(bc.spawnCard, e.team, px, sy, lane);
        else G.pending.push({ t: SUMMON_STAGGER * k, summonUnit: true,
                              cardId: bc.spawnCard, team: e.team, x: px, y: sy, lane });
      }
      G.fx.push({ type:'ring', x:e.x, y:e.y + fwd * e.radius * 0.6, r0: 5, r1: e.radius * 1.9,
                  t:0, life:0.30, color:'#cfd8ff' });
    };
    // 哥布林小屋这类「有人来才产兵」的建筑：探测范围内没有敌人就**暂停计时**（进度保留），
    //   敌人一进圈就立刻把攒着的那一个放出来，之后按 spawnEvery 继续。
    let active = true;
    if (bc.spawnWhenEnemy){
      active = false;
      for (const o of G.ents){
        if (o.dead || o.team === e.team || o.isTower || o.cloak) continue;
        if (dist(o, e) <= bc.spawnWhenEnemy + o.radius * 0.5){ active = true; break; }
      }
      e.hutIdle = !active;
    }
    if (e.summonT == null){
      if (bc.spawnWhenEnemy) e.summonT = 0;             // 有敌人来了就立刻出第一个
      else if (bc.firstSummon === false) e.summonT = bc.spawnEvery;   // 熔炉：等满 5 秒才出第一个
      else { e.summonT = bc.spawnEvery; doSummon(); }    // 墓碑：落地那一下立刻出
    }
    if (active){
      e.summonT -= dt;
      if (e.summonT <= 0){ e.summonT = bc.spawnEvery; doSummon(); }
    }
  }

  // 治疗精灵的治疗：1 秒内匀速回血，回满为止（塔不吃治疗）
  if (e.healT > 0){
    e.healT -= dt;
    e.hp = Math.min(e.maxHp, e.hp + e.healRate * dt);
  }

  // 击退中（火球掀开）：位移按指数衰减逐帧施加，这段时间不索敌、不移动、不开火
  if (e.kbT > 0){
    const k = Math.min(1, dt / e.kbT);
    e.x += e.kbX * k;
    e.y += e.kbY * k;
    e.kbX *= (1 - k);
    e.kbY *= (1 - k);
    e.kbT -= dt;
    if (e.kbT <= 0){ e.kbT = 0; e.kbX = 0; e.kbY = 0; }
    pushOutOfTowers(e);                                // 被击退也不能被掀进塔里
    return;
  }

  if (e.stun > 0) return;

  // —— 电磁塔钻地：敌人「进射程」才升起，敌人离开就缩回 ——
  if (e.burrow){
    // 部署那 1 秒：老老实实埋在地下（只露一个地洞），不会提前冒头。
    // 落地时只有 doSpawn 里那圈白色尘土环，塔身本身不出来。
    if (e.spawnT > 0){
      e.emerge = 0;
      e.hidden = true;
      return;
    }
    // 升起用「射程」——和玩家看到的射程圈（c.range）完全一致，进圈才冒头；
    // 已经升起后放宽到「射程 + 50」（findTarget 给防御建筑留的粘性余量），
    // 这样它还能打到敌人时不会先缩回去，顺便避免在圈边反复伸缩。
    const inRange = burrowThreat(e, e.range);
    const keepUp  = e.emerge > 0 && burrowThreat(e, e.range + 50);
    const want = (inRange || keepUp) ? 1 : 0;

    if (e.emerge < want){
      e.emerge = Math.min(1, e.emerge + dt / BURROW_RISE);
      if (!e.wasUp && e.emerge >= 1){          // 刚完全升起：双尘环 + 电流音
        e.wasUp = true;
        G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 8,  r1: 62, t:0, life:0.42, color:'#ffe07a' });
        G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 4,  r1: 34, t:0, life:0.30, color:'#ffffff' });
        sfxBurrow();
      }
    } else if (e.emerge > want){
      e.emerge = Math.max(0, e.emerge - dt / BURROW_RISE);
      if (e.emerge <= 0.02 && e.wasUp){        // 刚完全缩回：一圈收缩的土尘
        e.emerge = 0;                          // 吸附到 0，保证 hidden ⟺ emerge === 0
        e.wasUp = false;
        G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 34, r1: 8, t:0, life:0.30, color:'#a8845a' });
      }
    }
    e.hidden = e.emerge <= 0.02;
    if (e.emerge < 0.999) return;              // 没完全升起 → 不索敌、不开火
  }

  // 国王塔未激活
  if (e.isTower && e.kind === 'king' && !e.active) return;

  // —— 跳河中：沿直线掠过河面，期间不索敌、不受河流约束 ——
  if (e.jump > 0){
    e.jump -= dt;
    const jp = clamp(1 - e.jump / e.jumpT, 0, 1);
    e.x = e.jumpFromX + (e.jumpToX - e.jumpFromX) * jp;
    e.y = e.jumpFromY + (e.jumpToY - e.jumpFromY) * jp;
    if (e.jump <= 0){ e.jump = 0; e.jumpT = 0; }
    return;
  }

  // —— 自爆单位冲刺中：锁定目标扑过去，落地即爆 ——
  //   放在索敌之前：冲刺途中目标死了也不会中断，保证一定会炸。
  if (e.dash > 0){
    e.dash -= dt;
    const p = clamp(1 - e.dash / e.dashT, 0, 1);
    e.x = e.dashX + (e.dashToX - e.dashX) * p;
    e.y = e.dashY + (e.dashToY - e.dashY) * p;
    if (e.dash <= 0) explodeUnit(e);
    return;
  }

  // 索敌：**锁定后不再定期换目标**。只有三种情况会重新索敌：
  //   ① 还没目标 / 目标已经死了；② 目标跑出自己的射程（range + 目标半径）；
  //   ③ 被打断 —— 眩晕/冰冻命中时就把 target 清掉了（见 applyStun），解控后重新索敌
  // 注意：这里刻意不再有「每 0.3s 重新选一次最近敌人」的计时器，
  // 所以身边冒出新敌人也不会把正在打的目标抢走。
  if (!e.target || e.target.dead || dist(e, e.target) > e.range + (e.radius || 0) + e.target.radius ||
      (e.minRange && dist(e, e.target) < e.minRange + (e.radius || 0) + e.target.radius)){
    const prev = e.target;
    e.target = findTarget(e);
    // 换了目标 → 重新蓄力（首次出手的 0.7 秒要重新等一遍）
    if (e.target !== prev) e.atkReady = false;
  }
  const t = e.target;
  if (!t) return;

  const d = dist(e, t);
  // 射程按「边到边」算：自己的半径 + 目标的半径都要算上。
  //   公主塔半径 ≈ 1 格，所以塔实际能打到 8.5 格 —— 只算目标半径的话会短整整一格，
  //   贴着塔边打不到的兵看起来就像「明明在射程里却不开火」。
  const reach = e.range + (e.radius || 0) + t.radius;

  // 渔夫：3.5~7 格内的地面敌人会被钩子拽到身边（先飞 0.28 秒，再瞬移过来）
  if (e.cardId === 'fisherman' && e.hookMax > 0 && !(e.spawnT > 0)){
    if (e.hookCd > 0) e.hookCd -= dt;
    // 蓄钩：锁定目标后要站定 1.3 秒才甩出去（这段时间目标跑出范围也照样甩，钩的是锁定点）
    if (e.hookWind > 0){
      e.hookWind -= dt;
      if (e.hookWind <= 0){
        const o = e.hookTarget;
        if (o && !o.dead){
          e.hookT = 0.28;
          G.fx.push({ type:'shot', kind:'spear', x0: e.x, y0: e.y, x1: o.x, y1: o.y,
                      t:0, life: 0.26, color:'#9fd8f0', w: 3.4, arc: 0, seed: 0 });
          sfxHookThrow();
        } else {
          e.hookTarget = null;
        }
      }
    }
    else if (e.hookT > 0){
      e.hookT -= dt;
      if (e.hookT <= 0 && e.hookTarget && !e.hookTarget.dead){
        const o = e.hookTarget;
        if (o.isTower || o.isBuilding){
          // 钩建筑：建筑拽不动，改成把自己拉过去，停在建筑外沿
          const ang = Math.atan2(e.y - o.y, e.x - o.x);
          const dd = o.radius + e.radius + 12;
          e.x = clamp(o.x + Math.cos(ang) * dd, 34, AW - 34);
          e.y = clamp(o.y + Math.sin(ang) * dd, 34, AH - 34);
          G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: 32, t:0, life:0.30, color:'#9fd8f0' });
        } else {
          // 钩单位：把敌人拽到身边
          const ang = Math.atan2(o.y - e.y, o.x - e.x);
          const dd = e.radius + o.radius + 10;
          o.x = clamp(e.x + Math.cos(ang) * dd, 34, AW - 34);
          o.y = clamp(e.y + Math.sin(ang) * dd, 34, AH - 34);
          G.fx.push({ type:'ring', x:o.x, y:o.y, r0: 6, r1: 32, t:0, life:0.30, color:'#9fd8f0' });
          // 钩过来的这只先记账：**打死它之前不再甩钩**，同时把攻击目标切到它身上
          e.hookVictim = o;
          e.target = o;
        }
        sfxFisherHook();
      }
      if (e.hookT <= 0) e.hookTarget = null;
    } else if ((!e.hookVictim || e.hookVictim.dead) && (e.hookCd <= 0 || e.hookVictim)){
      // 先把手上的那只打死，才轮到下一个：它还没死就一直不甩钩（哪怕冷却早好了）；
      //   它一死就无视剩余冷却，直接钩下一个。
      //   钩的对象不一定是「当前攻击目标」：他在拆塔时，路过的敌方地面兵照样会被钩
      const cand = findHookTarget(e);
      if (cand){
        e.hookTarget = cand;
        e.hookWind = 1.3;            // 蓄钩延迟
        e.hookCd = 6;                // 从锁定时就开始转冷却
        sfxHookLock();
        G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 8, r1: 30, t:0, life:0.30, color:'#9fd8f0' });
      }
    }
  }


  if (d <= reach){
    // 冲锋单位（黑暗王子 / 野蛮人攻城锤）：冲进射程的这一帧立刻开火，
    //   不读首击前摇 —— 冲锋伤害就该「撞上就落地」，否则冲到位还要站 0.7 秒，看起来像白冲。
    if (e.charged && !e.atkReady){ e.cool = 0; e.atkReady = true; }
    // 首次出手：刚进入射程（或刚换目标）先蓄力 0.7 秒，才打出第一下。
    //   计时从「真正能出手」这一刻开始算 —— 单位一落地往往就锁定了 330px 外的塔，
    //   若从锁定那一刻起算，等它走到塔前 0.7 秒早就过期了，蓄力等于没有。
    //   落地那 1 秒不算蓄力（spawnT 期间本来就不能打），所以是从落地后开始等。
    //   自爆单位（精灵 / 攻城炸弹人）例外：它们的「出手」就是扑上去炸，
    //   在射程边缘站桩 0.7 秒等于白挨打 —— 实测攻城炸弹人会因此死掉一只（塔只掉 302 而不是 604）。
    if (!e.atkReady && !e.isTower && !e.suicide && !(e.spawnT > 0)){
      e.atkReady = true;
      // 打「兵」要读招 0.7 秒；打「塔 / 建筑」只要 0.35 秒 —— 塔是死的，不会还手也不会走位，
      //   让每个小兵在塔下白站 0.7 秒，等于把飞桶、骷髅、炸弹人的拆迁伤害直接砍掉三成。
      const wait = e.firstHit != null ? e.firstHit
                 : ((t.isTower || t.isBuilding) ? FIRST_HIT_BUILDING : FIRST_HIT_DELAY);
      e.cool = Math.max(e.cool, wait);
    }
    // 自爆单位（烈焰精灵）：进射程就锁定目标扑上去，扑到了才炸 —— 不跟人拼近战
    if (e.suicide){
      if (!(e.spawnT > 0)){
        e.dash = 0.16; e.dashT = 0.16;
        e.dashX = e.x; e.dashY = e.y;
        e.dashToX = t.x; e.dashToY = t.y;
      }
      return;
    }
    if (e.cool <= 0 && e.dmg > 0 && !(e.spawnT > 0)){
      e.cool = e.hitSpeed;
      doAttack(e, t);
    }
    return;
  }

  // 幻影刺客：3.5~6 格内有地面目标就突袭过去（突袭中速度 ×5 且无敌，落地那一下 389）
  if (e.cardId === 'bandit' && e.dashRange > 0 && !(e.spawnT > 0)){
    if (e.bdash > 0){
      e.bdash -= dt;
      e.invuln = Math.max(e.invuln, 0.04);
      // 冲刺拖影：每 0.04 秒留一撮粉色残影，看得出她是一路冲过去的
      e.trailT = (e.trailT || 0) - dt;
      if (e.trailT <= 0){
        e.trailT = 0.04;
        G.fx.push({ type:'spark', x:e.x, y:e.y - e.radius * 0.2, t:0, life:0.26,
                    color:'#ff9ad0', r: e.radius * 0.9, n: 3 });
      }
    } else if (e.dashCd <= 0 && t && !t.dead && !t.flying){   // 塔和建筑也照冲（皇室战争里她会突袭塔）
      const d = dist(e, t);
      if (d >= e.dashMin && d <= e.dashRange){
        // 冲速至少 5 倍；距离太远就再快一点，保证 0.5 秒内一定冲到（否则会停在半路、差几像素打不到）
        e.dashSpeed = Math.max(e.speed * 5, d / 0.5);
        e.bdash = Math.max(0.12, d / e.dashSpeed);
        e.invuln = e.bdash + 0.06;
        e.dashBonus = e.dashDmg;
        e.dashCd = 4;
        sfxBanditDash();
        G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: 44, t:0, life:0.30, color:'#ff9ad0' });
      }
    }
  }

  // 移动（定身 / 渔夫蓄钩期间原地不动，但仍然可以攻击）
  if (e.isTower || e.isBuilding || e.spawnT > 0 || e.rootT > 0 || e.hookWind > 0) return;

  // 突袭中：直线冲向目标（不绕桥、不按寻路走，否则会顺着大路冲过头）
  if (e.bdash > 0 && t && !t.dead){
    const ang = Math.atan2(t.y - e.y, t.x - e.x);
    const sp = (e.dashSpeed || e.speed * 5) * dt;
    e.facing = Math.cos(ang) >= 0 ? 1 : -1;
    moveStep(e, Math.cos(ang) * sp, Math.sin(ang) * sp, { x: t.x, y: t.y });
    // 冲到河道里（目标就贴在河对岸的岸上）→ 算她「扑上岸」，落到目标那一侧，别站在水里
    if (e.y > RIVER_TOP && e.y < RIVER_BOT && (t.y <= RIVER_TOP || t.y >= RIVER_BOT)){
      let onB = false;
      for (const b of BRIDGE) if (Math.abs(e.x - b.x) < b.w / 2) onB = true;
      if (!onB) e.y = t.y <= RIVER_TOP ? RIVER_TOP - 2 : RIVER_BOT + 2;
    }
    return;
  }
  const wp = firstWaypoint(e, t);
  const ang = Math.atan2(wp.y - e.y, wp.x - e.x);
  // 攻城锤冲刺后速度从中等换成极快
  const spd = (e.charged && e.chargeSpeed) ? e.chargeSpeed : e.speed;
  const step = spd * dt * (e.slowT > 0 ? SLOW_RATE : 1) * (e.quakeT > 0 ? QUAKE_SLOW : 1) *
               (e.poisonT > 0 ? POISON_SLOW : 1) * (e.rageT > 0 ? RAGE_RATE : 1) * (e.bdash > 0 ? 5 : 1);
  e.facing = Math.cos(ang) >= 0 ? 1 : -1;
  const px0 = e.x, py0 = e.y;
  moveStep(e, Math.cos(ang) * step, Math.sin(ang) * step, wp);   // 撞到塔身会沿侧面滑过去

  // 攻城锤助跑：累计走过的距离，满 chargeDist 就进入冲刺（此后每帧冒一点土）
  if (e.chargeDist > 0 && !e.charged){
    e.chargeMoved += Math.hypot(e.x - px0, e.y - py0);
    if (e.chargeMoved >= e.chargeDist){
      e.charged = true;
      G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: 34, t:0, life:0.26, color:'#ffe0a8' });
    }
  }
  if (e.charged && e.chargeDist > 0){
    e.chargeFxT -= dt;
    if (e.chargeFxT <= 0){
      e.chargeFxT = 0.05;
      G.fx.push({ type:'spark', x:e.x, y:e.y + e.radius * 0.6, t:0, life:0.22, color:'#d8c090', r: e.radius * 0.55, n: 2 });
    }
  }

  // 野猪骑士：不绕桥，走到河边直接跳过去
  if (e.jumpRiver){ tryJump(e, ang); return; }

  // 河流约束（地面单位只能在桥附近过河）
  if (!e.flying && e.y > RIVER_TOP - 6 && e.y < RIVER_BOT + 6){
    let onBridge = false;
    for (const b of BRIDGE){
      if (Math.abs(e.x - b.x) < b.w/2 - 4){ onBridge = true; break; }
    }
    if (!onBridge){
      let b = BRIDGE[0], bd = Math.abs(e.x - b.x);
      for (const br of BRIDGE){
        const dd = Math.abs(e.x - br.x);
        if (dd < bd){ bd = dd; b = br; }
      }
      e.x += Math.sign(b.x - e.x) * Math.min(90 * dt, Math.abs(b.x - e.x));
    }
  }
}

function separate(){
  const list = G.ents;
  for (let i = 0; i < list.length; i++){
    const a = list[i];
    const aFix = a.isTower || a.isBuilding;   // 塔与建筑不可被推动
    for (let j = i + 1; j < list.length; j++){
      const b = list[j];
      const bFix = b.isTower || b.isBuilding;
      if (aFix && bFix) continue;
      // 塔不参与「单位互挤」：塔身是**方块**（半宽 41.4），而这里按圆（半径 46）算距离，
      // 单位贴着塔身侧面时圆距离只有 63.4 < 68，会被每帧往外推 4.6px ——
      // 站在塔正后方的兵因此永远爬不上去（表现为「卡在公主塔后面」）。
      // 塔的碰撞统一交给 pushOutOfTowers 的矩形判定处理。
      if (a.isTower || b.isTower) continue;
      // 已死的、以及精灵扑击途中（腾空）的都不参与挤压：
      // 自爆单位的落点就在目标身上，若还参与分离，落地那一帧会把目标顶开一大截，
      // 看起来就像"精灵有击退"。精灵系按皇室战争的原设定是没有击退的。
      if (a.dead || b.dead || a.dash > 0 || b.dash > 0) continue;
      if (a.flying !== b.flying) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dd = Math.hypot(dx, dy);
      const min = a.radius + b.radius;
      if (dd < min && dd > 0.001){
        const nx = dx / dd, ny = dy / dd;
        const total = min - dd;
        let wa, wb;
        if (aFix && !bFix){ wa = 0; wb = 1; }
        else if (bFix && !aFix){ wa = 1; wb = 0; }
        else { wa = 0.5; wb = 0.5; }
        a.x -= nx * total * wa; a.y -= ny * total * wa;
        b.x += nx * total * wb; b.y += ny * total * wb;
      }
    }
  }
  // 收尾：人群挤压可能把单位推出场边 / 挤进塔身，这里统一拉回（塔 / 建筑固定不动）
  for (const e of list){
    if (e.isTower || e.isBuilding) continue;
    e.x = clamp(e.x, e.radius + 4, AW - e.radius - 4);
    e.y = clamp(e.y, e.radius + 4, AH - e.radius - 4);
    pushOutOfTowers(e);      // 分离发生在 updateEnt 之后，塔边的挤压也要再推一次
  }
}

// ---------------- AI ----------------
function countInRadius(list, x, y, r){
  let n = 0;
  for (const e of list) if (Math.hypot(e.x - x, e.y - y) <= r) n++;
  return n;
}
function threatScore(e){
  const c = CARDS[e.cardId] || {};
  const dps = (e.dmg / e.hitSpeed) || 0;
  return e.maxHp / 12 + dps / 3 + (e.buildingsOnly ? 25 : 0);
}
function nearestPlayerTower(x){
  const ts = G.ents.filter(e => e.team === 'player' && e.isTower && !e.dead);
  let best = ts[0], bd = Infinity;
  for (const t of ts){ const d = Math.abs(t.x - x); if (d < bd){ bd = d; best = t; } }
  return best;
}

function aiPlay(i, x, y){
  const A = G.ai;
  const id = A.hand[i];
  if (!id) return false;
  const c = CARDS[id];
  if (A.elixir < c.cost) return false;
  x = clamp(x, 45, AW - 45);
  y = clamp(y, 45, AH - 45);
  if (!canDeploy('ai', x, y, c)){
    y = clamp(y, 60, DEPLOY_LINE - 40);
    x = clamp(x, 45, AW - 45);
    if (!canDeploy('ai', x, y, c)) return false;
  }
  A.elixir -= c.cost;
  doSpawn(id, 'ai', x, y);
  cycleCard(A, i);
  return true;
}

// 防御建筑的落点：己方半场**内部**的中线附近，不放桥头。
//   放在塔排与河之间偏后的位置，对面部队过河后会往里走——也就是"拉扯"：
//   它们被拖到中间，两座公主塔都能同时打到，而不是在桥头一对一换血。
function aiBuildingSpot(T){
  const midY = (TOWER_ROW + RIVER_TOP) / 2;     // ≈488：塔排(302)与河岸(674)的正中
  return {
    // 横向压在中路附近（往受威胁那一路偏一点点），两座塔都能覆盖
    x: clamp(AW/2 + rnd(-90, 90) + (T.x < AW/2 ? -30 : 30), 240, AW - 240),
    // 纵向限制在己方半场内部，离河岸至少 70
    y: clamp(midY + rnd(-45, 45), TOWER_ROW + 110, RIVER_TOP - 70)
  };
}

function aiUpdate(dt){
  const A = G.ai;
  const PR = AI_PROFILES[aiLevel] || AI_PROFILES.normal;
  A.think -= dt;
  if (A.think > 0) return;
  A.think = PR.think[0] + Math.random() * (PR.think[1] - PR.think[0]);
  A.idle = (A.idle || 0) + 1;

  const foes = G.ents.filter(e => e.team === 'player' && !e.dead && !e.isTower);
  const threats = foes.filter(e => e.y < RIVER_MID + 300);

  // —— 反应延迟 ——
  // 每个威胁第一次被 AI「注意到」时打上时间戳，之后要盯满 react 秒才会动手。
  // 以前是发现即出牌，一支部队刚过河就立刻被完美克制，像开了全图透视。
  for (const e of threats) if (e.aiSeen == null) e.aiSeen = G.t;
  const reacted = threats.filter(e => G.t - e.aiSeen >= PR.react);

  if (A.elixir < 1) return;
  const playable = A.hand.map((id, i) => ({ id, i, c: CARDS[id] })).filter(p => p.c.cost <= A.elixir);
  if (!playable.length) return;

  // ===== 1. 防守 =====
  // 只用「已经盯够 react 秒」的威胁来决定出手，但判断战场形势时仍看全量 threats
  if (reacted.length && Math.random() >= PR.skipDef){
    // 威胁排序：本身强度 + 「离己方塔多近」——越贴近塔越急，先处理
    const danger = e => threatScore(e) + Math.max(0, 700 - e.y) * 0.18;
    const sorted = reacted.slice().sort((a, b) => danger(b) - danger(a));
    const T = sorted[0];
    const airThreat = threats.some(t => t.flying);
    const swarm = threats.length >= 3;
    const bigHp = threats.some(t => t.maxHp >= TANK_HP);
    // 这一波的总价值（按费用估）：用来避免拿 7 费皮卡去砍一只 2 费小兵
    const threatVal = threats.reduce((a, t) => a + ((CARDS[t.cardId] || {}).cost || 2), 0);

    let best = null, bestS = -1e9;
    for (const p of playable){
      const c = p.c;
      let s = 0;
      if (c.type === 'spell'){
        // 召唤型法术（哥布林飞桶）：本身没伤害，价值在于「丢下去就是 3 个兵」
        if (c.spawnTroops){
          const near = countInRadius(threats, T.x, T.y, c.spellRadius + 30);
          s = near ? 16 + 7 * near - c.cost * 3 : -140;
        } else {
        // 法术按「能不能直接打死」估价：能斩杀的高费单位最值钱，其次是打残一片
        const inR = threats.filter(t => Math.hypot(t.x - T.x, t.y - T.y) <= (c.spellRadius || 0) + 20);
        let killVal = 0, hurt = 0;
        for (const t of inR){
          if (c.dmg >= t.hp) killVal += ((CARDS[t.cardId] || {}).cost || 2);
          else hurt += Math.min(c.dmg, t.hp) / Math.max(1, t.maxHp);
        }
        s = killVal * 26 + hurt * 16 + (inR.length >= 3 ? 45 : 0) - c.cost * 5;
        if (!inR.length) s = -160;
        }
      } else if (c.type === 'building'){
        s = 26 - c.cost * 2;
        if (airThreat && !c.targetsAir) s -= 70;
        // 对面是只打建筑的推进核心时，建筑能把它拉到中路
        if (threats.some(t => t.buildingsOnly)) s += 45;
      } else {
        if (airThreat && !c.targetsAir) s -= 150;
        if (bigHp && (c.dmg / c.hitSpeed) > 150) s += 70;
        if (swarm && (c.splash || c.spin)) s += 80;
        if (c.buildingsOnly) s -= 160;
        s += (c.hp / 100) * 1.4 + (c.dmg / c.hitSpeed) / 9 - c.cost * 3.2;
        // 圣水性价比：威胁不大时，别用贵牌去换
        if (c.cost > threatVal + 2) s -= 55;
      }
      if (s > bestS){ bestS = s; best = p; }
    }
    // 失误：随机换一张（低难度才会明显犯这种错）
    if (best && Math.random() < PR.badCounter){
      best = playable[(Math.random() * playable.length) | 0];
      bestS = 1;
    }
    if (best && bestS > 0){
      let x, y;
      const c = best.c;
      if (c.type === 'spell'){
        x = T.x + rnd(-PR.jitter, PR.jitter); y = T.y + rnd(-PR.jitter, PR.jitter);
      } else if (c.type === 'building'){
        const sp = aiBuildingSpot(T);
        x = sp.x; y = sp.y;
      } else if (c.range >= RG(3.5) && c.hp < 900){
        // 脆皮远程：放到公主塔**后面**，让塔先吃仇恨，自己安心输出
        const tw = G.ents.find(e => e.isTower && e.team === 'ai' && !e.dead &&
                                    e.kind === (T.x < AW / 2 ? 'left' : 'right'));
        const bx = tw ? tw.x : clamp(T.x, 130, AW - 130);
        const by = tw ? tw.y : TOWER_ROW;
        x = clamp(bx + rnd(-34, 34), 70, AW - 70);
        y = clamp(by - rnd(66, 104), 60, TOWER_ROW - 40);
      } else if (c.suicide || (c.count || 1) >= 4){
        // 自爆单位 / 大群：直接压在威胁身上，落地就围住
        x = clamp(T.x + rnd(-26, 26), 80, AW - 80);
        y = clamp(T.y + rnd(6, 30), 60, DEPLOY_LINE - 40);
      } else {
        // 近战：卡在威胁和塔之间，并往中路带一点，把对方拉离塔
        x = clamp(T.x + rnd(-PR.jitter, PR.jitter) + (T.x < AW / 2 ? 26 : -26), 80, AW - 80);
        y = clamp(T.y - rnd(58, 96), 90, DEPLOY_LINE - 40);
      }
      if (aiPlay(best.i, x, y)){
        A.idle = 0;
        A.counterUntil = G.t + 3.5;      // 防下来 3.5 秒内可以顺势反打
        return;
      }
    }

    // 兜底：牌都太贵、评分不过线，但对方已经压到塔前了 —— 出得起的最便宜部队也得上，
    // 否则「出不起 → 不换手牌 → 一直出不起」会把自己憋死。
    // 只有「真危险」才启动兜底：三只小骷髅交给塔自己处理就行，别拿 5 费去换
    const urgentVal = threats.reduce((a, t) => a + ((CARDS[t.cardId] || {}).cost || 2), 0);
    const urgent = threats.some(t => t.y < TOWER_ROW + 250) && urgentVal >= 3;
    if (urgent && A.elixir >= 3){
      const cheap = playable.filter(p => p.c.type === 'troop' && !p.c.buildingsOnly)
                            .sort((a, b) => a.c.cost - b.c.cost)[0];
      if (cheap){
        const cx = clamp(T.x + rnd(-30, 30), 80, AW - 80);
        const cy = clamp(T.y - rnd(45, 85), 90, DEPLOY_LINE - 40);
        if (aiPlay(cheap.i, cx, cy)){ A.idle = 0; A.counterUntil = G.t + 3.5; return; }
      }
    }
  }

  // ===== 2. 进攻 =====
  const myUnits = G.ents.filter(e => e.team === 'ai' && !e.dead && !e.isTower);
  const pushing = myUnits.filter(e => e.y > RIVER_MID - 120);
  const behind = A.crowns - G.player.crowns;

  // 读对方圣水：对方圣水低 = 可以放心压上；读不准时容易做出错误判断
  const foeE = Math.max(0, G.player.elixir + rnd(-PR.readErr, PR.readErr));
  const canPunish = foeE <= 4.6 || behind > 0;
  // 手里有推进核心（只打建筑 / 高血坦克）时更愿意主动开推
  const hasWinCon = playable.some(p => p.c.buildingsOnly || p.c.hp >= TANK_HP);
  // 反打窗口：刚防完 + 场上还有己方部队 + 圣水够，就不用等攒到 pushAt
  const counterPush = G.t < (A.counterUntil || 0) && myUnits.length > 0 && A.elixir >= 4.5;
  // 有敌方部队已经过河 → 先防守，别在桥头梭哈（防守要等反应时间，进攻却是立刻触发）
  const defendFirst = threats.some(t => t.y < RIVER_MID - 40);
  const wantPush = counterPush
                || (!defendFirst && ((A.elixir >= PR.pushAt && (PR.greedy || canPunish || A.elixir >= 9.6 || (hasWinCon && foeE <= 6.5)))
                                     || (A.idle >= PR.idleForce && A.elixir >= 6)));
  if (wantPush){
    const L = G.ents.find(e => e.team === 'player' && e.kind === 'left' && !e.dead);
    const R = G.ents.find(e => e.team === 'player' && e.kind === 'right' && !e.dead);
    let lane = null;
    // ① 己方已经有 2 个以上单位在往前推 → 顺势同路补兵（协同比另开一路强）
    const ahead = myUnits.filter(u => u.y < RIVER_MID + 80);
    if (ahead.length >= 2){
      const ax = ahead.reduce((a, e) => a + e.x, 0) / ahead.length;
      lane = ax < AW / 2 ? 0 : 1;
    }
    // ② 否则挑「没被防守 + 血量更低」的那座公主塔
    if (lane == null){
      const guarded = tw => !tw || G.ents.some(e => e.team === 'player' && !e.dead && !e.isTower &&
                                                   Math.hypot(e.x - tw.x, e.y - tw.y) < 210);
      const gL = guarded(L), gR = guarded(R);
      if (L && R) lane = (gL !== gR) ? (gL ? 1 : 0) : (L.hp <= R.hp ? 0 : 1);
      else if (L) lane = 0; else if (R) lane = 1;
      else lane = Math.random() < 0.5 ? 0 : 1;
    }

    let best = null, bestS = -1e9;
    for (const p of playable){
      const c = p.c;
      let s = 0;
      if (c.type === 'spell' || c.type === 'building') s = -120;
      else {
        if (c.buildingsOnly) s += 85;
        if (c.hp >= TANK_HP) s += 45;
        if (c.speed >= SP_FAST) s += 15;
        s += (c.dmg / c.hitSpeed) / 8 - c.cost * 2.8;
      }
      if (s > bestS){ bestS = s; best = p; }
    }
    if (best && bestS > 0){
      const bx = BRIDGE[lane].x;
      const x = clamp(bx + rnd(-PR.jitter * 0.5, PR.jitter * 0.5), 80, AW - 80);
      const y = DEPLOY_LINE - rnd(55, 100);
      if (aiPlay(best.i, x, y)){ A.idle = 0; return; }
    }
  }

  // ===== 2.5 哥布林飞桶：没有伤害，专门空投到对面公主塔蹭血 =====
  if (A.elixir >= 3 && (wantPush || A.elixir >= 7)){
    const bi = playable.findIndex(p => p.c.spawnTroops);
    if (bi >= 0){
      const L = G.ents.find(e => e.team === 'player' && e.kind === 'left' && !e.dead);
      const R = G.ents.find(e => e.team === 'player' && e.kind === 'right' && !e.dead);
      const tw = (L && R) ? (L.hp <= R.hp ? L : R) : (L || R);
      if (tw && aiPlay(playable[bi].i, tw.x + rnd(-22, 22), tw.y + rnd(-14, 14))){ A.idle = 0; return; }
    }
  }

  // ===== 3. 支援已有推进 =====
  if (pushing.length && A.elixir >= 4 && Math.random() < PR.support){
    const lead = pushing.reduce((a, b) => (a.y > b.y ? a : b));
    let best = null, bestS = -1e9;
    for (const p of playable){
      const c = p.c;
      if (c.type === 'spell' || c.type === 'building') continue;
      if (c.buildingsOnly) continue;
      let s = (c.hp / 100) * 1.2 + (c.dmg / c.hitSpeed) / 8 - c.cost * 2.5;
      if (s > bestS){ bestS = s; best = p; }
    }
    if (best){
      const x = clamp(lead.x + rnd(-40, 40), 80, AW - 80);
      const y = clamp(DEPLOY_LINE - rnd(80, 140), 90, DEPLOY_LINE - 45);
      if (aiPlay(best.i, x, y)){ A.idle = 0; return; }
    }
  }

  // ===== 4. 圣水快溢出 + 场上没威胁 → 在**自己半场后方**出一张便宜的，别把圣水憋着 =====
  //   必须没有威胁才触发：否则会把本该留着防守的手牌提前丢到桥头。
  if (A.elixir >= 9.4 && !threats.length){
    const cheap = playable.filter(p => p.c.type !== 'spell').sort((a, b) => a.c.cost - b.c.cost)[0];
    if (cheap){
      const x = clamp(AW / 2 + rnd(-130, 130), 120, AW - 120);
      const y = clamp(TOWER_ROW + rnd(150, 260), TOWER_ROW + 100, RIVER_TOP - 60);
      if (aiPlay(cheap.i, x, y)){ A.idle = 0; return; }
    }
  }
}

// ---------------- 绘制 ----------------
function draw(){
  // 草地
  ctx.fillStyle = '#7cc45f';
  ctx.fillRect(0, 0, AW, AH);
  for (let i = 0; i < AH; i += 58){
    if (((i / 58) | 0) % 2 === 0){ ctx.fillStyle = '#76bd59'; ctx.fillRect(0, i, AW, 58); }
  }
  ctx.fillStyle = 'rgba(255,90,90,0.055)'; ctx.fillRect(0, 0, AW, RIVER_TOP);
  ctx.fillStyle = 'rgba(70,140,255,0.055)'; ctx.fillRect(0, RIVER_BOT, AW, AH - RIVER_BOT);

  // 河
  const g = ctx.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  g.addColorStop(0, '#4fa8dd'); g.addColorStop(0.5, '#3d8fc9'); g.addColorStop(1, '#4fa8dd');
  ctx.fillStyle = g;
  ctx.fillRect(0, RIVER_TOP, AW, RIVER_BOT - RIVER_TOP);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++){
    ctx.beginPath();
    for (let x = 0; x <= AW; x += 16){
      const y = RIVER_MID - 20 + k * 20 + Math.sin(x * 0.035 + G.t * 2 + k) * 3;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // 桥
  for (const b of BRIDGE){
    ctx.fillStyle = '#b98a52';
    roundRect(b.x - b.w/2, RIVER_TOP - 8, b.w, RIVER_BOT - RIVER_TOP + 16, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    const bh = RIVER_BOT - RIVER_TOP + 16;        // 桥面总长（含两端搭在岸上的部分）
    for (let i = 0; i < 6; i++){
      ctx.fillRect(b.x - b.w/2 + 4, RIVER_TOP - 8 + 6 + i * ((bh - 12) / 5), b.w - 8, 3);
    }
    ctx.strokeStyle = '#8a6437'; ctx.lineWidth = 3;
    roundRect(b.x - b.w/2, RIVER_TOP - 8, b.w, RIVER_BOT - RIVER_TOP + 16, 6);
    ctx.stroke();
  }

  // 部署区
  const sel = G.selected !== null ? G.player.hand[G.selected] : null;
  if (sel){
    const c = CARDS[sel];
    ctx.save();
    if (c.type === 'spell'){
      ctx.fillStyle = 'rgba(255,200,60,0.10)';
      ctx.fillRect(0, 0, AW, AH);
    } else {
      ctx.fillStyle = 'rgba(90,160,255,0.20)';
      // 己方半场：桥的正中间往下
      ctx.fillRect(0, DEPLOY_LINE, AW, AH - DEPLOY_LINE);
      // 已推掉的塔那一侧：解锁到「距公主塔 4 格」的那条线（≈ 敌方国王塔那一排）
      if (!towerAlive('ai','left'))  ctx.fillRect(0, TOWER_OPEN_ROW, AW/2, DEPLOY_LINE - TOWER_OPEN_ROW);
      if (!towerAlive('ai','right')) ctx.fillRect(AW/2, TOWER_OPEN_ROW, AW/2, DEPLOY_LINE - TOWER_OPEN_ROW);
      // 边界线
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(0, DEPLOY_LINE - 1.5, AW, 3);
      if (!towerAlive('ai','left')){
        ctx.fillRect(0, TOWER_OPEN_ROW - 1.5, AW/2, 3);
        ctx.fillRect(AW/2 - 1.5, TOWER_OPEN_ROW, 3, DEPLOY_LINE - TOWER_OPEN_ROW);
      }
      if (!towerAlive('ai','right')){
        ctx.fillRect(AW/2, TOWER_OPEN_ROW - 1.5, AW/2, 3);
        ctx.fillRect(AW/2 - 1.5, TOWER_OPEN_ROW, 3, DEPLOY_LINE - TOWER_OPEN_ROW);
      }
    }
    ctx.restore();
  }

  // 实体（按 y 排序）
  const list = G.ents.slice().sort((a, b) => a.y - b.y);

  // 建筑射程圈：只给「自己场上」的加农炮 / 电磁塔画（敌方的不画，免得干扰视线）
  for (const e of list){
    if (!e.isBuilding || e.dead || e.team !== 'player') continue;
    drawRangeRing(e.x, e.y, e.range, '#4a7dff', { strokeAlpha: 0.32, fillAlpha: 0.05 });
    // 迫击炮：把盲区也画出来，玩家才知道哪一块打不到
    if (e.minRange) drawRangeRing(e.x, e.y, e.minRange, '#ff9a5a', { strokeAlpha: 0.34, fillAlpha: 0.05, dash: [7, 7] });
  }

  // 狂暴区域：画在地面上、单位之下
  for (const z of (G.zones || [])) (z.kind === 'vines' ? drawVinesZone(z) : z.kind === 'quake' ? drawQuakeZone(z) : z.kind === 'tornado' ? drawTornadoZone(z) : z.kind === 'poison' ? drawPoisonZone(z) : drawRageZone(z));
  for (const b of (G.burrows || [])) drawMinerBurrow(b);

  // 按 y 排序绘制：站在塔「后面」（y 更小）的单位先画，塔再盖上去；
  //   站在塔前面的后画。否则塔后的单位会糊在塔冠上，看起来像穿过去了。
  const byDepth = list.slice().sort((a, b) => a.y - b.y);
  for (const e of byDepth){
    if (e.isTower) drawTower(e); else drawUnit(e);
  }
  // 正在滚的滚木 / 木桶（画在单位之上，滚过谁就压过谁）
  for (const r of (G.rolls || [])) drawRoll(r);
  // 眩晕 / 减速标记（雷电法术、大雪球、冰人亡语）——塔和单位都画，统一在单位之后叠一层
  for (const e of list){
    if (e.stun > 0) drawStunMark(e);
    else if (e.slowT > 0) drawSlowMark(e);
  }
  // 血条（单位）—— 部署中按同样的缩放跟随精灵，避免"小棋子顶着大血条"
  for (const e of list){
    // 建筑的生命条 = 血量 + 剩余时间，是它唯一的生命指示，所以一直显示
    if (e.isTower || (!e.isBuilding && e.hp >= e.maxHp && !(e.shield > 0))) continue;
    const sc = e.spawnT > 0 ? 0.55 + clamp(1 - e.spawnT / DEPLOY_TIME, 0, 1) * 0.45 : 1;
    drawHpBar(e, e.y + (e.flying ? -e.radius * 0.7 : 0) - e.radius * sc - 13, e.radius * 2.2 * sc);
  }

  // 特效
  for (const f of G.fx) drawFx(f);

  // 拖拽指示
  if (G.hover && sel){
    const { x, y } = G.hover;
    const c = CARDS[sel];
    const ok = canDeploy('player', x, y, c);
    if (c.rollDist){
      drawRollPreview(x, y, c, ok);        // 滚木 / 滚筒：画滚过去的长条，不画小圆
    } else {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(x, y, c.type === 'spell' ? c.spellRadius : 42, 0, Math.PI*2);
      ctx.fillStyle = ok ? 'rgba(90,200,255,0.28)' : 'rgba(255,70,70,0.28)';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = ok ? '#3aa0ff' : '#ff4646';
      ctx.stroke();
      ctx.restore();
    }

    // 建筑：把落地后的攻击射程一并画出来，并在圈顶标注格数
    if (c.type === 'building'){
      const col = ok ? '#3aa0ff' : '#ff4646';
      drawRangeRing(x, y, c.range, col, { strokeAlpha: 0.9, fillAlpha: 0.07, width: 3, dash: [13, 9] });
      // 迫击炮这种有盲区的建筑：把内圈也画出来，不然玩家看不出「贴身打不到」
      if (c.minRange){
        drawRangeRing(x, y, c.minRange, '#ff9a5a', { strokeAlpha: 0.85, fillAlpha: 0.06, width: 2.5, dash: [7, 7] });
        ctx.save();
        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.62)';
        const bt = '盲区 ' + (c.minRange / TILE).toFixed(1) + ' 格';
        const by2 = y + Math.max(46, c.minRange * 0.55);   // 别被卡牌图标挡住
        ctx.strokeText(bt, x, by2);
        ctx.fillStyle = '#ffd0a8';
        ctx.fillText(bt, x, by2);
        ctx.restore();
      }
      ctx.save();
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.62)';
      const txt = '射程 ' + (c.range / TILE).toFixed(1) + ' 格';
      const lx = clamp(x, 72, AW - 72);          // 靠边时把标签拉回场内，避免被裁掉
      const ly = Math.max(22, y - c.range - 16);
      ctx.strokeText(txt, lx, ly);
      ctx.fillStyle = '#fff';
      ctx.fillText(txt, lx, ly);
      ctx.restore();
    }
  }
}

// 滚动法术的落点预览：一条「滚过去」的长条 —— 宽 = rollWidth、长 = rollDist，朝敌方（向上）。
//   普通法术画的是圆形范围，滚木 / 滚筒用长条才看得出「滚多远、多宽、滚到哪停」。
function drawRollPreview(x, y, c, ok){
  const col = ok ? '#3aa0ff' : '#ff4646';
  const hw = c.rollWidth / 2;
  const yEnd = Math.max(26, y - c.rollDist);      // 滚到场地边缘就停
  const h = y - yEnd;
  ctx.save();
  ctx.globalAlpha = 0.9;

  // 长条本体
  ctx.beginPath();
  roundRect(x - hw, yEnd, c.rollWidth, h, hw * 0.85);
  ctx.fillStyle = ok ? 'rgba(90,200,255,0.15)' : 'rgba(255,70,70,0.15)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = col;
  ctx.setLineDash([12, 9]);
  ctx.stroke();
  ctx.setLineDash([]);

  // 起点（投放点）
  ctx.beginPath(); ctx.arc(x, y, hw * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = ok ? 'rgba(90,200,255,0.40)' : 'rgba(255,70,70,0.40)';
  ctx.fill();

  // 终点箭头（朝滚动方向）
  const ay = yEnd + 6;
  ctx.beginPath();
  ctx.moveTo(x - 9, ay + 13); ctx.lineTo(x, ay); ctx.lineTo(x + 9, ay + 13);
  ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col;
  ctx.stroke();

  ctx.restore();
}

// 掘地矿工在地下赶路：土包 + 身后扬起的土粒 + 通往目标点的虚线
//   虚线只画「还没走完的那一段」，玩家能看出它往哪钻、还剩多久到。
function drawMinerBurrow(b){
  const p = 1 - b.t / b.dur;
  const x = b.x0 + (b.x1 - b.x0) * p, y = b.y0 + (b.y1 - b.y0) * p;
  ctx.save();
  // 1) 剩余路径：细虚线（越接近目标越短）
  ctx.globalAlpha = 0.30;
  ctx.strokeStyle = '#7a5a24';
  ctx.lineWidth = 2.2;
  ctx.setLineDash([7, 9]);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(b.x1, b.y1); ctx.stroke();
  ctx.setLineDash([]);

  // 2) 身后扬起的土粒
  for (let i = 1; i <= 6; i++){
    const pp = Math.max(0, p - i * 0.030);
    const tx = b.x0 + (b.x1 - b.x0) * pp, ty = b.y0 + (b.y1 - b.y0) * pp;
    ctx.globalAlpha = 0.45 * (1 - i / 7);
    ctx.fillStyle = '#8a6a34';
    ctx.beginPath(); ctx.arc(tx + Math.sin(i * 2.1 + G.t * 6) * 6, ty + Math.cos(i * 1.7 + G.t * 5) * 5,
                             6 - i * 0.6, 0, Math.PI * 2); ctx.fill();
  }

  // 3) 隆起的土包（比单位略大，压在地面上）
  const wob = Math.sin(G.t * 16) * 2.2;
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(60,42,16,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 6, 24, 12, 0, 0, Math.PI * 2); ctx.fill();   // 影子
  ctx.fillStyle = '#6f5228';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 21, 13 + wob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a37c3c';
  ctx.beginPath(); ctx.ellipse(x, y - 1, 16, 10 - wob * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9a86a';
  ctx.beginPath(); ctx.ellipse(x - 3, y - 4, 7, 4.5, -0.4, 0, Math.PI * 2); ctx.fill();   // 高光

  // 4) 甩出来的碎石
  ctx.fillStyle = 'rgba(150,116,58,0.85)';
  for (let i = 0; i < 4; i++){
    const a = G.t * 8 + i * 1.57;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * 20, y + Math.sin(a) * 12, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// 飓风：淡蓝风圈 + 4 条往里收的螺旋 + 中心风眼
function drawTornadoZone(z){
  const fade = clamp(z.t / 0.4, 0, 1);
  const t = G.t;
  ctx.save();
  const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.10, z.x, z.y, z.r);
  g.addColorStop(0, 'rgba(225,248,255,0.62)');
  g.addColorStop(0.70, 'rgba(150,218,245,0.36)');
  g.addColorStop(1, 'rgba(120,190,230,0)');
  ctx.globalAlpha = fade * 0.9;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();

  ctx.globalAlpha = fade * 0.9;
  for (let i = 0; i < 4; i++){
    ctx.strokeStyle = i % 2 ? 'rgba(240,252,255,0.95)' : 'rgba(160,222,248,0.9)';
    ctx.lineWidth = 3.6 - i * 0.3;
    ctx.beginPath();
    for (let k = 0; k <= 26; k++){
      const u = k / 26;
      const rr = z.r * (1 - u * 0.92);
      const a = t * 7 + i * Math.PI / 2 + u * 3.4;
      const px = z.x + Math.cos(a) * rr, py = z.y + Math.sin(a) * rr * 0.85;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(240,252,255,0.9)';
  ctx.beginPath(); ctx.arc(z.x, z.y, 4 + Math.sin(t * 14) * 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 毒药池：暗绿底 + 冒泡 + 边缘一圈荧光绿
function drawPoisonZone(z){
  const fade = clamp(z.t / 0.6, 0, 1);
  ctx.save();
  const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.1, z.x, z.y, z.r);
  g.addColorStop(0, 'rgba(120,200,70,0.34)');
  g.addColorStop(0.72, 'rgba(70,140,40,0.26)');
  g.addColorStop(1, 'rgba(60,120,30,0.02)');
  ctx.globalAlpha = fade;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,240,120,0.55)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.97, 0, Math.PI * 2); ctx.stroke();
  // 冒泡
  for (let i = 0; i < 7; i++){
    const ph = (G.t * 0.7 + i * 0.37) % 1;
    const a = i * 2.4 + G.t * 0.3;
    const rr = z.r * (0.25 + 0.6 * ((i * 0.13 + G.t * 0.25) % 1));
    ctx.globalAlpha = fade * (1 - ph) * 0.75;
    ctx.fillStyle = i % 2 ? '#b8f078' : '#7ac04a';
    ctx.beginPath(); ctx.arc(z.x + Math.cos(a) * rr, z.y + Math.sin(a) * rr, 2.5 + ph * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawQuakeZone(z){
  const fade = clamp(z.t / 0.45, 0, 1);
  const shake = 1 + 0.02 * Math.sin(G.t * 26);      // 地面在抖
  ctx.save();
  ctx.globalAlpha = fade;
  // 焦土底色
  const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.12, z.x, z.y, z.r);
  g.addColorStop(0, 'rgba(96,66,32,0.55)');
  g.addColorStop(0.62, 'rgba(84,58,28,0.40)');
  g.addColorStop(0.90, 'rgba(70,48,22,0.20)');
  g.addColorStop(1, 'rgba(60,40,18,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r * shake, 0, Math.PI * 2); ctx.fill();

  // 裂纹：6 条折线从中心往外劈开
  ctx.strokeStyle = 'rgba(255,206,120,' + (0.55 + 0.25 * Math.sin(G.t * 12)).toFixed(2) + ')';
  ctx.lineWidth = 2.6;
  for (let i = 0; i < 6; i++){
    const a0 = i * Math.PI / 3 + 0.4;
    ctx.beginPath();
    ctx.moveTo(z.x, z.y);
    for (let s = 1; s <= 3; s++){
      const rr = z.r * (s / 3) * 0.95;
      const aa = a0 + Math.sin(G.t * 3 + i * 2 + s) * 0.16;
      ctx.lineTo(z.x + Math.cos(aa) * rr, z.y + Math.sin(aa) * rr);
    }
    ctx.stroke();
  }
  // 外圈
  ctx.strokeStyle = 'rgba(230,170,90,0.55)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.98 * shake, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawVinesZone(z){
  const fade = clamp(z.t / 0.45, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 6.2);
  ctx.save();
  ctx.globalAlpha = fade;
  // 地面：暗绿底 + 边缘淡出
  const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.10, z.x, z.y, z.r);
  g.addColorStop(0, 'rgba(38,96,52,0.50)');
  g.addColorStop(0.62, 'rgba(30,82,44,0.38)');
  g.addColorStop(0.90, 'rgba(22,66,36,0.18)');
  g.addColorStop(1, 'rgba(18,58,32,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();

  // 缠住的外圈
  ctx.strokeStyle = 'rgba(126,214,132,' + (0.55 + 0.28 * pulse).toFixed(2) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.955 + 0.03 * pulse), 0, Math.PI * 2); ctx.stroke();

  // 藤蔓：8 条从边缘往中心卷的曲线，随时间摆动
  for (let i = 0; i < 8; i++){
    const a0 = i * Math.PI / 4 + Math.sin(G.t * 1.4 + i) * 0.12;
    const a1 = a0 + 0.55 * Math.sin(G.t * 2.1 + i * 1.7);
    ctx.strokeStyle = 'rgba(96,186,110,0.85)';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(z.x + Math.cos(a0) * z.r * 0.96, z.y + Math.sin(a0) * z.r * 0.96);
    ctx.quadraticCurveTo(
      z.x + Math.cos(a0 + a1) * z.r * 0.55, z.y + Math.sin(a0 + a1) * z.r * 0.55,
      z.x + Math.cos(a1) * z.r * 0.22,     z.y + Math.sin(a1) * z.r * 0.22);
    ctx.stroke();
  }
  // 中心嫩芽
  ctx.fillStyle = 'rgba(190,255,196,0.9)';
  ctx.beginPath(); ctx.arc(z.x, z.y, 3.4 + pulse * 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 狂暴区域：紫色地面光圈 + 旋转符文点，最后 0.5 秒淡出
function drawRageZone(z){
  const fade = clamp(z.t / 0.5, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 7.5);
  ctx.save();
  ctx.globalAlpha = fade;
  const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.10, z.x, z.y, z.r);
  g.addColorStop(0, 'rgba(168,44,214,0.46)');
  g.addColorStop(0.60, 'rgba(142,30,196,0.34)');
  g.addColorStop(0.88, 'rgba(120,22,172,0.16)');
  g.addColorStop(1, 'rgba(110,18,160,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = 'rgba(212,86,246,' + (0.62 + 0.30 * pulse).toFixed(2) + ')';
  ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.965 + 0.025 * pulse), 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = 'rgba(250,168,255,0.9)';
  for (let i = 0; i < 6; i++){
    const a = G.t * 1.5 + i * Math.PI / 3;
    ctx.beginPath();
    ctx.arc(z.x + Math.cos(a) * z.r * 0.76, z.y + Math.sin(a) * z.r * 0.76, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 射程圈：虚线圈 + 极淡填充。建筑类卡牌（加农炮 / 电磁塔）用它提示火力覆盖范围
function drawRangeRing(x, y, r, color, opt){
  opt = opt || {};
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if (opt.fillAlpha){
    ctx.globalAlpha = opt.fillAlpha;
    ctx.fillStyle = color;
    ctx.fill();
  }
  ctx.setLineDash(opt.dash || [9, 8]);
  ctx.lineWidth = opt.width || 2.5;
  ctx.strokeStyle = color;
  ctx.globalAlpha = opt.strokeAlpha !== undefined ? opt.strokeAlpha : 0.35;
  ctx.stroke();
  ctx.restore();
}

// 盾形路径（徽记底板）：上平、两侧直下、底部收成尖角
function shieldPath(cx, cy, w, h){
  const l = cx - w/2, r = cx + w/2, t = cy - h/2, b = cy + h/2;
  ctx.beginPath();
  ctx.moveTo(l, t);
  ctx.lineTo(r, t);
  ctx.lineTo(r, t + h * 0.52);
  ctx.quadraticCurveTo(r, b - h * 0.16, cx, b);
  ctx.quadraticCurveTo(l, b - h * 0.16, l, t + h * 0.52);
  ctx.closePath();
}

// 塔：石基 → 塔身（队伍色渐变 + 石缝 + 圆柱感 + 角柱）→ 悬挑顶台 → 城垛
//   国王塔额外镶金边、徽记加金环、脚下有金光；未激活时整体褪成灰并挂锁
function drawTower(t){
  const s = t.radius * 1.8;
  const x = t.x, y = t.y;
  const isP = t.team === 'player';
  const king = t.kind === 'king';
  const off = king && !t.active;

  // —— 调色 ——
  const light = off ? '#d3d6dd' : (isP ? '#a8c6ff' : '#ffbcbc');
  const col   = off ? '#9ea2ab' : (isP ? '#4a7dff' : '#ff5a5a');
  const dark  = off ? '#63676f' : (isP ? '#22417f' : '#8f2020');
  const stL   = off ? '#cdd0d7' : '#f2ece1';      // 石材亮面
  const st    = off ? '#a6a9b1' : '#d2cbbb';      // 石材主色
  const stD   = off ? '#797d85' : '#a79f8c';      // 石材暗面
  const stEdge = 'rgba(46,38,26,0.36)';
  const gold  = off ? '#a9a9a9' : '#f7c948';
  const goldD = off ? '#7c7c7c' : '#b8860b';

  // —— 几何 ——
  const bw = s, bh = s;
  const left = x - bw/2, bodyTop = y - bh/2, bodyBot = bodyTop + bh;
  const plinthH = s * 0.12, plinthW = bw * 1.18;
  const capH = s * 0.12, capW = bw * 1.13, capY = bodyTop - capH;
  const merN = king ? 5 : 4;
  const merH = s * 0.19;
  const merSpan = capW * 0.86;
  const merW = merSpan / (merN + (merN - 1) * 0.55);
  const merTop = capY - merH;
  const visualTop = merTop;

  ctx.save();

  // 地面阴影
  ctx.globalAlpha = 0.26;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, bodyBot + plinthH * 1.0, bw * 0.63, s * 0.15, 0, 0, 7);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 国王塔激活后：脚下一圈金光
  if (king && !off){
    const gg = ctx.createRadialGradient(x, bodyBot, s*0.1, x, bodyBot, s*0.9);
    gg.addColorStop(0, 'rgba(255,214,90,0.34)');
    gg.addColorStop(0.6, 'rgba(255,196,60,0.12)');
    gg.addColorStop(1, 'rgba(255,196,60,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(x, bodyBot + plinthH * 0.5, s * 0.9, s * 0.34, 0, 0, 7);
    ctx.fill();
  }

  // 石基（比塔身宽一圈，坐在地上）
  const pY = bodyBot - plinthH * 0.45;
  const pg = ctx.createLinearGradient(0, pY, 0, pY + plinthH * 1.45);
  pg.addColorStop(0, stL); pg.addColorStop(0.42, st); pg.addColorStop(1, stD);
  roundRect(x - plinthW/2, pY, plinthW, plinthH * 1.45, 5);
  ctx.fillStyle = pg; ctx.fill();
  ctx.strokeStyle = stEdge; ctx.lineWidth = 1.6; ctx.stroke();

  // 塔身
  const bg = ctx.createLinearGradient(0, bodyTop, 0, bodyBot);
  bg.addColorStop(0, light); bg.addColorStop(0.42, col); bg.addColorStop(1, dark);
  roundRect(left, bodyTop, bw, bh, 7);
  ctx.fillStyle = bg; ctx.fill();

  // 左右压暗 + 左侧高光 → 圆柱感
  const shg = ctx.createLinearGradient(left, 0, left + bw, 0);
  shg.addColorStop(0, 'rgba(0,0,0,0.20)');
  shg.addColorStop(0.15, 'rgba(255,255,255,0.18)');
  shg.addColorStop(0.5, 'rgba(255,255,255,0)');
  shg.addColorStop(0.85, 'rgba(0,0,0,0.10)');
  shg.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = shg;
  roundRect(left, bodyTop, bw, bh, 7); ctx.fill();

  // 石缝（横缝 + 错位短竖缝）+ 顶台压在塔身上的投影
  ctx.save();
  roundRect(left, bodyTop, bw, bh, 7); ctx.clip();
  const rows = 4;
  for (let i = 1; i < rows; i++){
    const yy = bodyTop + bh * i / rows;
    ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fillRect(left, yy - 1, bw, 1.6);
    ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(left, yy + 0.6, bw, 1.1);
    // 竖缝只画半截、压得很淡，太规整会像瓷砖
    for (const o of (i % 2 ? [0.30, 0.70] : [0.50])){
      ctx.fillStyle = 'rgba(0,0,0,0.045)';
      ctx.fillRect(left + bw * o - 0.8, yy + 1, 1.6, bh / rows * 0.52);
    }
  }
  const capShadow = ctx.createLinearGradient(0, bodyTop, 0, bodyTop + s * 0.14);
  capShadow.addColorStop(0, 'rgba(0,0,0,0.26)');
  capShadow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = capShadow;
  ctx.fillRect(left, bodyTop, bw, s * 0.14);
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 2.2;
  roundRect(left, bodyTop, bw, bh, 7); ctx.stroke();

  // 角柱：左右各一条竖直暗带 + 一道亮边，做出壁柱的立体感但不抢队伍色
  const buttW = s * 0.075;
  for (const bx of [left + 2.5, left + bw - buttW - 2.5]){
    const bgg = ctx.createLinearGradient(bx, 0, bx + buttW, 0);
    bgg.addColorStop(0, 'rgba(0,0,0,0.30)');
    bgg.addColorStop(0.30, 'rgba(0,0,0,0.12)');
    bgg.addColorStop(0.62, 'rgba(0,0,0,0.04)');
    bgg.addColorStop(1, 'rgba(0,0,0,0.22)');
    roundRect(bx, bodyTop + 4, buttW, bh - 8, 3);
    ctx.fillStyle = bgg; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.fillRect(bx + buttW - 1.2, bodyTop + 6, 1.2, bh - 12);
  }

  // 拱门：底部开一道门洞，一眼就能看出这是"城堡"而不是个盒子
  const gw = s * 0.30, gh = s * 0.22;
  const gx = x - gw/2, gBot = bodyBot - s * 0.02, gTop = gBot - gh;
  const gCy = gTop + gw * 0.5;
  // 门框
  ctx.beginPath();
  ctx.moveTo(gx - 2.6, gBot);
  ctx.lineTo(gx - 2.6, gCy);
  ctx.arc(x, gCy, gw/2 + 2.6, Math.PI, 0);
  ctx.lineTo(gx + gw + 2.6, gBot);
  ctx.closePath();
  ctx.fillStyle = off ? '#7c8088' : stD; ctx.fill();
  // 门洞
  ctx.beginPath();
  ctx.moveTo(gx, gBot);
  ctx.lineTo(gx, gCy);
  ctx.arc(x, gCy, gw/2, Math.PI, 0);
  ctx.lineTo(gx + gw, gBot);
  ctx.closePath();
  const dg = ctx.createLinearGradient(0, gTop, 0, gBot);
  dg.addColorStop(0, '#2b1e13'); dg.addColorStop(1, '#0f0a06');
  ctx.fillStyle = dg; ctx.fill();
  // 门里一点暖光，避免糊成一块黑
  const wl = ctx.createRadialGradient(x, gBot - gh * 0.25, 1, x, gBot - gh * 0.25, gw * 0.62);
  wl.addColorStop(0, 'rgba(255,196,110,0.42)');
  wl.addColorStop(1, 'rgba(255,196,110,0)');
  ctx.fillStyle = wl;
  ctx.beginPath();
  ctx.moveTo(gx, gBot);
  ctx.lineTo(gx, gCy);
  ctx.arc(x, gCy, gw/2, Math.PI, 0);
  ctx.lineTo(gx + gw, gBot);
  ctx.closePath();
  ctx.fill();

  // 掉血裂纹：画在徽记之前（不能压在盾牌上），只落在塔身左右两侧
  //   用 id 做种子，同一座塔的裂纹位置固定不抖
  const hpP = clamp(t.hp / t.maxHp, 0, 1);
  const nCrack = hpP < 0.34 ? 3 : (hpP < 0.67 ? 2 : 0);
  if (nCrack){
    const rnd = k => { const v = Math.sin(t.id * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
    ctx.save();
    roundRect(left, bodyTop, bw, bh, 7); ctx.clip();
    for (let i = 0; i < nCrack; i++){
      const side = i % 2 ? 0.13 + rnd(i) * 0.10 : 0.72 + rnd(i) * 0.10;
      let px = left + bw * side;
      let py = bodyTop + bh * (0.08 + rnd(i + 10) * 0.22);
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let k = 0; k < 3; k++){
        px += (rnd(i * 7 + k) - 0.5) * bw * 0.13;
        py += bh * (0.09 + rnd(i * 5 + k + 3) * 0.06);
        ctx.lineTo(px, py);
      }
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(18,10,4,0.50)'; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.26)'; ctx.lineWidth = 0.9; ctx.stroke();
    }
    ctx.restore();
  }

  // 盾形徽记
  const sw = s * 0.46, sh = s * 0.50, sy = y - s * 0.06;
  shieldPath(x, sy, sw + 5, sh + 5);
  ctx.fillStyle = off ? '#5b5e66' : (isP ? '#1b3568' : '#7a1c1c');
  ctx.fill();
  shieldPath(x, sy, sw, sh);
  const sg = ctx.createLinearGradient(0, sy - sh/2, 0, sy + sh/2);
  sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#e6e8ee');
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.2; ctx.stroke();
  // 国王塔：徽记外再套一圈金环
  if (king){
    shieldPath(x, sy, sw + 9, sh + 9);
    ctx.strokeStyle = gold; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.strokeStyle = goldD; ctx.lineWidth = 0.9; ctx.stroke();
  }
  ctx.font = (s * 0.37 | 0) + 'px "Segoe UI Emoji",system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(off ? '🔒' : (king ? '👑' : '🏰'), x, sy + s * 0.015);

  // 悬挑顶台
  const cg = ctx.createLinearGradient(0, capY, 0, capY + capH);
  cg.addColorStop(0, stL); cg.addColorStop(0.45, st); cg.addColorStop(1, stD);
  roundRect(x - capW/2, capY, capW, capH, 4);
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = stEdge; ctx.lineWidth = 1.6; ctx.stroke();
  if (king){                                  // 国王塔顶台镶一道金边
    ctx.fillStyle = gold;
    roundRect(x - capW/2 + 3, capY + 1.6, capW - 6, 2.4, 1.2); ctx.fill();
  }

  // 城垛（每块带左亮右暗的立面）
  const merGap = (merSpan - merN * merW) / (merN - 1);
  for (let i = 0; i < merN; i++){
    const mx = x - merSpan/2 + i * (merW + merGap);
    const mg = ctx.createLinearGradient(0, merTop, 0, capY + 1);
    mg.addColorStop(0, light); mg.addColorStop(0.55, col); mg.addColorStop(1, dark);
    roundRect(mx, merTop, merW, merH + 2, 2.5);
    ctx.fillStyle = mg; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.24)';
    ctx.fillRect(mx + 1.6, merTop + 1.8, merW * 0.26, merH - 3);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(mx + merW * 0.74, merTop + 1.8, merW * 0.22, merH - 3);
  }

  ctx.restore();

  // 激活瞬间：整座塔闪一下白光
  if (t.flash > 0){
    ctx.save();
    ctx.globalAlpha = clamp(t.flash / 0.9, 0, 1) * 0.62;
    ctx.fillStyle = '#fff';
    roundRect(left - 6, visualTop - 6, bw + 12, (bodyBot + plinthH) - visualTop + 12, 12);
    ctx.fill();
    ctx.restore();
  }

  // 未激活角标
  if (off){
    ctx.save();
    const label = '未激活';
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(label).width + 20;
    const ly = bodyBot + plinthH * 1.45 + 14;
    ctx.fillStyle = 'rgba(24,28,38,0.82)';
    roundRect(x - w/2, ly - 11, w, 22, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.38)'; ctx.lineWidth = 1.5;
    roundRect(x - w/2, ly - 11, w, 22, 11); ctx.stroke();
    ctx.fillStyle = '#d8dce6';
    ctx.fillText(label, x, ly + 0.5);
    ctx.restore();
  }

  drawTowerHp(t, visualTop - 26, s * 1.12);
}

// 塔的血量条 + 数值
function drawTowerHp(t, y, w){
  const p = clamp(t.hp / t.maxHp, 0, 1);
  const h = 20;
  const x = t.x - w / 2;

  // 底板
  ctx.save();
  ctx.fillStyle = 'rgba(10,18,32,0.75)';
  roundRect(x - 3, y - 3, w + 6, h + 6, (h + 6) / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  roundRect(x - 3, y - 3, w + 6, h + 6, (h + 6) / 2); ctx.stroke();

  // 血量填充
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  if (t.team === 'player'){ bg.addColorStop(0, '#9dcbff'); bg.addColorStop(1, '#2f7fe8'); }
  else { bg.addColorStop(0, '#ffaaaa'); bg.addColorStop(1, '#e03b3b'); }
  ctx.fillStyle = bg;
  roundRect(x, y, Math.max(4, w * p), h, h / 2); ctx.fill();

  // 低血量闪烁
  if (p <= 0.25){
    ctx.globalAlpha = 0.28 + 0.28 * Math.sin(G.t * 12);
    ctx.fillStyle = '#fff';
    roundRect(x, y, Math.max(4, w * p), h, h / 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 数值
  const txt = String(Math.max(0, Math.ceil(t.hp)));
  ctx.font = 'bold ' + Math.round(h * 0.68) + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(txt, t.x, y + h / 2 + 0.5);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, t.x, y + h / 2 + 0.5);
  ctx.restore();
}

// 棋子本体：队伍色外环 + 卡牌色内圈 + 白色底盘 + 图标 + 高光
//   (cx, cy) 为圆心，sc 为额外缩放（默认 1）
function drawPiece(u, c, r, cx, cy, sc){
  const isP = u.team === 'player';
  ctx.save();
  ctx.translate(cx, cy);
  if (sc != null && sc !== 1) ctx.scale(sc, sc);

  // 队伍色外环
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fillStyle = isP ? '#2f6fe0' : '#d93b3b';
  ctx.fill();

  // 卡牌色内圈
  const bg = ctx.createLinearGradient(0, -r, 0, r);
  bg.addColorStop(0, c.c1); bg.addColorStop(1, c.c2);
  ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, Math.PI*2);
  ctx.fillStyle = bg; ctx.fill();

  // 白色底盘（提升图标对比度）
  ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();

  // 图标
  ctx.font = (r * 1.25 | 0) + 'px "Segoe UI Emoji",system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(c.glyph, 0, r * 0.06);

  // 高光
  ctx.beginPath();
  ctx.arc(-r*0.3, -r*0.36, r*0.26, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
  ctx.restore();
}

// 电磁塔「钻地」：地洞 + 塔身从地面升起 + 电流特效
//   u.emerge = 0 全埋在地下（部署那 1 秒也是 0），1 完全升起
function drawBurrow(u, c, r){
  const eg = u.emerge;
  const t = u.anim;
  const hx = u.x, hy = u.y + r * 0.38;      // 洞口中心
  const ow = r * 1.18, oh = r * 0.62;       // 洞口横向 / 纵向半径

  ctx.save();

  // 1) 地洞：翻出来的土 → 洞口暗部 → 深处
  ctx.beginPath(); ctx.ellipse(hx, hy, ow, oh, 0, 0, 7);
  ctx.fillStyle = '#8a6f4a'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx, hy, ow * 0.86, oh * 0.78, 0, 0, 7);
  ctx.fillStyle = '#2b2117'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx, hy, ow * 0.6, oh * 0.5, 0, 0, 7);
  ctx.fillStyle = '#120d07'; ctx.fill();

  // 2) 埋在地下时：洞口透出的黄色蓄能光 + 偶尔蹦出的电弧
  if (eg < 0.98){
    const pulse = 0.5 + 0.5 * Math.sin(t * 6.5);          // 0~1 呼吸
    const gl = (1 - eg) * (0.20 + 0.30 * pulse);
    ctx.beginPath();
    ctx.ellipse(hx, hy, ow * 0.44, oh * 0.34, 0, 0, 7);
    ctx.fillStyle = 'rgba(245,214,80,' + Math.max(0, gl).toFixed(3) + ')';
    ctx.fill();
    // 洞口里偶尔蹦出两道小电弧（从洞口左右两侧窜出来，锯齿状）
    if (Math.sin(t * 9) > 0.7){
      ctx.strokeStyle = 'rgba(255,236,140,0.85)';
      ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
      for (let i = 0; i < 2; i++){
        const s = i ? 1 : -1;
        const jit = Math.sin(t * 11 + i * 3.1) * r * 0.13;
        const x0 = hx + s * ow * 0.34;
        ctx.beginPath();
        ctx.moveTo(x0, hy + oh * 0.26);
        ctx.lineTo(x0 + s * r * 0.12 + jit, hy - r * 0.14);
        ctx.lineTo(x0 + s * r * 0.02 - jit, hy - r * 0.40);
        ctx.lineTo(x0 + s * r * 0.20,       hy - r * 0.68);
        ctx.stroke();
      }
    }
  }

  // 3) 塔身：以洞口为锚做纵向缩放 —— 从地里「长」出来
  if (eg > 0.02){
    ctx.save();
    ctx.globalAlpha = Math.min(1, eg * 1.5);
    ctx.translate(hx, hy);
    ctx.scale(1, Math.max(0.05, eg));
    ctx.translate(-hx, -hy);
    drawPiece(u, c, r, u.x, u.y);
    ctx.restore();
  }

  // 4) 洞口前沿弧线：做出「从洞里冒出来」的层次
  ctx.beginPath();
  ctx.ellipse(hx, hy, ow * 0.95, oh * 0.95, 0, 0, Math.PI);
  ctx.strokeStyle = 'rgba(74,56,34,0.75)'; ctx.lineWidth = 2.5;
  ctx.stroke();

  // 5) 完全升起后：有目标时塔身外圈跳电弧（锯齿状，向外炸开）
  if (eg > 0.9 && u.target && !u.target.dead){
    const a = Math.max(0, 0.30 + 0.32 * Math.sin(t * 12));
    ctx.strokeStyle = 'rgba(255,232,120,' + a.toFixed(3) + ')';
    ctx.lineWidth = 2; ctx.lineJoin = 'round';
    for (let i = 0; i < 3; i++){
      const ang = t * 3.4 + i * 2.09;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(u.x + ca * r * 0.85,               u.y + sa * r * 0.85);
      ctx.lineTo(u.x + ca * r * 1.06 + sa * r * 0.17, u.y + sa * r * 1.06 - ca * r * 0.17);
      ctx.lineTo(u.x + ca * r * 1.30 - sa * r * 0.13, u.y + sa * r * 1.30 + ca * r * 0.13);
      ctx.lineTo(u.x + ca * r * 1.58,               u.y + sa * r * 1.58);
      ctx.stroke();
    }
  }
  ctx.restore();

}

function drawUnit(u){
  const c = CARDS[u.cardId];
  if (!c) return;
  const r = u.radius;
  const fly = u.flying;
  // 跳河抬升：抛物线，起跳与落地为 0，中点为最高
  const lift = (u.jump > 0 && u.jumpT > 0)
    ? Math.sin(Math.PI * (1 - u.jump / u.jumpT)) * JUMP_LIFT : 0;
  const by = u.y + (fly ? -r * 0.7 : 0) - lift;
  const spawning = u.spawnT > 0;

  // 钻地建筑（电磁塔）走单独一套画法：地洞 + 从地里升起
  if (u.burrow){ drawBurrow(u, c, r); return; }

  // 影子（跳得越高越淡越小，落点仍在地面）
  const shk = 1 - (lift / JUMP_LIFT) * 0.5;
  ctx.save();
  ctx.globalAlpha = (fly ? 0.14 : 0.22) * shk;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(u.x, u.y + r * 0.6, r * (fly ? 0.7 : 0.92) * shk, r * 0.38 * shk, 0, 0, 7);
  ctx.fill();
  ctx.restore();

  // 渔夫蓄钩中：一条虚线指向锁定的目标 + 脚下逐渐收紧的蓄力圈
  if (u.cardId === 'fisherman' && u.hookWind > 0 && u.hookTarget && !u.hookTarget.dead){
    const o = u.hookTarget;
    const pr = clamp(1 - u.hookWind / 1.3, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.30 + 0.35 * pr;
    ctx.strokeStyle = '#9fd8f0';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(u.x, by); ctx.lineTo(o.x, o.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.55 + 0.35 * pr;
    ctx.beginPath(); ctx.arc(u.x, u.y + r * 0.6, r * (1.5 - pr * 0.7), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 哥布林小屋「待机」：探测圈里没敌人时不产兵，画一圈很淡的虚线提示玩家它在等谁进来
  if (u.hutIdle && c.spawnWhenEnemy){
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.08 * Math.sin(G.t * 2.2);
    ctx.strokeStyle = '#e8f5b0';
    ctx.lineWidth = 2.6;
    ctx.setLineDash([7, 11]);
    ctx.beginPath(); ctx.arc(u.x, u.y, c.spawnWhenEnemy, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 部署时间内：由小放大 + 由淡转实，1 秒后完全落地
  const dp = spawning ? clamp(1 - u.spawnT / DEPLOY_TIME, 0, 1) : 1;
  ctx.save();
  // 皇家幽灵隐身时半透明（自己看得见，敌人索敌不到）
  ctx.globalAlpha = (spawning ? 0.62 + 0.38 * dp : 1) * (u.cloak ? 0.34 : 1);
  drawPiece(u, c, r, u.x, by, spawning ? 0.55 + dp * 0.45 : 1);
  ctx.restore();

  // 被冰冻法术冻住：裹一层淡蓝冰壳（呼吸感，别做成静止贴图）
  if (u.frozenT > 0){
    ctx.save();
    ctx.globalAlpha = 0.28 + 0.10 * Math.sin(G.t * 7);
    ctx.fillStyle = '#bfe8ff';
    ctx.beginPath(); ctx.ellipse(u.x, by - r * 0.15, r * 1.12, r * 1.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#eaf9ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(u.x, by - r * 0.15, r * 1.12, r * 1.45, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(u.x - r * 0.5, by - r * 0.7); ctx.lineTo(u.x + r * 0.15, by - r * 0.2);
    ctx.lineTo(u.x - r * 0.2, by + r * 0.35); ctx.stroke();
    ctx.restore();
  }

  // 护盾（骷髅守卫）：一圈冰蓝光罩，盾越薄越淡
  if (u.shield > 0){
    const a = clamp(u.shield / (u.shieldMax || 1), 0, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(198,230,255,' + (0.34 + 0.46 * a).toFixed(2) + ')';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(u.x, by, r * 1.20, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,185,255,0.22)';
    ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.arc(u.x, by, r * 1.20, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 被藤蔓定身：脚下一圈绿色缠绕环
  if (u.rootT > 0){
    const p = 0.5 + 0.5 * Math.sin(u.anim * 10);
    ctx.save();
    ctx.strokeStyle = 'rgba(126,224,140,' + (0.44 + 0.30 * p).toFixed(2) + ')';
    ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.arc(u.x, by, r * 0.95, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 狂暴中：脚下一圈洋红呼吸环
  if (u.rageT > 0){
    const p = 0.5 + 0.5 * Math.sin(u.anim * 12);
    ctx.save();
    ctx.strokeStyle = 'rgba(232,146,255,' + (0.30 + 0.34 * p).toFixed(2) + ')';
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(u.x, by, r * 1.12, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 治疗中：脚下一圈绿色呼吸光环
  if (u.healT > 0){
    const p = 0.5 + 0.5 * Math.sin(u.anim * 9);
    ctx.save();
    ctx.strokeStyle = 'rgba(140,240,180,' + (0.30 + 0.32 * p).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(u.x, by, r * 1.16, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// 眩晕标记：绕着单位转的三段弧，一眼能看出「这张牌现在不动」
function drawStunMark(e){
  const r = (e.isTower ? e.radius * 0.72 : e.radius * 1.15);
  const cy = e.y - (e.flying ? e.radius * 0.7 : 0);
  const a0 = e.anim * 7;
  ctx.save();
  ctx.strokeStyle = 'rgba(205,225,255,0.95)';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++){
    const a = a0 + i * 2.094;
    ctx.beginPath();
    ctx.arc(e.x, cy, r, a, a + 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

// 减速标记：一圈会呼吸的冰蓝光环 + 三个小雪花点，和眩晕的「三段弧」区分开
function drawSlowMark(e){
  const r = (e.isTower ? e.radius * 0.8 : e.radius * 1.32);
  const cy = e.y - (e.flying ? e.radius * 0.7 : 0);
  const a = 0.34 + 0.16 * Math.sin(e.anim * 4.2);
  ctx.save();
  ctx.strokeStyle = 'rgba(150,215,255,' + a.toFixed(3) + ')';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(e.x, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(220,244,255,' + (a + 0.2).toFixed(3) + ')';
  for (let i = 0; i < 3; i++){
    const ang = e.anim * 1.6 + i * 2.094;
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(ang) * r, cy + Math.sin(ang) * r, 2.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 滚木 / 木桶：一段带旋转的木筒，滚动时木纹和铁箍一起转，压在地上带个影子
// 滚木 / 木桶的贴图：侧视的圆柱体。
//   滚动感靠「表面纹理随 spin 上下平移」+ 端面木纹旋转来做 —— 比整体旋转一块板子自然得多。
function drawRoll(r){
  const barrel = r.card.rollKind === 'barrel';
  const len = r.card.rollWidth * 0.52;
  const h = barrel ? 30 : 27;
  const hl = len / 2, hh = h / 2;
  ctx.save();
  ctx.translate(r.x, r.y);

  // 地面影子
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, hh * 0.95, hl * 0.92, hh * 0.40, 0, 0, Math.PI * 2); ctx.fill();

  // 尾部速度线（朝来向）
  ctx.strokeStyle = 'rgba(255,244,214,0.22)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++){
    const yy = i * hh * 0.52;
    ctx.beginPath();
    ctx.moveTo(-hl * 1.18, yy);
    ctx.lineTo(-hl * (0.92 + Math.abs(i) * 0.06), yy);
    ctx.stroke();
  }

  // 筒身
  const g = ctx.createLinearGradient(0, -hh, 0, hh);
  if (barrel){
    g.addColorStop(0, '#d0a163'); g.addColorStop(0.38, '#a87539'); g.addColorStop(0.78, '#6d4519'); g.addColorStop(1, '#40260b');
  } else {
    g.addColorStop(0, '#c19058'); g.addColorStop(0.35, '#8d5c30'); g.addColorStop(0.78, '#5d3815'); g.addColorStop(1, '#3a2009');
  }
  ctx.fillStyle = g;
  roundRect(-hl, -hh, len, h, hh * 0.5); ctx.fill();

  // 表面纹理（裁剪在筒身内）
  ctx.save();
  ctx.beginPath(); roundRect(-hl, -hh, len, h, hh * 0.5); ctx.clip();
  const ph = (r.spin * 5.5) % h;              // 纹理滚动相位
  if (barrel){
    // 桶板接缝：等距竖线 + 每块板中间一道浅高光
    ctx.strokeStyle = 'rgba(58,34,10,0.38)'; ctx.lineWidth = 1.6;
    for (let i = 1; i < 8; i++){
      const x = -hl + len * i / 8;
      ctx.beginPath(); ctx.moveTo(x, -hh); ctx.lineTo(x, hh); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,226,176,0.10)'; ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++){
      const x = -hl + len * (i + 0.5) / 8;
      ctx.beginPath(); ctx.moveTo(x, -hh); ctx.lineTo(x, hh); ctx.stroke();
    }
  } else {
    // 树皮：几条不规则长纹，随滚动上下浮动
    ctx.strokeStyle = 'rgba(48,26,7,0.34)'; ctx.lineWidth = 2.1;
    for (let i = 0; i < 5; i++){
      const yy = -hh + h * (i + 0.5) / 5 + Math.sin(ph * 0.9 + i * 1.7) * hh * 0.20;
      ctx.beginPath();
      ctx.moveTo(-hl + 3, yy);
      ctx.bezierCurveTo(-hl * 0.35, yy - 3.2, hl * 0.30, yy + 3.4, hl - 3, yy - 1.2);
      ctx.stroke();
    }
    // 两个木节
    ctx.fillStyle = 'rgba(42,22,6,0.45)';
    for (const kx of [-hl * 0.42, hl * 0.28]){
      ctx.beginPath(); ctx.ellipse(kx, -hh * 0.15 + Math.sin(ph + kx) * hh * 0.15, 3.4, 2.3, 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 顶部高光
  ctx.strokeStyle = 'rgba(255,238,205,0.38)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(-hl + 5, -hh + 2.6); ctx.lineTo(hl - 5, -hh + 2.6); ctx.stroke();
  // 底部压暗
  ctx.fillStyle = 'rgba(24,12,2,0.28)';
  ctx.fillRect(-hl, hh - 5, len, 5);
  ctx.restore();

  // 铁箍（桶）或端面木纹（滚木）
  if (barrel){
    // 铁箍：金属渐变的窄环（上亮下暗），比纯色条更像铁
    for (const hx of [-hl * 0.66, 0, hl * 0.66]){
      const hg = ctx.createLinearGradient(0, -hh, 0, hh);
      hg.addColorStop(0, '#6d6152'); hg.addColorStop(0.35, '#4a3f31'); hg.addColorStop(1, '#241c12');
      ctx.fillStyle = hg;
      ctx.fillRect(hx - 3.4, -hh + 0.5, 6.8, h - 1);
      ctx.fillStyle = 'rgba(230,222,202,0.55)';
      ctx.fillRect(hx - 3.4, -hh + 0.5, 6.8, 1.5);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(hx - 3.4, hh - 2.2, 6.8, 1.4);
    }
    // 两端端盖：外圈木沿 + 内面板 + 放射木纹（随滚动转）；右端背光所以压暗一档
    for (const side of [-1, 1]){
      const ex = side < 0 ? -hl + 1.6 : hl - 1.6;
      const dim = side < 0 ? 1 : 0.72;
      ctx.fillStyle = side < 0 ? '#8a5f2c' : '#6d4a20';
      ctx.beginPath(); ctx.ellipse(ex, 0, 6.4, hh * 0.95, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = dim;
      ctx.fillStyle = '#cfa76f';
      ctx.beginPath(); ctx.ellipse(ex, 0, 5.0, hh * 0.78, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(110,72,28,0.50)'; ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++){
        const a = r.spin * 0.9 + i * (Math.PI * 2 / 6);
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(a) * 1.6, Math.sin(a) * 2.4);
        ctx.lineTo(ex + Math.cos(a) * 4.6, Math.sin(a) * hh * 0.70);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(90,58,20,0.6)';
      ctx.beginPath(); ctx.ellipse(ex, 0, 1.3, 1.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else {
    // 两端切面：浅色木纹 + 年轮
    for (const ex of [-hl + 2, hl - 2]){
      ctx.fillStyle = '#dcb47e';
      ctx.beginPath(); ctx.ellipse(ex, 0, 5.2, hh * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,104,52,0.6)'; ctx.lineWidth = 1.1;
      for (const rr of [0.62, 0.36]){
        ctx.beginPath(); ctx.ellipse(ex, 0, 5.2 * rr, hh * 0.9 * rr, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(120,78,32,0.7)';
      ctx.beginPath(); ctx.ellipse(ex, 0, 1.1, hh * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawHpBar(e, y, w){
  const p = clamp(e.hp / e.maxHp, 0, 1);
  // 护盾（骷髅守卫）：血条上方再叠一条冰蓝细条，一眼看出「盾还没破」
  if (e.shield > 0){
    const sp = clamp(e.shield / (e.shieldMax || 1), 0, 1);
    const sh = 4;
    const sx = e.x - w/2;
    ctx.fillStyle = 'rgba(10,18,32,0.55)';
    roundRect(sx - 2, y - 8, w + 4, sh + 4, (sh+4)/2); ctx.fill();
    ctx.fillStyle = '#a8dcff';
    roundRect(sx, y - 6, Math.max(2, w * sp), sh, sh/2); ctx.fill();
  }
  const h = e.isTower ? 11 : (e.isBuilding ? 9 : 7);   // 建筑的生命条 = 血量+剩余时间，比普通单位粗一点
  const x = e.x - w/2;
  ctx.fillStyle = 'rgba(10,18,32,0.6)';
  roundRect(x - 2, y - 2, w + 4, h + 4, (h+4)/2); ctx.fill();
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  if (e.team === 'player'){ bg.addColorStop(0, '#8cc4ff'); bg.addColorStop(1, '#2f7fe8'); }
  else { bg.addColorStop(0, '#ff9a9a'); bg.addColorStop(1, '#e03b3b'); }
  ctx.fillStyle = bg;
  roundRect(x, y, Math.max(3, w * p), h, h/2); ctx.fill();
}

function drawFx(f){
  const k = f.t / f.life;
  ctx.save();
  if (f.type === 'ring'){
    const r = f.r0 + (f.r1 - f.r0) * k;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = f.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI*2); ctx.stroke();
  } else if (f.type === 'boom'){
    ctx.globalAlpha = (1 - k) * 0.85;
    const r = f.r * (0.5 + k * 0.9);
    const gg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    gg.addColorStop(0, '#fff'); gg.addColorStop(0.4, f.color); gg.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI*2); ctx.fill();
  } else if (f.type === 'spell'){
    ctx.globalAlpha = (1 - k) * (f.a != null ? f.a : 0.75);
    const r = f.r * (0.6 + k * 0.5);
    const gg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    // 中心色 / 外缘色可覆盖：火焰默认暖白+橙，冰系/治疗要换成冷色，否则会发黄
    gg.addColorStop(0, f.core || '#fff8c0');
    gg.addColorStop(0.35, f.color);
    gg.addColorStop(1, f.edge || 'rgba(255,60,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI*2); ctx.fill();
  } else if (f.type === 'dust'){
    const a = (1 - k) * 0.22;
    ctx.fillStyle = 'rgba(214,196,160,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + k * 1.7), 0, Math.PI * 2); ctx.fill();
  } else if (f.type === 'spark'){
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++){
      const a = i * Math.PI/2 + k * 2;
      ctx.beginPath();
      ctx.moveTo(f.x + Math.cos(a)*3, f.y + Math.sin(a)*3);
      ctx.lineTo(f.x + Math.cos(a)*(8 + k*8), f.y + Math.sin(a)*(8 + k*8));
      ctx.stroke();
    }
  } else if (f.type === 'volley'){
    // 落箭：一圈箭从右上方斜插进圈里，落点按 seed 固定，起落时间错开
    ctx.lineCap = 'round';
    const N = 13;
    for (let i = 0; i < N; i++){
      const a = i * 2.3999 + f.seed;                          // 黄金角散布，看不出规律
      const rad = f.r * (0.12 + 0.88 * ((i * 0.618 + f.seed * 0.07) % 1));
      const tx = f.x + Math.cos(a) * rad;
      const ty = f.y + Math.sin(a) * rad * 0.72;
      const st = ((i * 5) % 7) / 7 * 0.42;                    // 每支箭起落时间错开
      const p = clamp((k - st) / 0.58, 0, 1);
      if (p <= 0) continue;
      const ox = tx + 58, oy = ty - 148;                      // 起点：右上方，斜插进圈
      const hx = ox + (tx - ox) * p;
      const hy = oy + (ty - oy) * p;
      const L = Math.hypot(tx - ox, ty - oy);
      const ux = (tx - ox) / L, uy = (ty - oy) / L;
      let al = 0.95;
      if (p < 0.10) al = 0.95 * (p / 0.10);
      else if (p > 0.88) al = 0.95 * (1 - p) / 0.12;
      ctx.globalAlpha = clamp(al, 0, 1);
      ctx.strokeStyle = '#fdf7d8'; ctx.lineWidth = 2.4;
      ctx.beginPath();                                        // 箭杆
      ctx.moveTo(hx - ux * 30, hy - uy * 30);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      ctx.beginPath();                                        // 箭头
      ctx.moveTo(hx - ux * 7 - uy * 4.5, hy - uy * 7 + ux * 4.5);
      ctx.lineTo(hx, hy);
      ctx.lineTo(hx - ux * 7 + uy * 4.5, hy - uy * 7 - ux * 4.5);
      ctx.stroke();
    }
  } else if (f.type === 'bolt'){
    // 雷电：从画面上方劈下来的锯齿闪电 + 落点闪光
    //   草地是亮绿色，纯白闪电会糊掉，所以最外层压一圈深蓝做描边
    const top = f.y - 380;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = 1 - k;
    const layers = [
      [16, 'rgba(18,28,70,0.38)'],
      [9,  'rgba(96,140,255,0.72)'],
      [4.5,'rgba(205,226,255,0.95)'],
      [2,  '#ffffff']
    ];
    for (const [lw, col] of layers){
      ctx.beginPath();
      ctx.lineWidth = lw; ctx.strokeStyle = col;
      ctx.moveTo(f.x, top);
      const N = 8;
      for (let i = 1; i <= N; i++){
        const p = i / N;
        const yy = top + (f.y - top) * p;
        const amp = (1 - p * 0.5) * 22;                 // 越靠近地面越收敛，落点精确
        const xx = f.x + (i === N ? 0 : Math.sin(f.seed + i * 2.7) * amp);
        ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    // 落点闪光
    ctx.globalAlpha = (1 - k) * 0.95;
    const br = 20 + k * 60;
    const bg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, br);
    bg.addColorStop(0, 'rgba(255,255,255,0.98)');
    bg.addColorStop(0.32, 'rgba(150,190,255,0.85)');
    bg.addColorStop(1, 'rgba(110,150,255,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(f.x, f.y, br, 0, Math.PI*2); ctx.fill();
  } else if (f.type === 'proj'){
    // 飞行中的法术弹道：沿 x0,y0 → x1,y1 直线推进，尾巴带拖尾
    const p = clamp(k, 0, 1);
    const x = f.x0 + (f.x1 - f.x0) * p;
    const y = f.y0 + (f.y1 - f.y0) * p;
    const ang = Math.atan2(f.y1 - f.y0, f.x1 - f.x0);
    const ux = Math.cos(ang), uy = Math.sin(ang);

    if (f.kind === 'barrel'){
      // 哥布林飞桶：一个翻滚的木桶飞过去，身后拖着草绿色的风线
      const tx = x - ux * 70, ty = y - uy * 70;
      const tg = ctx.createLinearGradient(tx, ty, x, y);
      tg.addColorStop(0, 'rgba(200,240,150,0)');
      tg.addColorStop(1, 'rgba(215,245,175,0.55)');
      ctx.strokeStyle = tg; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();

      const rr = 15;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(k * 16);
      const bg2 = ctx.createLinearGradient(0, -rr, 0, rr);
      bg2.addColorStop(0, '#cda772'); bg2.addColorStop(0.45, '#8f6330'); bg2.addColorStop(1, '#42290c');
      ctx.fillStyle = bg2;
      roundRect(-rr, -rr * 0.78, rr * 2, rr * 1.56, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(46,28,8,0.8)'; ctx.lineWidth = 2.2;
      for (const hx of [-rr * 0.52, rr * 0.52]){
        ctx.beginPath(); ctx.moveTo(hx, -rr * 0.74); ctx.lineTo(hx, rr * 0.74); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,236,200,0.20)';
      roundRect(-rr * 0.86, -rr * 0.62, rr * 1.72, 5, 3); ctx.fill();
      ctx.restore();
    } else if (f.kind === 'arrow'){
      // 一束箭：横向散开成箭簇，先压深色描边再画白色箭身，亮草地才看得清
      ctx.lineCap = 'round';
      const N = 5;
      for (let pass = 0; pass < 2; pass++){
        ctx.strokeStyle = pass ? '#fdf7d8' : 'rgba(28,52,20,0.5)';
        ctx.lineWidth = pass ? 2.8 : 5.2;
        for (let i = 0; i < N; i++){
          const side = (i - (N - 1) / 2) * 10;
          const back = Math.abs(i - (N - 1) / 2) * 13;
          const ax = x - ux * back - uy * side;
          const ay = y - uy * back + ux * side;
          ctx.beginPath();
          ctx.moveTo(ax - ux * 30, ay - uy * 30);
          ctx.lineTo(ax, ay);
          ctx.stroke();
          if (i === 0 && pass === 1){        // 箭头
            ctx.beginPath();
            ctx.moveTo(ax - ux * 8 - uy * 5, ay - uy * 8 + ux * 5);
            ctx.lineTo(ax, ay);
            ctx.lineTo(ax - ux * 8 + uy * 5, ay - uy * 8 - ux * 5);
            ctx.stroke();
          }
        }
      }
    } else if (f.kind === 'snow'){
      // 大雪球：冷雾拖尾 + 白蓝色雪团，和火球的暖色拖尾一眼区分
      const tx = x - ux * 76, ty = y - uy * 76;
      const tg = ctx.createLinearGradient(tx, ty, x, y);
      tg.addColorStop(0, 'rgba(190,230,255,0)');
      tg.addColorStop(0.55, 'rgba(205,236,255,0.38)');
      tg.addColorStop(1, 'rgba(245,252,255,0.80)');
      ctx.strokeStyle = tg; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();

      const gr = 19 + Math.sin(k * 40) * 1.6;
      const gg = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, gr);
      gg.addColorStop(0, '#ffffff');
      gg.addColorStop(0.55, '#e9f6ff');
      gg.addColorStop(1, 'rgba(150,205,240,0.85)');
