*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe7f1;color:#16233a;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI Emoji",sans-serif;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ---------- 通用 ---------- */
.btn{border:0;border-radius:12px;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer;
  background:linear-gradient(180deg,#5b9bff,#3568e0);color:#fff;box-shadow:0 4px 0 #24499f;transition:.08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #24499f}
.btn.gray{background:linear-gradient(180deg,#c8d2e0,#a3b0c4);color:#2a3a52;box-shadow:0 4px 0 #7f8ca0}
.btn.gray:active{box-shadow:0 1px 0 #7f8ca0}
.btn.gold{background:linear-gradient(180deg,#ffcf4d,#f0a51c);color:#5a3a00;box-shadow:0 4px 0 #b87a06}
.btn.gold:active{box-shadow:0 1px 0 #b87a06}
.btn.danger{background:linear-gradient(180deg,#ff8b7a,#e2483a);color:#fff;box-shadow:0 4px 0 #a32b1f}
.btn.danger:active{box-shadow:0 1px 0 #a32b1f}

  /* 逐层单独指定位置/尺寸，竖屏时只改插画那一层即可 */
  background-position:center,center,center;
  background-size:cover,cover,cover;
}
/* 竖屏：横版插画会被裁掉大半，把取景框推到国王身上，别让他贴在边上被切掉 */
@media (max-aspect-ratio:4/5){
  #scrMenu{
    background-position:center,center,66% 100%;
    background-size:cover,cover,auto 108%;
  }
}
/* 四周暗角：把视线收到中间 */
#scrMenu::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 88% 72% at 50% 44%,
    rgba(3,7,20,0) 40%, rgba(3,7,20,.30) 78%, rgba(2,4,12,.62) 100%);
}
/* 标题后方的金色辉光，缓慢呼吸 */
#scrMenu::after{
  content:'';position:absolute;left:50%;top:38%;width:820px;height:820px;pointer-events:none;z-index:0;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,205,90,.22) 0%,rgba(255,190,70,.08) 38%,rgba(255,190,70,0) 64%);
  animation:menuGlow 5.5s ease-in-out infinite;
}
@keyframes menuGlow{
  0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
}

.menuInner{
  position:relative;z-index:2;margin:0;flex:1 1 auto;width:100%;max-width:760px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:24px;padding:2vh 0 3vh;
}
/* 上：徽章 + 标题 + 难度；下：两个按钮。中间整块留白给人物立绘 */
.menuTop,.menuBottom{
  display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;
}

/* 皇冠徽章：深古铜底 + 金边，让金色皇冠跳出来 */
.crest{
  width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:36px;line-height:1;
  background:radial-gradient(circle at 34% 26%,#8d5c12,#5d3907 58%,#2b1902 100%);
  border:2px solid rgba(255,205,90,.72);
  box-shadow:0 0 0 4px rgba(255,215,120,.12),0 0 34px rgba(255,190,60,.40),
             0 12px 26px rgba(0,0,0,.45),inset 0 2px 9px rgba(255,220,140,.22);
  animation:crestFloat 4.6s ease-in-out infinite;
}
@keyframes crestFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* 标题 */
#scrMenu .logo{
  margin:0;text-align:center;font-weight:900;line-height:1.08;
  font-size:clamp(34px,6.6vw,58px);letter-spacing:.05em;
  background:linear-gradient(180deg,#fffbe6 4%,#ffd75e 40%,#f0a51c 72%,#c9760a 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 #6d3d00) drop-shadow(0 0 16px rgba(3,7,19,.85)) drop-shadow(0 14px 26px rgba(0,0,0,.55));
}
/* 副标题：两侧细线，窄屏收紧不折行 */
#scrMenu .sub{
  display:flex;align-items:center;gap:12px;margin:0;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:.14em;color:#9fb6dd;
}
#scrMenu .sub i{
  display:block;flex:0 0 auto;width:52px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(160,195,245,.6));
}
#scrMenu .sub i:last-child{background:linear-gradient(270deg,transparent,rgba(160,195,245,.6))}

/* 音乐提示：浏览器不允许未交互就出声，这里把原因说明白，别让人以为游戏坏了 */
#scrMenu .soundHint{
  margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;
  color:#8fa6c8;text-align:center;transition:opacity .35s;
}
#scrMenu .soundHint.gone{opacity:0;pointer-events:none}

/* 难度 */
.diffWrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.diffLbl{font-size:11.5px;font-weight:800;letter-spacing:.2em;color:#8ba3ca}
.diffRow{
  display:flex;gap:6px;padding:6px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1px solid rgba(150,185,240,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.3);
}
.dbtn{
  border:0;background:transparent;color:#a9bede;font-weight:700;font-size:14px;
  padding:9px 24px;border-radius:10px;cursor:pointer;transition:.15s;
  font-family:inherit;letter-spacing:.05em;
}
.dbtn:hover{background:rgba(255,255,255,.10);color:#e8f0ff}
.dbtn.on{
  background:linear-gradient(180deg,#ffe07a,#f0a51c);color:#5a3300;
  box-shadow:0 3px 0 #a96700,0 0 18px rgba(255,190,60,.38);
}

/* 按钮 */
#scrMenu .btns{
  display:flex;flex-direction:column;gap:12px;margin-top:10px;
  align-items:center;width:100%;max-width:320px;
}
.btn.big{font-size:20px;padding:16px 30px;border-radius:16px;letter-spacing:.06em}
#scrMenu .btn{width:100%}
#scrMenu .btn.gold{
  background:linear-gradient(180deg,#ffe487,#ffc62e 46%,#f0a51c 100%);
  color:#5a3300;
  box-shadow:0 6px 0 #a96700,0 16px 32px rgba(255,170,30,.28),inset 0 1px 0 rgba(255,255,255,.8);
}
#scrMenu .btn.gold:active{transform:translateY(4px);box-shadow:0 2px 0 #a96700,0 6px 16px rgba(255,170,30,.24)}
#scrMenu .btn.ghost{
  background:rgba(255,255,255,.09);color:#d7e5ff;
  border:1px solid rgba(160,195,245,.30);
  box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#scrMenu .btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}

@media (max-width:560px){
  #scrMenu .sub{font-size:11.5px;letter-spacing:.06em;gap:8px}
  #scrMenu .sub i{width:20px}
  .dbtn{padding:9px 16px}
}
@media (max-width:400px){
  #scrMenu .sub i{display:none}
}

/* ---------- 卡组界面 ---------- */
#scrDeck{background:linear-gradient(180deg,#eef4fc,#dbe6f5);padding:14px;gap:10px}
#scrDeck h2{margin:0;font-size:18px;color:#25406e;text-align:center}
/* 标题行：标题居中，平均圣水贴在右侧 */
.deckHead{position:relative;display:flex;align-items:center;justify-content:center;
  max-width:820px;margin:0 auto;width:100%;min-height:30px}
.avgElixir{position:absolute;right:0;display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid #c3d4ea;border-radius:999px;padding:3px 11px 3px 8px;
  box-shadow:0 2px 6px rgba(37,64,110,.10);user-select:none}
.avgElixir .dot{width:13px;height:13px;border-radius:50%;flex:none;
  background:linear-gradient(180deg,#e08cff,#b14cff);box-shadow:0 0 0 2px rgba(177,76,255,.14)}
.avgElixir b{font-size:15px;font-weight:900;color:#7b3fc4;font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.avgElixir .lbl{font-size:11px;color:#6a7fa3;letter-spacing:1px}
.avgElixir.empty b{color:#9fb0c8}
@media (max-width:520px){
  .deckHead{justify-content:flex-start}
  #scrDeck h2{font-size:16px}
  .avgElixir{position:static;margin-left:auto;padding:2px 9px 2px 7px}
  .avgElixir .lbl{display:none}
}
.deckRow{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:820px;margin:0 auto;width:100%}
.slot{aspect-ratio:3/4;border-radius:10px;border:2px dashed #b6c6de;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;position:relative}
.slot.full{border-style:solid;border-color:#8fb0e0;color:#fff}
.slot .cost{position:absolute;left:-4px;top:-4px;width:20px;height:20px;border-radius:50%;
  background:#b14cff;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.slot .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.poolWrap{flex:1;overflow-y:auto;background:#fff;border-radius:14px;padding:12px;max-width:820px;margin:0 auto;width:100%;
  box-shadow:0 6px 20px rgba(40,80,150,.1)}
.poolFilter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:820px;margin:0 auto 10px;width:100%}
.fbtn{border:none;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;
  background:#e8eef8;color:#5a7290;transition:background .15s,color .15s,transform .1s}
.fbtn:hover{background:#dbe6f6}
.fbtn:active{transform:scale(.96)}
.fbtn.on{background:linear-gradient(160deg,#5aa0ff,#2f6fe0);color:#fff;box-shadow:0 4px 12px rgba(47,111,224,.32)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.pcard{aspect-ratio:3/4;border-radius:10px;position:relative;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.1s;
  box-shadow:0 3px 8px rgba(0,0,0,.18)}
.pcard:hover{transform:translateY(-3px)}
.pcard.used{opacity:.32;filter:grayscale(.7)}
.pcard .cost{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;
  background:#b14cff;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pcard .art{font-size:26px;line-height:1}
.pcard .nm{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.pcard .tp{font-size:9px;color:rgba(255,255,255,.85)}
.deckFoot{display:flex;gap:12px;justify-content:center;align-items:center}

/* ---------- 战斗界面 ---------- */
#scrGame{background:#c9d7ea}
.topbar{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(180deg,#2c4670,#203454);color:#fff;font-weight:800;font-size:15px}
.topbar .cr{display:flex;align-items:center;gap:5px;font-size:14px}

.bottom{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;width:100%;max-width:540px;margin:0 auto}
.elixirBar{height:22px;border-radius:11px;background:#2a1c3d;position:relative;overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.elixirFill{height:100%;width:50%;border-radius:11px;background:linear-gradient(180deg,#e08cff,#b14cff);transition:width .08s linear}
.elixirBar.full .elixirFill{background:linear-gradient(180deg,#ffb0ff,#e04bff);box-shadow:0 0 14px #e04bff}
.elixirNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.elixirMult{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:none;
  font-size:10px;font-weight:900;color:#fff;padding:1px 7px;border-radius:9px;
  letter-spacing:.5px;white-space:nowrap}
.elixirMult.on{display:block}
.elixirMult.m2{background:#e0342b;box-shadow:0 0 9px rgba(255,70,50,.85)}
.elixirMult.m3{background:#ff8a00;box-shadow:0 0 12px rgba(255,150,0,.95);animation:mpulse .7s infinite}

.elixirBar.m2 .elixirFill{background:linear-gradient(180deg,#ff9ae8,#e0342b)}

.handRow{display:flex;gap:8px;align-items:flex-end}
.hand{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{aspect-ratio:3/4;max-height:110px;max-width:84px;justify-self:center;width:100%;border-radius:10px;position:relative;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;box-shadow:0 4px 10px rgba(0,0,0,.28);transition:.08s;border:2px solid transparent}
.card:active{transform:scale(.96)}
.card .cost{position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;

.card .art{font-size:30px;line-height:1}
.card .nm{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}

.card.off{filter:grayscale(.85) brightness(.7)}
.nextWrap{width:66px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.nextWrap .lbl{font-size:10px;color:#54688c;font-weight:700}
.miniCard{width:100%;aspect-ratio:3/4;border-radius:9px;background:linear-gradient(160deg,#9aa9c0,#6e7f99);
  position:relative;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.miniCard .cost{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;
  background:#b14cff;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#ghost{position:fixed;width:62px;height:82px;border-radius:10px;pointer-events:none;display:none;z-index:99;
  align-items:center;justify-content:center;font-size:30px;background:rgba(255,255,255,.9);border:2px solid #ffe14d;
  box-shadow:0 8px 22px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(18,30,52,.9);color:#fff;
  padding:12px 26px;border-radius:14px;font-size:20px;font-weight:900;letter-spacing:2px;pointer-events:none;
  opacity:0;transition:opacity .25s;z-index:60}
#toast.on{opacity:1}
/* 最后 10 秒：屏幕正中央的大倒数 */
#countdown{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:58}
#countdown.on{display:flex}
#cdNum{font-size:96px;font-weight:900;line-height:1;color:#fff;letter-spacing:2px;
  text-shadow:0 0 22px rgba(255,86,86,.95), 0 6px 0 rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.55)}
#cdNum.pop{animation:cdPop .42s ease-out}
@keyframes cdPop{0%{transform:scale(1.6);opacity:.15}55%{transform:scale(.93)}100%{transform:scale(1);opacity:1}}
#cdCap{font-size:16px;font-weight:900;letter-spacing:5px;color:#ffdada;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}

/* ---------- 结算 ---------- */
#scrResult{background:rgba(12,22,42,.82);align-items:center;justify-content:center;gap:18px;backdrop-filter:blur(4px)}
#scrResult .big{font-size:52px;font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 4px 18px rgba(0,0,0,.6)}

/* 宽屏：卡牌区依然位于竞技场下方，只做尺寸收敛 */

<body>
<div id="app">

  <!-- 主菜单 -->
  <div class="screen on" id="scrMenu">

<script>
"use strict";
/* =========================================================
   皇室战争纯净版 —— 单文件实现
   战场虚拟坐标 800 x 1422（= 18 格 × 32 格，与真实皇室战争同比例）
   ========================================================= */

// ---------------- 常量 ----------------
// 竞技场按真实皇室战争的 18 × 32 格比例搭建：
//   横向 1 格 = AW / 18 ≈ 44.4 战场单位；纵向用同一把尺子 → 高度 = 44.4 × 32 = 1422
//   旧版高度 1150 只相当于 25.9 格，纵向被压扁：同一个射程圆横向占 30% 宽、纵向却占 21% 高，
//   换算成横向格后纵向就显得「够得着更远」——这才是加农炮射程看着偏长的真正原因。
//   现在横纵同尺，所有以「格」为单位的射程自动变准，卡牌数值一个都不用改。
const AW = 800;
const TILE = AW / 18;               // 1 格 ≈ 44.44 战场单位
const AH = Math.round(TILE * 32);   // 1422 = 18 × 32 格

// 纵向坐标（塔位、河）本来就是按「格」摆的，横向尺子没变 → 绝对值保持不变，不再做纵向拉伸
const RIVER_MID  = AH / 2;                  // 河心：竞技场正中（第 16 格）711
const RIVER_HALF = 37;                      // 河宽的一半 ≈ 0.83 格
const RIVER_TOP  = RIVER_MID - RIVER_HALF;  // 674
const RIVER_BOT  = RIVER_MID + RIVER_HALF;  // 748
const BRIDGE = [{ x: 150, w: 126 }, { x: 650, w: 126 }];
const TOWER_ROW   = 302;                    // 公主塔中心那一排：距本方底线 ≈ 6.8 格
const KING_ROW    = 122;                    // 国王塔中心那一排：距本方底线 ≈ 2.75 格
// 推掉敌方某侧公主塔后，该侧可下牌的边界 = 「从公主塔往己方半场退 4 格」的那条线。
//   302 + 4×44.4 ≈ 480：也就是塔前 4 格 —— 破了塔能往对面推进一段，但**不能贴着塔根下兵**。
const TOWER_OPEN_ROW = TOWER_ROW + 4 * TILE;
const DEPLOY_LINE = RIVER_MID;              // 己方部署边界：桥的正中间（河心）
const JUMP_TIME   = 0.42;                   // 跳河：从起跳到落地的耗时（秒）
const JUMP_LIFT   = 52;                     // 跳河：最高点的视觉抬升（战场单位）
// 部署时间：所有「部队卡 + 建筑卡」放下后统一 1 秒才落地生效
//   这 1 秒内不移动、不索敌、不开火，只有放大浮现的入场动画
//   法术卡（火球 / 万箭齐发）不受影响，依旧即时结算
const DEPLOY_TIME = 1.0;
// 首次出手：单位锁定目标后，要等 0.7 秒才打出第一下（不是「锁上就打」）。
//   落地后先索敌 → 0.7 秒蓄力 → 第一击；之后按各自的攻击速度循环。
//   目标死亡 / 跑出射程 / 被眩晕冰冻打断后重新锁定，同样要重新等这 0.7 秒。
//   防御塔不受影响（塔有自己的开火节奏，否则防守会被削一档）。
const FIRST_HIT_DELAY = 0.7;
// 打建筑/防御塔时的首次蓄力：塔不会走位也不会还手，没必要读招 0.7 秒。
//   用 0.7 秒的话，3 个骷髅在塔下一发都打不出（塔 0.8 秒一发、一发一个），
//   飞桶不解只剩 500 伤害 —— 和皇室战争的手感差很远。
const FIRST_HIT_BUILDING = 0.35;
// 召唤出来的兵（骷髅墓碑 / 哥布林飞桶 / 野蛮人滚筒 / 墓碑亡语）不走「手里放下」那 1 秒：
//   它们是从桶里、坟里蹦出来的，只给 0.25 秒破壳动画就参战。
//   否则塔会在这 1 秒里白打两发 —— 飞桶不解时只剩 500 点伤害，和皇室战争差一大截。

// ---------------- 音效 ----------------
let AC = null, muted = false;
function beep(freq, dur, type, vol){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur + 0.02);
  }catch(e){}
}

// 连续播放一串音频文件，**严格接在一起**，中间不留缝。
//   首选 Web Audio：把文件解成 buffer，按采样精度排时间轴，第二段的开始时刻
//   = 第一段的时长，接缝完全对齐，听上去和原始一气呵成的音效一样。
//   但 fetch 在 file:// 协议下会被浏览器禁掉，所以留了个 <audio> 顺序播放的兜底——
//   兜底只能做到「几乎连着」，会有几十毫秒的间隙。
function playChain(files, vol){
  if (muted) return;
  // file:// 下 fetch 一定会被 CORS 拦掉，直接走 <audio> 兜底，省一次必然失败的网络请求
  if (location.protocol === 'file:'){ playChainEl(files, vol); return; }
  playChainWA(files, vol).then(ok => { if (!ok) playChainEl(files, vol); });
}

// 播放清单规范化：字符串 = 整段播；对象 = 只播其中一段 {src, from, to}
// （to < 素材时长时会自动在结尾加一小段淡出，硬切会出现咔哒声）
function normSpecs(files){
  return files.map(f => typeof f === 'string' ? { src: f } : f);
}
function specKey(files){
  return normSpecs(files).map(s => s.src + '@' + (s.from || 0) + '~' + (s.to == null ? '' : s.to)).join('|');
}

const _chains = {};
function playChainWA(files, vol){
  const specs = normSpecs(files);
  const key = specKey(files);
  const ready = _chains[key] || (_chains[key] =
    Promise.all(specs.map(s =>
      fetch(s.src).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status());
        return r.arrayBuffer();
      }).then(b => {
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        return new Promise(res => AC.decodeAudioData(b, res, () => res(null)));
      })
    )).catch(() => null));
  return ready.then(bufs => {
    // 没有可用 buffer（file:// 下 fetch 被禁 / 解码失败）→ 返回 false 让上层走兜底
    if (!bufs || bufs.some(b => !b)) return false;
    if (muted) return true;                // 静音就什么都不做，也别兜底
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const g = AC.createGain();
    g.gain.value = vol == null ? 0.6 : vol;
    g.connect(AC.destination);
    let t = AC.currentTime + 0.01;
    bufs.forEach((b, i) => {
      const sp = specs[i];
      const from = sp.from || 0;
      const to = sp.to == null ? b.duration : Math.min(sp.to, b.duration);
      const dur = Math.max(0.01, to - from);
      const s = AC.createBufferSource();
      s.buffer = b;
      if (sp.to != null && to < b.duration - 0.02){
        // 截取片段：单独挂一层 gain 做结尾淡出，不影响同一串里的其它段
        const fade = Math.min(0.12, dur * 0.35);
        const sg = AC.createGain();
        s.connect(sg); sg.connect(g);
        sg.gain.setValueAtTime(1, t + dur - fade);
        sg.gain.linearRampToValueAtTime(0.0001, t + dur);
      } else {
        s.connect(g);
      }
      s.start(t, from, dur);          // 第三参数 duration = 这段放多久
      t += dur;                       // 下一段紧贴上一段的结尾
    });
    return true;
  }).catch(() => false);
}

// 兜底：用 <audio> 顺序播，靠 ended 事件接第二段
const _chainEls = {};
function chainEls(files){
  const key = specKey(files);
  if (!_chainEls[key]){
    _chainEls[key] = normSpecs(files).map(s => { const a = new Audio(); a.src = s.src; a.preload = 'auto'; return a; });
  }
  return _chainEls[key];
}
function playChainEl(files, vol){
  const els = chainEls(files);
  const v = vol == null ? 0.6 : vol;
  els.forEach(a => { try { a.pause(); a.currentTime = 0; a.volume = v; }catch(e){} });
  let i = 0;
  (function next(){
    if (i >= els.length) return;
    const a = els[i++];
    a.onended = next;
    const pr = a.play();
    if (pr && pr.catch) pr.catch(() => {});
  })();
}

/* ---------------- 背景音乐 ----------------
   四个场景各一首：主菜单 / 选卡 / 战斗 / 加时赛。
   两个 <audio> 交替淡入淡出做交叉过渡；浏览器的自动播放策略要求先有用户手势，
   所以加载时先试播一次，被拦下就挂一个一次性的点击/按键监听补播。
   战斗时的音量刻意压低（0.36）：音效都是 0.03~0.09 的小 beep，音乐太响会把放牌、
   命中、法术这些反馈盖掉。菜单/选卡界面没有音效，可以放得开一点。 */
const MUSIC_TRACKS = {
  menu:   { src: 'music/01-menu.mp3',   vol: 0.46 },
  deck:   { src: 'music/02-deck.mp3',   vol: 0.46 },
  battle: { src: 'music/03-battle.mp3', vol: 0.36 },
  sudden: { src: 'music/04-sudden.mp3', vol: 0.42 }
};
const BGM = (function(){
  const els = [new Audio(), new Audio()];
  let idx = 0, cur = null, raf = 0, curEl = null, unlockHooked = false, paused = false;
  els.forEach(a => { a.loop = true; a.preload = 'auto'; a.volume = 0; });

  // 淡入 next、淡出 prev。prev 的衰减跑完才暂停它；中途被打断就让它挂着
  //   （音量已是 0，不出声），**绝不能主动去 pause 别的播放器**——那个播放器
  //   可能正是下一次 start() 刚挑中的新曲子。
  function crossfade(next, prev, to, fade){
    cancelAnimationFrame(raf);
    const vol = MUSIC_TRACKS[to].vol, from = prev.volume, t0 = performance.now();
    (function step(){
      const k = clamp((performance.now() - t0) / fade, 0, 1);
      next.volume = vol * (muted ? 0 : 1) * k;
      prev.volume = from * (1 - k);
      if (k < 1) raf = requestAnimationFrame(step);
      else { prev.pause(); prev.volume = 0; }
    })();
  }

  // 真正把一首歌放起来：换曲子、补播、取消静音都从这里出发
  function start(name, fade){
    const next = els[idx], prev = els[1 - idx];
    idx = 1 - idx;                     // 下一次换到另一个播放器
    curEl = next;                      // 记下当前在响的是哪个
    next.src = MUSIC_TRACKS[name].src;
    next.currentTime = 0;
    next.volume = 0;
    const pr = next.play();
    if (pr && pr.catch) pr.catch(() => hookUnlock());
    crossfade(next, prev, name, fade || 900);
  }

  // 被自动播放策略拦下时，等第一次真实点击/按键再补播。
  //   两个细节：
  //   ① 延到下一轮任务——同一个手势里按钮的回调（可能已经切了歌）先跑完，
  //      否则补播会把玩家刚点出来的歌又抢回主菜单去；
  //   ② 已经在响就别重放，避免从头开始的"咔"一下。
  function hookUnlock(){
    if (unlockHooked) return;
    unlockHooked = true;
    const fire = () => {
      unlockHooked = false;
      setTimeout(() => {
        if (muted || paused || !cur) return;
        const a = els.find(e => e.currentSrc.endsWith(MUSIC_TRACKS[cur].src)) || els[idx];
        if (a && !a.paused) return;      // 已经在响
        start(cur, 600);
      }, 0);
    };
    document.addEventListener('pointerdown', fire, { once: true });
    document.addEventListener('keydown', fire, { once: true });
  }

  function play(name, fade){
    if (name === cur) return;
    if (!MUSIC_TRACKS[name]) return;
    cur = name;
    // 静音 / 切后台时只记住该播哪首，不真的出声
    if (muted || paused) return;
    start(name, fade || 900);
  }

  // 标签页切后台
  function pause(){ paused = true; cancelAnimationFrame(raf); curEl = null; els.forEach(a => a.pause()); }
  function resume(fade){
    if (!paused || !cur) return;
    paused = false;
    if (muted) return;
    curEl = null;
    start(cur, fade || 600);
  }
  // 静音开关。注意静音不是"暂停"，所以这里手动把 paused 归位
  function applyMute(){
    if (muted){
      paused = false;
      cancelAnimationFrame(raf);
      curEl = null;
      els.forEach(a => { a.pause(); a.volume = 0; });
    } else if (cur){ paused = false; start(cur, 400); }
  }
  return {
    play, pause, resume, applyMute,
    get track(){ return cur; },
    get live(){ return els.map(a => ({
      paused: a.paused, vol: +a.volume.toFixed(3),
      at: +a.currentTime.toFixed(2), src: a.currentSrc.replace(/^.*\//, '')
    })); }
  };
})();

// 标签页切到后台时停掉音乐，回来再放——顺便省点流量
document.addEventListener('visibilitychange', () => {
  if (document.hidden) BGM.pause();
  else BGM.resume(600);
});

// 菜单里那条「点一下才开始播放音乐」的提示：音乐真正响起来就淡掉
(function(){
  const hint = document.getElementById('soundHint');
  if (!hint) return;
  const hide = () => hint.classList.add('gone');
  const check = setInterval(() => {
    if (BGM.live.some(a => !a.paused && a.vol > 0.2)){ clearInterval(check); hide(); }
  }, 250);
  // 无论如何 15 秒后也消失，别一直挂在那儿
  setTimeout(() => { clearInterval(check); hide(); }, 15000);
})();

// ---------------- 画布 ----------------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let viewScale = 1;

function resizeCanvas(){
  const wrap = document.getElementById('arenaWrap');
  const r = wrap.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const s = Math.min(r.width / AW, r.height / AH);
  const w = AW * s, h = AH * s;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(w * dpr / AW, 0, 0, h * dpr / AH, 0, 0);
  viewScale = s;
}
function toArena(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * AW, y: (clientY - r.top) / r.height * AH };
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------------- 游戏状态 ----------------
let G = null;
let uid = 1;

function newSide(deck){
  return {
    deck: deck.slice(),
    queue: [],
    hand: [],
    next: null,
    elixir: 5,
    crowns: 0
  };
}

function newGame(){
  G = {
    running: false,
    phase: 'regular',      // regular | overtime | over
    timeLeft: 180,
    ents: [],
    fx: [],
    pending: [],           // 分波法术待落下的波次（万箭齐发）
    rolls: [],             // 正在滚的滚木 / 野蛮人滚筒
    burrows: [],           // 正在地下赶路的掘地矿工（从己方国王塔出发，12 格/秒）
    zones: [],             // 地面增益区域（狂暴法术）
    player: newSide(playerDeck),
    ai: newSide(pickAiDeck()),
    selected: null,
    hover: null,
    result: null,
    mult: 1,
    t: 0
  };
  // 塔
  const T = (team, kind, x, y)=> G.ents.push({
    id: uid++, team, kind, x, y,
    radius: kind === 'king' ? 58 : 46,
    hp: kind === 'king' ? KING_HP : PRINCESS_HP,
    maxHp: kind === 'king' ? KING_HP : PRINCESS_HP,
    dmg: kind === 'king' ? KING_DMG : PRINCESS_DMG,
    hitSpeed: kind === 'king' ? KING_HS : PRINCESS_HS,
    range: kind === 'king' ? KING_RANGE : TOWER_RANGE,
    cool: 0, rt: 0, target: null, dead: false, spawnT: 0, slowT: 0,
    isTower: true, active: kind !== 'king', targetsAir: true,
    // 公主塔射箭、国王塔射金色重弩箭
    shot: kind === 'king' ? 'royal' : 'arrow',
    kbX: 0, kbY: 0, kbT: 0,
    flash: 0, anim: Math.random() * 6
  });
  T('ai','king', 400, KING_ROW);
  T('ai','left', 150, TOWER_ROW);
  T('ai','right',650, TOWER_ROW);
  T('player','king', 400, AH - KING_ROW);
  T('player','left', 150, AH - TOWER_ROW);
  T('player','right',650, AH - TOWER_ROW);

  for (const s of ['player','ai']){
    const S = G[s];
    S.queue = shuffle(S.deck.slice());
    S.hand = S.queue.slice(0,4);
    S.next = S.queue[4];
    S.elixir = 5;
    S.crowns = 0;
  }
  G.ai.think = 1.0;
  G.ai.idle = 0;
  G.ai.lane = 0;
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ---------------- 卡牌轮换 ----------------
function cycleCard(side, i){
  const id = side.hand[i];
  side.queue.splice(i, 1);
  side.queue.push(id);
  side.hand = side.queue.slice(0, 4);
  side.next = side.queue[4];
}

// ---------------- 部署合法性 ----------------
function towerAlive(team, side){
  return G.ents.some(e => e.team === team && e.kind === side && !e.dead);
}
function canDeploy(team, x, y, card){
  if (card.type === 'spell'){
    // 滚动法术（滚木 / 野蛮人滚筒）只能在自己半场放：它们是「从后往前推」的，
    // 直接丢到对面半场等于凭空多一段射程。
    if (card.rollDist){
      if (x <= 15 || x >= AW - 15) return false;
      return team === 'player' ? (y > DEPLOY_LINE && y < AH - 15)
                               : (y < DEPLOY_LINE && y > 15);
    }
    return x > 15 && x < AW - 15 && y > 15 && y < AH - 15;
  }
  const m = 42;
  if (x < m || x > AW - m || y < m || y > AH - m) return false;
  // 塔是实体：不能在塔身上投放（贴着塔边放没问题，只是不能压在塔身上）
  for (const o of G.ents){
    if (!o.isTower || o.dead) continue;
    if (Math.hypot(x - o.x, y - o.y) < o.radius * 0.9 + 16) return false;
  }
  // 掘地矿工：可以放到地图任意位置（包括敌方半场），这是他的核心机制
  if (card.deployAnywhere) return true;
  if (team === 'player'){
    // 己方半场：从桥的正中间（河心）往下都可部署
    if (y > DEPLOY_LINE) return true;
    // 推掉敌方某侧公主塔后，该侧解锁到「距公主塔 4 格」的那条线（≈ 敌方国王塔那一排）
    if (!towerAlive('ai','left')  && x < AW/2 && y > TOWER_OPEN_ROW) return true;
    if (!towerAlive('ai','right') && x > AW/2 && y > TOWER_OPEN_ROW) return true;
    return false;
  } else {
    if (y < DEPLOY_LINE) return true;
    if (!towerAlive('player','left')  && x < AW/2 && y < AH - TOWER_OPEN_ROW) return true;
    if (!towerAlive('player','right') && x > AW/2 && y < AH - TOWER_OPEN_ROW) return true;
    return false;
  }
}

// 治疗：给半径内的己方部队回血（塔和建筑不回，满血的不飘字）
function healAround(u, amt, r){
  if (!amt || !r) return 0;
  let n = 0;
  for (const o of G.ents){
    if (o.dead || o.team !== u.team || o.isTower || o.isBuilding) continue;
    if (dist(o, u) > r + o.radius * 0.5) continue;
    if (o.hp >= o.maxHp) continue;
    o.hp = Math.min(o.maxHp, o.hp + amt);
    n++;
    G.fx.push({ type:'banner', x:o.x, y:o.y - o.radius - 12, t:0, life:0.7, text:'+' + amt, color:'#9dffc4' });
  }
  if (n) G.fx.push({ type:'ring', x:u.x, y:u.y, r0: 8, r1: r, t:0, life:0.42, color:'#9dffc4' });
  return n;
}

// 登场治疗（战斗天使）：放下去的同一瞬间给周围友军回血
function spawnHealAt(c, team, x, y){
  const r = c.healRadius || RG(3);
  let n = 0;
  for (const o of G.ents){
    if (o.dead || o.team !== team || o.isTower || o.isBuilding) continue;
    if (dist(o, { x, y }) > r + o.radius * 0.5) continue;
    if (o.hp >= o.maxHp) continue;
    o.hp = Math.min(o.maxHp, o.hp + c.spawnHeal);
    n++;
    G.fx.push({ type:'banner', x:o.x, y:o.y - o.radius - 12, t:0, life:0.7, text:'+' + c.spawnHeal, color:'#9dffc4' });
  }
  G.fx.push({ type:'ring', x, y, r0: 10, r1: r, t:0, life:0.5, color:'#9dffc4' });
  return n;
}

// 登场伤害（寒冰法师）：卡牌**落地的同一瞬间**就结算，不等 1 秒部署动画。
//   只打敌方兵（不打塔、不打建筑），范围 + 减速。
function spawnBlastAt(c, team, x, y){
  const r = c.spawnBlast || RG(1.5);
  G.fx.push({ type:'ring',  x, y, r0: 6, r1: r, t:0, life:0.36, color:'#a8e8ff' });
  G.fx.push({ type:'spell', x, y, r, a:0.42, t:0, life:0.34, color:'#7fd0e8' });
  for (const o of G.ents){
    if (o.dead || o.team === team || o.isTower || o.isBuilding) continue;
    if (dist(o, { x, y }) > r + o.radius * 0.7) continue;
    damage(o, c.spawnDmg, null, true);
    applySlow(o, c.slowOnHit || 2.5);
  }
}

// ---------------- 生成单位 ----------------
// 大群（骷髅军团 15 只）：椭圆散点，不再排成方阵。
//   用向日葵螺旋（黄金角 137.5°）铺满椭圆保证疏密均匀，再给每个点加随机偏移
//   （角度 ±0.16 rad、坐标 ±7px、长短轴每次 ±8%），所以每一把落地都不重样：
//   既不会出现整齐的行列，也不会挤成一坨。
function ellipseFormation(n, x, y){
  const pts = [];
  const k = rnd(0.92, 1.08);
  const rx = 70 * k, ry = 56 * k;                // 两轴同比缩放：形状始终是椭圆，只让大小略变
  const GA = Math.PI * (3 - Math.sqrt(5));      // 黄金角 ≈ 2.4 rad
  for (let i = 0; i < n; i++){
    const a = i * GA + rnd(-0.16, 0.16);
    const r = Math.sqrt((i + 0.55) / n);         // 面积均匀 → 半径按 sqrt 分布
    pts.push({
      x: clamp(x + Math.cos(a) * rx * r + rnd(-7, 7), 34, AW - 34),
      y: clamp(y + Math.sin(a) * ry * r + rnd(-7, 7), 34, AH - 34)
    });
  }
  return pts;
}

// 野蛮人 2-2-1：前排两个、中排两个、后排一个居中 —— 像一堵小墙推过去。
//   「前」= 朝敌方那一侧：玩家向上（y 减小）、AI 向下（y 增大），按队伍镜像。
//   间距：横向 ±22（两个半径 18 的野蛮人不会重叠），排距 40。
function wedge221(x, y, team){
  const dx = 22, dy = 40;
  const fwd = team === 'ai' ? 1 : -1;          // 「前」在 y 轴上的方向
  const rows = [[-dx, dx], [-dx, dx], [0]];
  const pts = [];
  rows.forEach((row, r) => {
    const yy = clamp(y + (1 - r) * fwd * dy, 34, AH - 34);
    for (const ox of row) pts.push({ x: clamp(x + ox, 34, AW - 34), y: yy });
  });
  return pts;
}

// 亡灵 3 只：等腰三角形，**前排两个、后排一个居中**（尖角朝自己一侧）。
//   半径 15 → 横向 ±22（底边 44）、前后各 24（高 48，两腰 52.8），收得比较紧但互不重叠。
function triangle3(x, y, team){
  const dx = 22, dy = 24;
  const fwd = team === 'ai' ? 1 : -1;          // 「前」在 y 轴上的方向
  return [
    { x: clamp(x - dx, 34, AW - 34), y: clamp(y + fwd * dy, 34, AH - 34) },   // 前左
    { x: clamp(x + dx, 34, AW - 34), y: clamp(y + fwd * dy, 34, AH - 34) },   // 前右
    { x: clamp(x,      34, AW - 34), y: clamp(y - fwd * dy, 34, AH - 34) }    // 后排中央
  ];
}

// 蝙蝠 5 只：正五边形，一个顶点朝敌方（像一枚尖头箭簇），其余四角均分圆周。
//   r = 32 → 每条边（弦长）2r·sin36° ≈ 37.6，半径 12 的蝙蝠（直径 24）仍有 13px 余量。
function pentagon5(x, y, team){
  const r = 32;
  const start = team === 'ai' ? Math.PI / 2 : -Math.PI / 2;   // 顶点朝前
  const pts = [];
  for (let i = 0; i < 5; i++){
    const a = start + i * (Math.PI * 2 / 5);
    pts.push({
      x: clamp(x + Math.cos(a) * r, 34, AW - 34),
      y: clamp(y + Math.sin(a) * r, 34, AH - 34)
    });
  }
  return pts;
}

function formation(n, x, y, team, form){
  if (form === '221') return wedge221(x, y, team);
  if (form === 'tri') return triangle3(x, y, team);
  if (form === 'penta') return pentagon5(x, y, team);
  if (n >= 10) return ellipseFormation(n, x, y);
  const pts = [];
  const cols = Math.ceil(Math.sqrt(n));
  const sp = 48;                   // 小群（2~5 只）保持紧凑的小方阵，落地整齐
  let i = 0;
  for (let r = 0; r < cols && i < n; r++){
    for (let c = 0; c < cols && i < n; c++, i++){
      pts.push({
        x: clamp(x + (c - (cols-1)/2) * sp, 34, AW-34),
        y: clamp(y + (r - (cols-1)/2) * sp, 34, AH - 34)
      });
    }
  }
  return pts;
}

// ---------------- 法术结算 ----------------
// 法术不是瞬发的：从己方国王塔出手，按 t = d / v 飞过去（v 取自数值表）。
//   防守（打自己半场）距离短 → 0.3~0.8 秒；跨图砸对面塔 → 1.3~2.3 秒，看得见、躲得开。
const SPELL_MIN_FLY = 0.12;   // 贴着国王塔扔也有个最短滞空，不然看不见弹道

function spellOrigin(team){
  // 国王塔被拆了也照样从那个位置出手，保证手感一致
  return { x: AW / 2, y: team === 'player' ? AH - KING_ROW : KING_ROW };
}

// 返回飞行时间（秒）；没有 projSpeed 的法术（雷电）返回 0 = 瞬发
function spellFlightTime(c, team, x, y){
  if (!c.projSpeed) return 0;
  return Math.max(SPELL_MIN_FLY, dist(spellOrigin(team), { x, y }) / c.projSpeed);
}

// 一波法术的命中名单：圈内所有敌方单位。
//   分波法术（万箭齐发）每一波都**重新判定位置** —— 走位能躲开后面的波，后进场的也会中招。
//   埋在地下的电磁塔每一波都免疫：飘「免疫」提示，一点伤害都不吃。
//   雷电法术带 maxTargets：只劈圈内血量最高的 N 个（和皇室战争一致）。
function spellTargets(c, team, x, y, showImmune){
  const list = [];
  for (const e of G.ents){
    if (e.dead || e.team === team) continue;
    if (dist(e, {x,y}) > c.spellRadius + e.radius * 0.6) continue;
    if (e.hidden || e.cloak){
      if (showImmune) G.fx.push({ type:'banner', x:e.x, y:e.y - 26, t:0, life:0.9, text: e.cloak ? '隐身' : '免疫', color:'#ffe07a' });
      continue;
    }
    list.push(e);
  }
  // 雷电：只保留血量最高的 N 个（slice 会返回新数组，必须 return 它）
  if (c.maxTargets) return list.sort((a, b) => b.hp - a.hp).slice(0, c.maxTargets);
  return list;
}

// 结算：数值表里法术分「范围伤害」和「对皇家塔伤害」两列，
// 打防御塔（公主塔 / 国王塔）用 towerDmg，打其它单位用 dmg；雷电额外挂眩晕。
// 击退：把 e 从爆心 (x,y) 向外掀开 dist 像素，分 KB_TIME 秒走完。
//   位移在 updateEnt 里按指数衰减逐帧施加，所以看起来是"被掀开、慢慢停住"，
//   而不是瞬移一段距离。
const KB_TIME = 0.22;
function applyKnockback(e, x, y, dist){
  let dx = e.x - x, dy = e.y - y;
  let d = Math.hypot(dx, dy);
  if (d < 0.001){ dx = 0; dy = -1; d = 1; }   // 正好站在爆心：默认往上掀
  e.kbX = dx / d * dist;
  e.kbY = dy / d * dist;
  e.kbT = KB_TIME;
}

// 眩晕 / 冰冻：打断型控制。除了停住行动和攻击冷却，还要**打断目标锁定**——
//   被打断的单位解控后会重新索敌（可能锁回同一个，也可能换成更近的）。
//   冰冻复用 stun 计时（见 explodeUnit），所以这里一处就够了。
function applyStun(e, amt){
  if (!e || e.dead || !(amt > 0)) return;
  e.stun = Math.max(e.stun || 0, amt);
  e.target = null;
}

// 减速（大雪球 3s / 戈仑冰人亡语 2s）：不是打断，所以**不清目标**、也不停火，
//   只是把移动速度和攻击速度按 SLOW_RATE 放慢；多段减速取最长的那个。
function applySlow(e, dur){
  if (!e || e.dead || !(dur > 0)) return;
  e.slowT = Math.max(e.slowT || 0, dur);
}

function spellApply(c, list, x, y){
  for (const e of list){
    if (e.dead) continue;
    const amt = (e.isTower && c.towerDmg != null) ? c.towerDmg : c.dmg;
    damage(e, amt, null, true);
    if (c.stun) applyStun(e, c.stun);
    if (c.slow) applySlow(e, c.slow);
    // 击退：只有 5 费及以下的单位会被掀开（塔和建筑固定不动，被打死的也不推）
    const cc = CARDS[e.cardId];
    if (c.knockback && !e.dead && !e.isTower && !e.isBuilding &&
        cc && cc.cost <= 5 && !cc.noKnockback)
      applyKnockback(e, x, y, c.knockback);
  }
}

// 单道雷：从天上劈下来，命中即结算。
//   雷电法术的三道雷是**接续**落下的，每道只管自己锁定的那个目标。
//   目标在中途被别的伤害打死时，雷照样劈在它倒下的位置，但不再结算伤害。
function strikeBolt(c, e, sx, sy, quiet){
  const px = (e && !e.dead) ? e.x : sx;
  const py = (e && !e.dead) ? e.y : sy;
  G.fx.push({ type:'bolt', x:px, y:py, seed: Math.random() * 6.283, t:0, life:0.42 });
  sfxThunder(quiet ? 0.7 : 1);
  if (e && !e.dead) spellApply(c, [e], sx, sy);
}

// 落下一波：先出特效 / 音效，再结算伤害
// 藤蔓法术：不是「砸下去就结算」，而是在落点长出一片 2 秒的藤蔓（见 G.zones 里的 kind:'vines'）：
//   · 每 0.2 秒结算一次持续伤害（153/秒，塔 35/秒）
//   · 最多同时定身 3 个敌人（先近后远）
//   · 飞行单位被拽到地面 —— 定身期间按地面单位处理，地面兵也能打到它
function castVines(c, team, x, y){
  G.fx.push({ type:'ring',  x, y, r0: 10, r1: c.spellRadius, t:0, life:0.45, color:'#8ef0a0' });
  G.fx.push({ type:'spell', x, y, r: c.spellRadius, a:0.50, t:0, life:0.5, color:'#3fae5a' });
  sfxVines();
  G.zones.push({ kind:'vines', x, y, r: c.spellRadius, t: c.vineDur, team, born: 0,
                 dps: c.dmg, towerDps: c.towerDmg != null ? c.towerDmg : c.dmg,
                 max: c.vineMax || 3, tick: 0 });
}

// 地震法术：落点裂开一片 3 秒的地面（G.zones 里 kind:'quake'）
//   · 只打**地面**单位：每秒 81 伤害 + 减速 50%（空中单位完全不吃）
//   · 建筑每秒 283，皇家塔每秒 49
function castQuake(c, team, x, y){
  G.fx.push({ type:'ring',  x, y, r0: 10, r1: c.spellRadius, t:0, life:0.5, color:'#e0b878' });
  G.fx.push({ type:'spell', x, y, r: c.spellRadius, a:0.46, t:0, life:0.5, color:'#8a5a24' });
  sfxQuake();
  G.zones.push({ kind:'quake', x, y, r: c.spellRadius, t: c.quakeDur, team, born: 0,
                 dps: c.dmg, towerDps: c.towerDmg != null ? c.towerDmg : c.dmg,
                 buildingDps: c.buildingDmg || c.dmg, tick: 0 });
}

// 飓风法术：落点卷起 1 秒的旋风（G.zones 里 kind:'tornado'）
//   · 空中和地面的单位都会被往中心拽（两边阵营都拽，和皇室战争一样）
//   · 只对敌方造成伤害：总共 84（塔 25），分 1 秒结算
function castTornado(c, team, x, y){
  G.fx.push({ type:'ring', x, y, r0: 12, r1: c.spellRadius, t:0, life:0.5, color:'#bfe8ff' });
  sfxTornado();
  G.zones.push({ kind:'tornado', x, y, r: c.spellRadius, t: c.tornadoDur, team, born: 0,
                 dps: c.dmg / c.tornadoDur,
                 towerDps: (c.towerDmg != null ? c.towerDmg : c.dmg) / c.tornadoDur, tick: 0.2 });
}

// 克隆法术：把范围内的**己方部队**各复制一份。
//   复制体只有 1 点生命 + 1 点护盾（护盾能替它挡掉第一下），伤害与本尊完全一样；
//   复制体带 isClone 标记，不会被再次克隆（否则一个克隆法术能无限复制）。
function castClone(c, team, x, y){
  G.fx.push({ type:'ring', x, y, r0: 10, r1: c.spellRadius, t:0, life:0.5, color:'#d0a0f0' });
  sfxClone();
  let n = 0;
  for (const e of G.ents.slice()){
    if (e.dead || e.team !== team || e.isTower || e.isBuilding || e.isClone) continue;
    if (dist(e, { x, y }) > c.spellRadius + e.radius * 0.6) continue;
    const u = spawnUnit(e.cardId, team, e.x, e.y + 8, e.x < AW / 2 ? 0 : 1, { deploy: 0.12 });
    if (!u) continue;
    u.hp = 1; u.maxHp = 1;
    // 护盾只在「本尊本来就有」时才给 1 点（骷髅守卫这类），普通兵克隆出来就是纯 1 血、没有盾
    u.shield = (e.shield > 0) ? 1 : 0;
    u.isClone = true;
    u.cloak = false;                     // 克隆体不继承隐身，免得幽灵无限隐身
    n++;
    G.fx.push({ type:'ring', x:u.x, y:u.y, r0: 4, r1: 30, t:0, life:0.35, color:'#e8b8ff' });
  }
  if (n === 0) G.fx.push({ type:'banner', x, y: y - 30, t:0, life:0.9, text:'没有可克隆的单位', color:'#d0a0f0' });
}

// 冰冻法术：落点瞬间把范围内**所有**敌人（含空中）冻住 3.5 秒，同时造成伤害。
//   机制上就是长眩晕（stun），frozenT 只负责画那层冰壳。
function castFreeze(c, team, x, y){
  const hits = spellTargets(c, team, x, y, true);
  G.fx.push({ type:'ring',  x, y, r0: 12, r1: c.spellRadius, t:0, life:0.55, color:'#dff4ff' });
  G.fx.push({ type:'spell', x, y, r: c.spellRadius, a:0.55, t:0, life:0.50, color:'#a8e4ff' });
  for (let i = 0; i < 12; i++){                       // 四散的冰晶
    const a = Math.random() * Math.PI * 2, rr = c.spellRadius * (0.25 + Math.random() * 0.7);
    G.fx.push({ type:'spark', x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr, t:0,
                life: 0.35 + Math.random() * 0.2, color:'#dff4ff', r: 3 + Math.random() * 3, n: 2 });
  }
  sfxFreeze();
  const dur = c.stun || 3.5;
  for (const e of hits){
    if (e.dead) continue;
    const amt = (e.isTower && c.towerDmg != null) ? c.towerDmg : c.dmg;
    damage(e, amt, null, true);
    applyStun(e, dur);
    e.frozenT = Math.max(e.frozenT || 0, dur);
  }
}

// 毒药法术：落点留下 8 秒的毒池（G.zones 里 kind:'poison'）
//   每 0.5 秒结算一次：兵 92/秒、塔 21/秒；范围内敌人移动减速 15%
function castPoison(c, team, x, y){
  G.fx.push({ type:'ring',  x, y, r0: 12, r1: c.spellRadius, t:0, life:0.5, color:'#c8f08a' });
  G.fx.push({ type:'spell', x, y, r: c.spellRadius, a:0.42, t:0, life:0.5, color:'#5a9a2a' });
  sfxPoison();
  G.zones.push({ kind:'poison', x, y, r: c.spellRadius, t: c.poisonDur, team, born: 0,
                 dps: c.dmg, towerDps: c.towerDmg != null ? c.towerDmg : c.dmg, tick: 0 });
}

// 定身：不能移动，但可以正常攻击（和皇室战争的「定身」一致）。
//   飞行单位被拽下来：临时把 flying 关掉，定身结束时再恢复（wasFlying 记录原状态）。
function applyRoot(e, dur){
  if (!e || e.dead || e.isTower || e.isBuilding) return;
  e.rootT = Math.max(e.rootT || 0, dur);
  if (e.flying){ e.wasFlying = true; e.flying = false; }
}

function spellVolley(c, team, x, y, idx){
  if (c.vineDur){ castVines(c, team, x, y); return; }
  if (c.quakeDur){ castQuake(c, team, x, y); return; }
  if (c.tornadoDur){ castTornado(c, team, x, y); return; }
  if (c.clone){ castClone(c, team, x, y); return; }
  if (c.freezeSpell){ castFreeze(c, team, x, y); return; }
  if (c.poisonDur){ castPoison(c, team, x, y); return; }
  const multi = (c.waves || 1) > 1;
  const hits = spellTargets(c, team, x, y, idx === 0);

  if (c.maxTargets){
    // 雷电：落点在这里一次锁定，之后按 strikeGap 一道一道劈下去
    //   圈里没人也朝中心劈一道空的，让玩家看到法术确实落了
    const pts = hits.length ? hits : [null];
    const gap = c.strikeGap || 0.15;
    G.fx.push({ type:'ring', x, y, r0: 12, r1: c.spellRadius, t:0, life:0.42, color:'#cfe0ff' });
    pts.forEach((e, i) => {
      const sx = e ? e.x : x, sy = e ? e.y : y;
      if (i === 0) strikeBolt(c, e, sx, sy, false);
      else G.pending.push({ t: gap * i, bolt: true, card: c, team, target: e, sx, sy });
    });
    return;
  }

  G.fx.push({ type:'ring',  x, y, r0: 10, r1: c.spellRadius, t:0, life: multi ? 0.34 : 0.5,
              color: c.zapBurst ? '#ffe066' : '#fff' });
  // 分波法术把中心闪光压小压淡，让「落箭」成为主角，否则三波连着闪会把画面糊成一片白
  G.fx.push({ type:'spell', x, y, r: c.spellRadius * (multi ? 0.40 : (c.zapBurst ? 0.78 : 1)),
              a: multi ? 0.34 : (c.zapBurst ? 0.60 : 0.75), t:0, life: multi ? 0.22 : 0.55, color: c.c1 });
  // 分波法术额外画一片「落箭」，让三波在视觉上分得清
  if (multi) G.fx.push({ type:'volley', x, y, r: c.spellRadius, t:0, life: 0.40, seed: idx * 41 + 7 });
  if (c.zapBurst){
    // 电击法术：从落点向四周甩出一圈短电弧 —— 和雷电法术「从天而降的三道雷」区分开
    for (let i = 0; i < 7; i++){
      const a = Math.random() * Math.PI * 2;
      const rr = c.spellRadius * (0.42 + Math.random() * 0.55);
      G.fx.push({ type:'shot', kind:'zap', x0:x, y0:y, x1:x + Math.cos(a) * rr, y1:y + Math.sin(a) * rr,
                  t:0, life: 0.10 + Math.random() * 0.09, color:'#ffe066', w: 2.6, arc: 0, seed: Math.random() * 6.283 });
    }
    sfxThunder(0.55);                       // 比雷电法术轻一档的爆裂声
  } else if (multi) sfxVolley(idx); else sfxSpell();
  // 狂暴法术：落点留下一个持续 4.5 秒的增益区域
  if (c.rageDur){
    G.zones.push({ x, y, r: c.spellRadius, t: c.rageDur, team, born: 0 });
  }
  spellApply(c, hits, x, y);
}

// ---------------- 滚动法术（滚木 / 野蛮人滚筒） ----------------
// 从落点朝敌方滚一段：路径上的**地面**单位各吃一次伤害（滚木还带击退）。
//   命中判定用「本帧扫过的矩形」而不是只看当前位置，滚得再快也不会漏掉目标。
//   滚完就消失；野蛮人滚筒会在终点放出一个野蛮人。
function startRoll(c, team, x, y){
  G.rolls.push({
    card: c, team,
    x: clamp(x, 30, AW - 30), y: clamp(y, 30, AH - 30),
    dir: team === 'player' ? -1 : 1,          // 玩家朝敌方（向上）滚
    traveled: 0, spin: 0, hit: new Set(), done: false
  });
  if (c.rollKind === 'log') sfxLogRoll(); else sfxLaunch();
}

function updateRolls(dt){
  for (const r of G.rolls){
    const c = r.card;
    const step = c.rollSpeed * dt;
    const y0 = r.y;
    r.y += r.dir * step;
    r.traveled += step;
    r.spin += step * 0.18;
    const half = c.rollWidth / 2;
    // 滚动扬尘：往身后飘，让「在滚」这件事一眼可见
    if (Math.random() < 0.5){
      G.fx.push({ type:'dust', x: r.x + rnd(-half * 0.8, half * 0.8), y: r.y - r.dir * half * 0.32,
                  t:0, life: 0.30, r: 4 + Math.random() * 3 });
    }
    const ya = Math.min(y0, r.y) - half, yb = Math.max(y0, r.y) + half;
    for (const e of G.ents){
      if (e.dead || e.team === r.team || e.flying) continue;     // 只碾地面
      if (e.isTower && c.towerDmg == null) continue;             // 打不到塔的法术（野蛮人滚筒）直接无视塔
      if (r.hit.has(e.id)) continue;                             // 每个目标只吃一次
      if (Math.abs(e.x - r.x) > half + e.radius * 0.7) continue;
      if (e.y + e.radius < ya || e.y - e.radius > yb) continue;
      r.hit.add(e.id);
      const amt = (e.isTower && c.towerDmg != null) ? c.towerDmg : c.dmg;
      damage(e, amt, null, true);
      if (c.knockback && !e.dead && !e.isTower && !e.isBuilding){
        const cc = CARDS[e.cardId];
        if (cc && cc.cost <= 5 && !cc.noKnockback) applyKnockback(e, r.x, r.y, c.knockback);
      }
    }
    if (r.traveled >= c.rollDist || r.y < 24 || r.y > AH - 24){
      if (c.spawnAfter && !r.done){
        r.done = true;
        spawnUnit(c.spawnAfter, r.team, r.x, clamp(r.y, 40, AH - 40));
        G.fx.push({ type:'ring', x:r.x, y:r.y, r0: 6, r1: 36, t:0, life:0.35, color:'#ffd9a8' });
      }
      r.dead = true;
    }
  }
  G.rolls = G.rolls.filter(r => !r.dead);
}

// 生成单个单位。doSpawn 按阵型批量调用；野蛮人滚筒滚完也直接调它生成那只野蛮人。
//   opts.deploy  : 落地时间覆盖（召唤出来的兵不是「从手里放下」，只给一个很短的破壳动画）
//   opts.firstHit: 首次出手蓄力覆盖（哥布林飞桶的哥布林一落地就该咬塔）
function spawnUnit(cardId, team, x, y, lane, opts){
  const c = CARDS[cardId];
  const o = opts || {};
  const u = {
    id: uid++, cardId, team, x, y,
    radius: c.radius, hp: c.hp, maxHp: c.hp, dmg: c.dmg, hitSpeed: c.hitSpeed,
    // 对皇家塔的伤害可以单独设（掘地矿工：打兵 194、打塔 39）
    towerDmg: c.towerDmg != null ? c.towerDmg : null,
    // 命中附带减速（寒冰法师）：每次攻击都刷新 2.5 秒
    slowOnHit: c.slowOnHit || 0,
    speed: c.speed, range: c.range,
    targetsAir: !!c.targetsAir, buildingsOnly: !!c.buildingsOnly,
    splash: c.splash || 0, spin: !!c.spin, flying: !!c.flying,
    // 远程单位的弹道外观（弓箭 / 子弹 / 法术球 / 炮弹 / 电弧 / 长矛）
    shot: c.shot || null,
    // 迫击炮：炮弹打的是「开炮时瞄的那个点」，不追踪目标 —— 目标走开就打空
    shotNoHome: !!c.shotNoHome,
    // 自爆单位（精灵系 / 攻城炸弹人）：贴到目标就炸，blast 是爆炸半径
    suicide: !!c.suicide, blast: c.blast || 0, dash: 0, dashT: 0,
    // 精灵的附加效果：冰冻时长 / 治疗量+持续时间 / 电弧连锁上限
    freeze: c.freeze || 0, healAmt: c.healAmt || 0, healDur: c.healDur || 0,
    chainMax: c.chainMax || 0, stun: 0, healT: 0, healRate: 0, slowT: 0,
    // 击退状态（火球）：剩余位移 + 剩余时间
    kbX: 0, kbY: 0, kbT: 0,
    jumpRiver: !!c.jumpRiver, jump: 0, jumpT: 0,
    cool: 0, rt: Math.random()*0.3, target: null, dead: false, atkReady: false,
    screamed: false,
    // 定身（藤蔓法术）：>0 时不能移动，但仍能攻击；wasFlying 记录「被拽下来的飞行单位」
    rootT: 0, wasFlying: false,
    quakeT: 0,
    // 皇家幽灵：隐身（cloak）—— 敌人索敌 / 法术都选不到；出手后 visibleT 计时，到点重新隐身
    stealth: !!c.stealth, cloak: !!c.stealth, visibleT: 0,
    isClone: false,        // 克隆体：不能再被克隆
    hutIdle: false,        // 哥布林小屋：探测圈里没有敌人、暂停产兵中
    // 幻影刺客：bdash 突袭中（速度 ×5 且无敌），dashBonus 是落地那一下的伤害，dashCd 是冷却
    bdash: 0, dashBonus: 0, dashCd: 0, invuln: 0, atkSounded: false,
    dashRange: c.dashRange || 0, dashMin: c.dashMin || 0, dashDmg: c.dashDmg || 0,
    // 迫击炮这类「有盲区」的单位：比 minRange 更近的目标打不到
    minRange: c.minRange || 0,
    // 野蛮人攻城锤：走满 chargeDist 进入冲刺（速度换成 chargeSpeed），撞上去那一下用 chargeDmg
    // 猎人：一次打出 pellets 颗弹丸，弹丸最远飞 projRange
    pellets: c.pellets || 0, projRange: c.projRange || 0,
    // 毒药法术的减速（15%）：只影响移动，不占大雪球那套 35% 减速
    poisonT: 0,
    // 战斗天使：登场治疗 spawnHeal、每次攻击治疗 healOnHit（半径 healRadius）
    spawnHeal: c.spawnHeal || 0, healOnHit: c.healOnHit || 0, healRadius: c.healRadius || 0,
    // 冰冻法术的视觉：冻住期间盖一层冰壳（机制上还是走 stun）
    frozenT: 0,
    chargeDist: c.chargeDist || 0, chargeDmg: c.chargeDmg || 0, chargeSpeed: c.chargeSpeed || 0,
    charged: false, chargeMoved: 0, chargeFxT: 0,
    breaksOnHit: !!c.breaksOnHit,       // 撞到目标就散架（攻城锤）
    // 渔夫的钩子：hookMin~hookMax 之间出手，0.28 秒后把目标拽到身边，6 秒冷却
    hookMin: c.hookMin || 0, hookMax: c.hookMax || 0, hookCd: 0, hookT: 0, hookWind: 0, hookTarget: null,
    hookVictim: null,      // 已经钩到手、正在打的那只；它死了才允许再钩
    // 护盾（骷髅守卫）：先扣护盾再扣血；狂暴：踩在狂暴区域里的剩余刷新时间
    shield: c.shield || 0, shieldMax: c.shield || 0, rageT: 0,
    // 固定进攻路（0=左 1=右）：召唤出来的兵用召唤者的路，避免「同一点出生的两个兵各走一边」
    lane: lane == null ? null : lane,
    spawnT: o.deploy != null ? o.deploy : (c.deploy || DEPLOY_TIME),
    firstHit: o.firstHit != null ? o.firstHit : null,
    anim: Math.random()*6, facing: team === 'player' ? -1 : 1
  };
  G.ents.push(u);
  return u;
}

function doSpawn(cardId, team, x, y){
  const c = CARDS[cardId];
  // 法术用自己的出手音（破空 / 雷击），不叠部署音
  if (c.type !== 'spell'){
    sfxDeploy();
    // 野猪骑士 / 迷你皮卡 / 皮卡超人 / 飞龙宝宝有专属登场音（前三家两段连在一起），叠在通用部署音上
    if (cardId === 'battleHealer') sfxHealerDeploy();
    else if (cardId === 'dartGoblin') sfxDartDeploy();
    else if (cardId === 'knight') sfxKnightDeploy();
    else if (cardId === 'royalGhost') sfxGhostDeploy();
    else if (cardId === 'fisherman') sfxFisherDeploy();
    else if (cardId === 'bandit') sfxBanditDeploy();
    else if (cardId === 'giant') sfxGiantDeploy();
    else if (cardId === 'hogRider') sfxHogDeploy();
    else if (cardId === 'miniPekka') sfxMiniPekkaDeploy();
    else if (cardId === 'pekka') sfxPekkaDeploy();
    else if (cardId === 'babyDragon') sfxBabyDragonDeploy();
    else if (cardId === 'wizard') sfxWizardDeploy();
  }

  if (c.type === 'spell'){
    // 召唤型法术（哥布林飞桶）：飞到目标点砸开 → 召唤单位，本身不造成伤害
    if (c.spawnTroops){
      const fly = Math.max(spellFlightTime(c, team, x, y), 0.55);
      const o = spellOrigin(team);
      G.fx.push({ type:'proj', x0: o.x, y0: o.y, x1: x, y1: y, t:0, life: fly,
                  kind: c.projKind || 'barrel', color: c.c1 });
      sfxBarrelFly();
      G.pending.push({ t: fly, summon: true, card: c, team, x, y });
      return;
    }
    // 滚木 / 野蛮人滚筒：不是「落地就爆」，而是从落点朝敌方滚一段距离
    if (c.rollDist){ startRoll(c, team, x, y); return; }
    const waves = c.waves || 1;
    const gap = c.waveGap || 0;
    const fly = spellFlightTime(c, team, x, y);
    if (fly > 0){
      // 有飞行时间：先飞一枚弹道，命中时刻才结算；分波法术的后续波次接在命中之后
      const o = spellOrigin(team);
      G.fx.push({ type:'proj', x0: o.x, y0: o.y, x1: x, y1: y, t:0, life: fly,
                  kind: c.projKind || 'fire', color: c.c1 });
      // 万箭齐发和火球各有专属飞行音，不再叠通用破空音；雷电仍是瞬发
      if (cardId === 'arrows') sfxArrowsFly();
      else if (cardId === 'fireball') sfxFireballFly();
      else sfxLaunch();
      for (let i = 0; i < waves; i++) G.pending.push({ t: fly + gap * i, card: c, team, x, y, i, id: cardId });
    } else {
      spellVolley(c, team, x, y, 0);
      for (let i = 1; i < waves; i++) G.pending.push({ t: gap * i, card: c, team, x, y, i });
    }
    return;
  }

  if (c.type === 'building'){
    G.ents.push({
      id: uid++, cardId, team, x, y,
      radius: c.radius, hp: c.hp, maxHp: c.hp, dmg: c.dmg, hitSpeed: c.hitSpeed,
      range: c.range, targetsAir: !!c.targetsAir, buildingsOnly: false,
      splash: c.splash || 0, flying: false, cool: 0.5, rt: 0, target: null, dead: false, slowT: 0,
      minRange: c.minRange || 0,                 // 迫击炮的盲区
      shot: c.shot || null,
      shotNoHome: !!c.shotNoHome,                // 迫击炮：炮弹不追踪
      isBuilding: true, decay: c.hp / c.lifetime,
      spawnT: c.deploy || DEPLOY_TIME,           // 迫击炮部署要 3.5 秒
      anim: 0, speed: 0,
      kbX: 0, kbY: 0, kbT: 0,
      // 钻地建筑（电磁塔）：emerge 0=埋在地下 1=完全升起；hidden 期间免疫法术
      burrow: !!c.burrow, emerge: c.burrow ? 0 : 1, hidden: !!c.burrow, wasUp: false,
      hutIdle: false,        // 哥布林小屋：探测圈里没敌人、暂停产兵中
    });
    G.fx.push({ type:'ring', x, y, r0: 4, r1: 44, t:0, life: c.deploy || DEPLOY_TIME, color:'#ffffff' });
    return;
  }

  // 掘地矿工：不在落点凭空出现，而是从**己方国王塔**地下钻过去，12 格/秒
  //   —— 所以丢得越远到得越晚（丢到对面塔边大约 1.9 秒），这段时间里他完全不存在，
  //   打不到、也不会被索敌。到点了才在目标点冒出来（见 G.pending 里的 q.burrow）。
  if (c.burrowTravel){
    const from = spellOrigin(team);
    const d = dist(from, { x, y });
    const dur = Math.max(0.25, d / (c.burrowSpeed || RG(12)));
    G.burrows.push({ x0: from.x, y0: from.y, x1: x, y1: y, t: dur, dur, team, cardId });
    G.pending.push({ t: dur, burrow: { team, x, y, cardId } });
    return;
  }

  // 哥布林团伙：两种兵一起出 —— 前排 3 个哥布林，后排 3 个哥布林投矛手
  //   （spawnUnit 每次只出一个，所以这里按 3+3 逐个点名，别走通用 formation）
  if (cardId === 'goblinGang'){
    const fwd = team === 'ai' ? 1 : -1;
    const lane = x < AW / 2 ? 0 : 1;
    for (const dx of [-30, 0, 30])
      spawnUnit('goblin', team, clamp(x + dx, 34, AW - 34), clamp(y + fwd * 16, 34, AH - 34), lane);
    for (const dx of [-30, 0, 30])
      spawnUnit('spearGoblins', team, clamp(x + dx, 34, AW - 34), clamp(y - fwd * 22, 34, AH - 34), lane);
    G.fx.push({ type:'ring', x, y, r0: 4, r1: 46, t:0, life: DEPLOY_TIME, color:'#ffffff' });
    return;
  }

  const pts = formation(c.count || 1, x, y, team, c.form);
  for (const p of pts) spawnUnit(cardId, team, p.x, p.y);
  if (c.spawnDmg) spawnBlastAt(c, team, x, y);      // 寒冰法师：放下去的同时就炸
  if (c.spawnHeal) spawnHealAt(c, team, x, y);      // 战斗天使：放下去的同时给周围友军回血
  G.fx.push({ type:'ring', x, y, r0: 4, r1: 40, t:0, life: DEPLOY_TIME, color:'#ffffff' });
}

// 在指定位置召唤一个单位（骷髅墓碑出兵 / 哥布林飞桶落地 / 墓碑亡语 共用）。
//   直接复用 spawnUnit，所以召唤出来的兵和正常投放的完全一样（含落地动画）。
//   opts 见 spawnUnit：召唤兵默认只给很短的破壳时间，不再是手里放下那 1 秒。
function summonAt(cardId, team, x, y, lane, opts){
  if (!CARDS[cardId]) return null;
  return spawnUnit(cardId, team,
                   clamp(x, 34, AW - 34), clamp(y, 34, AH - 34), lane,
                   opts || { deploy: SUMMON_DEPLOY });
}

// ---------------- 伤害 ----------------
function damage(e, amt, from, silent){
  if (e.dead) return;
  // 烈焰精灵扑击途中是腾空的：这段时间不可被选中，
  // 否则它一定会在落地前被近战先手打死，自爆机制等于废掉
  if (e.dash > 0) return;
  if (e.invuln > 0){
    // 幻影刺客突袭瞬间无敌：冒个粉圈 + 飘「免疫」，让玩家看得出这一下被吃掉了
    if (!silent){
      G.fx.push({ type:'ring', x:e.x, y:e.y, r0: e.radius * 0.6, r1: e.radius * 2.3, t:0, life:0.26, color:'#ff9ad0' });
      G.fx.push({ type:'banner', x:e.x, y:e.y - e.radius - 14, t:0, life:0.55, text:'免疫', color:'#ff9ad0' });
    }
    return;
  }
  // 护盾（骷髅守卫）：和皇室战争一致 —— 不管这一下有多疼，都完整挡下来，然后碎掉。
  // 所以哪怕盾只剩 1 点，也能吃掉一发火球 / 皮卡重击，血量一点不掉。
  if (e.shield > 0 && amt > 0){
    e.shield = 0;
    G.fx.push({ type:'ring', x:e.x, y:e.y, r0: e.radius * 0.7, r1: e.radius * 2.6, t:0, life:0.36, color:'#d8ecff' });
    G.fx.push({ type:'ring', x:e.x, y:e.y, r0: e.radius * 0.5, r1: e.radius * 1.7, t:0, life:0.24, color:'#8ec8ff' });
    G.fx.push({ type:'spark', x:e.x, y:e.y, t:0, life:0.30, color:'#cfe8ff', r: e.radius * 1.7, n: 8 });
    if (!silent) sfxShieldBreak();
    return;                       // 这一下被护盾全吃掉，不扣血
  }
  e.hp -= amt;
  if (!silent) sfxHit();
  // 国王塔挨打也会被激活（哪怕两座公主塔都还在）
  if (e.isTower && e.kind === 'king') activateKing(e);
  if (e.hp <= 0) kill(e);
}

// 国王塔激活：两个触发条件 —— ① 己方一座公主塔被摧毁；② 自身受到伤害。
// 只生效一次，并给出醒目的反馈：双环爆开 + 塔身白光 + 飘字 + 音效
function activateKing(k){
  if (!k || k.active || k.dead) return false;
  k.active = true;
  k.flash = 0.9;
  const col = k.team === 'player' ? '#7fb2ff' : '#ff8a8a';
  G.fx.push({ type:'ring', x:k.x, y:k.y, r0: k.radius * 0.5, r1: k.radius * 3.0, t:0, life:0.75, color: col });
  G.fx.push({ type:'ring', x:k.x, y:k.y, r0: k.radius * 0.5, r1: k.radius * 2.1, t:0, life:0.5,  color:'#ffffff' });
  G.fx.push({ type:'banner', x:k.x, y:k.y - k.radius - 30, t:0, life:1.5,
              text:'国王塔激活！', color: col });
  sfxActivate();
  return true;
}

function kill(e){
  if (e.dead) return;
  e.dead = true;
  G.fx.push({ type:'boom', x:e.x, y:e.y, r: e.radius * (e.isTower ? 2.4 : 1.4), t:0, life:0.45,
              color: e.team === 'player' ? '#6fa8ff' : '#ff8a8a' });

  // 戈仑冰人亡语：原地炸开一圈冰霜 —— 84 范围伤害 + 附近敌人减速 2 秒（数值表）
  //   和自爆精灵不同，它只在**死亡**时触发，被塔打死 / 被打死都会炸。
  const dc = e.cardId ? CARDS[e.cardId] : null;
  if (dc && dc.deathBlast && !e.isTower){
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 10, r1: dc.deathBlast, t:0, life:0.46, color:'#bfe8ff' });
    G.fx.push({ type:'spell', x:e.x, y:e.y, r: dc.deathBlast, a:0.50, t:0, life:0.36, color:'#9fd8ff' });
    for (const o of G.ents){
      if (o.dead || o.team === e.team) continue;
      if (o.hidden) continue;                                  // 钻在地下的电磁塔免疫
      if (dist(o, e) > dc.deathBlast + o.radius * 0.6) continue;
      damage(o, dc.deathDmg || 0, null, true);
      applySlow(o, dc.deathSlow || 0);
    }
  }

  // 亡语召唤（骷髅墓碑 / 骷髅气球）：被摧毁 / 自爆时再召唤 deathSpawn 个兵
  if (dc && dc.deathSpawn && !e.isTower){
    const n = dc.deathSpawn;
    if (dc.deathSpawnFan && e.selfDestruct){
      // 骷髅气球**撞到塔自爆**：骷髅只掉在塔的**进攻侧**，呈扇形铺开，离塔心刚好在近战距离内
      //   —— 够得着塔，但不会把整座塔围一圈（围一圈会在塔后面站一堆，看着很怪）。
      //   注意：如果是被单位打爆的（selfDestruct 为 false），不走这里 —— 骷髅就掉在爆炸原地。
      let tgt = (e.target && e.target.isTower && !e.target.dead) ? e.target : null;
      if (!tgt){
        let best = 1e9;
        for (const o of G.ents){
          if (o.dead || !o.isTower || o.team === e.team) continue;
          const d = dist(o, e);
          if (d < best){ best = d; tgt = o; }
        }
      }
      const cx = tgt ? tgt.x : e.x, cy = tgt ? tgt.y : e.y;
      const dir = e.team === 'player' ? 1 : -1;        // 玩家从下往上打：骷髅落在塔的下方
      const R = (tgt ? tgt.radius : 30) + 28;          // ≈74：贴着塔身外侧，近战距离(≈82)之内
      const spread = 1.15;                             // 扇形张角 ≈ 66°：集中在塔的正前方，不绕到两侧
      for (let i = 0; i < n; i++){
        const t = n > 1 ? i / (n - 1) - 0.5 : 0;
        const a = (dir > 0 ? Math.PI / 2 : -Math.PI / 2) + t * spread;
        summonAt(dc.spawnCard, e.team, cx + Math.cos(a) * R, cy + Math.sin(a) * R,
                 cx < AW / 2 ? 0 : 1);
      }
    } else {
      for (let i = 0; i < n; i++){
        const a = -Math.PI / 2 + i * Math.PI * 2 / n;
        summonAt(dc.spawnCard, e.team, e.x + Math.cos(a) * 30, e.y + Math.sin(a) * 30,
                 e.x < AW / 2 ? 0 : 1);     // 亡语召唤也锁定同一条路，别让 4 只分头走
      }
    }
    G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 8, r1: 62, t:0, life:0.42, color:'#cfd8ff' });
  }

  // 圣水戈仑：被消灭的每一块都给对手 0.5 圣水（大戈仑 / 小戈仑 / 泡泡都算）
  if (dc && dc.elixirGift && !e.isTower){
    const foe = e.team === 'player' ? 'ai' : 'player';
    G[foe].elixir = Math.min(10, (G[foe].elixir || 0) + dc.elixirGift);
    G.fx.push({ type:'banner', x:e.x, y:e.y - 30, t:0, life:0.8,
                text:'+' + dc.elixirGift + ' 圣水', color:'#d9a8f0' });
  }

  if (e.isTower){
    sfxTower();
    const foe = e.team === 'player' ? 'ai' : 'player';
    if (e.kind === 'king'){
      G[foe].crowns = 3;
      finish(foe === 'player' ? 'win' : 'lose');
      return;
    }
    G[foe].crowns++;
    // 己方公主塔掉一座 → 己方国王塔激活
    activateKing(G.ents.find(x => x.team === e.team && x.kind === 'king'));
    toast(foe === 'player' ? '摧毁敌方公主塔！' : '己方公主塔被摧毁');
    if (G.phase === 'overtime') finish(foe === 'player' ? 'win' : 'lose');
  }
}

// ---------------- 索敌 ----------------
function nearestEnemyTower(u){
  let best = null, bd = Infinity;
  for (const e of G.ents){
    if (e.dead || e.team === u.team || !e.isTower) continue;
    const d = dist(e, u);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

function findTarget(u){
  const isDef = u.isTower || u.isBuilding;
  const aggro = u.buildingsOnly ? Infinity : (isDef ? u.range + 50 : 330);
  let best = null, bs = Infinity;
  for (const e of G.ents){
    if (e.dead || e.team === u.team) continue;
    if (e.cloak) continue;                 // 隐身中的皇家幽灵不能被索敌
    if (u.buildingsOnly){
      if (!e.isTower && !e.isBuilding) continue;
    } else {
      if (e.flying && !u.targetsAir) continue;
    }
    const edge = Math.max(0, dist(e, u) - e.radius - (u.radius || 0));   // 边到边距离
    if (u.minRange && edge < u.minRange) continue;        // 迫击炮：盲区内的目标打不到
    const d = edge;
    if (d > aggro) continue;
    const s = d + ((e.isTower || e.isBuilding) ? 70 : 0);
    if (s < bs){ bs = s; best = e; }
  }
  if (!best && !isDef) best = nearestEnemyTower(u);
  return best;
}

// 钻地建筑（电磁塔）的警戒判定：敌方单位进入 aggro 半径就返回 true。
//   aggro 由调用方传入：升起用 e.range（和玩家看到的射程圈一致），
//   保持升起用 e.range + 50（findTarget 给防御建筑留的粘性余量）。
//   半径取 e.radius 做扣减，和 findTarget 的口径保持一致。
function burrowThreat(e, aggro){
  for (const o of G.ents){
    if (o.dead || o.team === e.team) continue;
    if (o.flying && !e.targetsAir) continue;
    if (Math.max(0, dist(o, e) - o.radius) <= aggro) return true;
  }
  return false;
}

// ---------------- 攻击 ----------------
// 每种弹道的外观 / 速度。速度只影响「看上去飞得多快」，伤害仍在开火瞬间结算，
// 否则远程单位就要预判目标走位，塔的命中率会崩。
// 万箭齐发那支箭的视觉速度：起点偏移 (58, -148)，占 0.58 个 fx 生命周期（life 0.40s）
//   → 158.96 / 0.232 ≈ 685 px/s。公主的箭要和它一模一样快（见 parrow）。
const VOLLEY_ARROW_SPEED = 685;

const SHOT_DEF = {
  arrow:      { speed: 980,  color: '#fffbe6', w: 3.2 },
  // 公主的箭：和万箭齐发同速；射程 9 格（400px）→ 飞 0.58 秒，所以要把 0.17s 的通用上限放宽
  parrow:     { speed: VOLLEY_ARROW_SPEED, color: '#fffbe6', w: 3.2, maxLife: 0.62 },
  royal:      { speed: 900,  color: '#ffd85a', w: 4.2 },
  spear:      { speed: 820,  color: '#d8f0a8', w: 3.6 },
  bullet:     { speed: 1700, color: '#fff0a8', w: 3.6 },
  magic:      { speed: 760,  color: '#8fd0ff', w: 8.0 },
  flame:      { speed: 700,  color: '#ff9a3a', w: 7.5 },
  bomb:       { speed: 600,  color: '#2b2b33', w: 8.0, arc: 30 },
  cannonball: { speed: 760,  color: '#4a4a55', w: 7.0, arc: 12 },
  zap:        { speed: 3000, color: '#bfe0ff', w: 3.0 },
  dart:       { speed: 1150, color: '#c9ff8e', w: 3.0 },
  // 迫击炮弹：皇室战争里标注 300 单位 ≈ 3 格/秒。11.5 格射程要飞 3.8 秒，
  //   所以 maxLife 放到 6 秒（普通弹道被压在 0.17 秒是为了手感，迫击炮要的就是慢）
  shell:      { speed: 3 * TILE, color: '#2b2b33', w: 9.5, arc: 40, arcPerPx: 0.10, arcMax: 110, maxLife: 6 },
  // 亡灵巨人扔的骨头：中速、带一点抛物线，边飞边转
  bone:       { speed: 620, color: '#f0ece0', w: 5.5, arc: 16, maxLife: 0.5 },
  // 猎人的霰弹丸：飞得快、个头小，10 颗一起飞成扇形
  pellet:     { speed: 1400, color: '#ffe6a8', w: 2.8, maxLife: 0.30 }
};

function shotOrigin(u){
  if (u.isTower) return { x: u.x, y: u.y - u.radius * 0.35 };
  return { x: u.x, y: u.y + (u.flying ? -u.radius * 0.7 : 0) - u.radius * 0.12 };
}

// 开火：从射手飞向目标的一条弹道（纯视觉，伤害已经结算过了）
// 生成弹道特效，返回飞行时间（秒）；近战 / 没有弹道的单位返回 0。
//   伤害结算要用这个返回值 —— 现在伤害跟着弹道走，不再瞬发（见 doAttack / applyHit）。
// 猎人霰弹枪：一次打出 10 颗弹丸，呈扇形散开（弹丸本身只是视觉）；
//   实际命中数按距离衰减 —— 贴脸 10 颗全中（840），最远只剩 2~3 颗。
function fireShotgun(u, t){
  const o = shotOrigin(u);
  const d = dist(o, t);
  const ang = Math.atan2(t.y - o.y, t.x - o.x);
  const def = SHOT_DEF.pellet;
  const life = clamp(d / def.speed, 0.05, def.maxLife || 0.30);
  const reach = Math.min(u.projRange || (d + 40), d + 60);
  for (let i = 0; i < u.pellets; i++){
    const a = ang + ((i / (u.pellets - 1)) - 0.5) * 0.62 + (Math.random() - 0.5) * 0.06;
    G.fx.push({ type:'shot', kind:'pellet', x0:o.x, y0:o.y,
                x1: o.x + Math.cos(a) * reach, y1: o.y + Math.sin(a) * reach,
                t:0, life, color: def.color, w: def.w, arc: 0, seed: Math.random() * 6.283 });
  }
  const tiles = d / TILE;
  const hits = clamp(Math.round(u.pellets * (1 - (tiles - 1.2) / 5.3)), 2, u.pellets);
  G.pending.push({ t: life, shotgun: { u, target: t, dmg: hits * u.dmg } });
}

function spawnShot(u, t){
  const kind = u.shot;
  if (!kind) return 0;
  const def = SHOT_DEF[kind];
  if (!def) return 0;
  const o = shotOrigin(u);
  const d = dist(o, t);
  const life = clamp(d / def.speed, 0.045, def.maxLife || 0.17);
  G.fx.push({
    type:'shot', kind, x0: o.x, y0: o.y, x1: t.x, y1: t.y,
    t: 0, life,
    color: def.color, w: def.w,
    arc: def.arc ? Math.min(def.arcMax || def.arc, def.arc + d * (def.arcPerPx || 0)) : 0,
    seed: Math.random() * 6.283
  });
  return life;
}

function doAttack(u, t){
  // 皇家幽灵：一出手就显形，2 秒不再出手就重新隐身
  if (u.cloak){ u.cloak = false; u.visibleT = 2; }
  // 野猪骑士 / 迷你皮卡 / 皮卡超人 / 瓦基里武神 / 飞龙宝宝每一锤都有专属音效（远程单位在下面统一生成弹道特效）
  if (u.cardId === 'battleHealer') sfxHealerAtk();
  else if (u.cardId === 'dartGoblin') sfxDartAtk();
  else if (u.cardId === 'knight') sfxKnightAtk();
  else if (u.cardId === 'royalGhost'){
    if (!u.atkSounded){ u.atkSounded = true; sfxGhostVo(); }   // 第一次出手（带人声）
    else sfxGhostAtk();                                        // 之后每一刀
  }
  else if (u.cardId === 'fisherman') sfxFisherAtk();
  else if (u.cardId === 'bandit'){
    if (!u.atkSounded){ u.atkSounded = true; sfxBanditVo(); }   // 第一次出手
    else sfxBanditHit();                                        // 之后的每一刀
  }
  else if (u.cardId === 'giant') sfxGiantAtk();
  else if (u.cardId === 'hogRider') sfxHogAtk();
  else if (u.cardId === 'miniPekka') sfxMiniPekkaAtk();
  else if (u.cardId === 'pekka') sfxPekkaAtk();
  else if (u.cardId === 'valkyrie') sfxValkyrieAtk();
  else if (u.cardId === 'babyDragon') sfxBabyDragonAtk();
  else if (u.cardId === 'wizard') sfxWizardAtk();
  if (u.pellets > 1){ fireShotgun(u, t); return; }   // 猎人：走霰弹
  const life = spawnShot(u, t);
  // 有弹道的远程单位：伤害等箭/子弹飞到了再结算（不再瞬发）
  //   —— 飞行途中目标死了也照样落在原处（溅射仍然炸），但单体伤害会落空，和皇室战争一致。
  if (life > 0.055){
    G.pending.push({ t: life, shotHit: { u, target: t, x: t.x, y: t.y } });
    return;
  }
  applyHit(u, t, { x: t.x, y: t.y });
}

// 真正结算一次攻击：近战直接调，远程由 G.pending 里的 shotHit 到点后调。
//   at 是「打空时的落点」（目标已经死了 / 已经跑开时用它做溅射中心）。
function applyHit(u, t, at){
  // 战斗天使：每次出手都给周围友军回血（打没打到人都算，和皇室战争一致）
  if (u.healOnHit) healAround(u, u.healOnHit, u.healRadius);
  const hit = e => {
    let amt = (e && e.isTower && u.towerDmg != null) ? u.towerDmg : u.dmg;
    if (u.chargeDmg && u.charged){          // 野蛮人攻城锤冲刺撞上去的那一下
      amt = u.chargeDmg;
      G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 8, r1: 46, t:0, life:0.32, color:'#ffcf6a' });
    }
    if (u.dashBonus){                       // 幻影刺客突袭落地的那一下
      amt = u.dashBonus; u.dashBonus = 0;
      G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: 38, t:0, life:0.30, color:'#ff9ad0' });
    }
    damage(e, amt, u);
  };
  const chill = e => { if (u.slowOnHit > 0 && e && !e.isTower && !e.isBuilding) applySlow(e, u.slowOnHit); };
  const alive = t && !t.dead;
  if (u.spin){
    // 瓦基里武神：360° 旋斩 —— 以自己为圆心打一圈，不再只结算主目标
    G.fx.push({ type:'ring', x:u.x, y:u.y, r0: 8, r1: u.range + 20, t:0, life:0.26, color:'#ffd9a8' });
    G.fx.push({ type:'ring', x:u.x, y:u.y, r0: 4, r1: u.range + 4,  t:0, life:0.18, color:'#ffffff' });
    for (const e of G.ents){
      if (e.dead || e.team === u.team) continue;
      if (u.buildingsOnly && !e.isTower && !e.isBuilding) continue;
      if (e.flying && !u.targetsAir) continue;
      if (dist(u, e) > u.range + e.radius) continue;   // 和她一样用「射程 + 目标半径」
      hit(e); chill(e);
    }
    return;
  }
  // 追踪弹道：炸在目标当前的位置；迫击炮这种不追踪的：炸在开炮时瞄的那个点（at），目标跑了就打空
  const cx = (alive && !u.shotNoHome) ? t.x : at.x;
  const cy = (alive && !u.shotNoHome) ? t.y : at.y;
  if (u.splash > 0){
    G.fx.push({ type:'ring', x:cx, y:cy, r0: 6, r1: u.splash, t:0, life:0.28, color:'#ffe07a' });
    for (const e of G.ents){
      if (e.dead || e.team === u.team) continue;
      if (u.buildingsOnly && !e.isTower && !e.isBuilding) continue;
      if (e.flying && !u.targetsAir) continue;
      if (dist(e, { x:cx, y:cy }) <= u.splash + e.radius * 0.7){ hit(e); chill(e); }
    }
  } else if (alive){
    hit(t); chill(t);
    G.fx.push({ type:'spark', x:t.x, y:t.y, t:0, life:0.2 });
    if (u.breaksOnHit) kill(u);            // 攻城锤撞上建筑就散架 → 掉出 2 个野蛮人
  }
  // 黑暗王子：冲刺那一下打完就清零，要重新助跑 3.5 格才能再冲
  if (u.chargeDmg && u.charged && !u.breaksOnHit){ u.charged = false; u.chargeMoved = 0; }
}

// 自爆单位（烈焰精灵）：在自身位置炸开一圈范围伤害，然后消失。
//   不走 kill()，因为那会再叠一层爆炸特效，看起来像炸了两次。
function explodeUnit(e){
  const r = e.blast || 60;
  const icy = !!e.freeze, healy = !!e.healAmt, zappy = !!e.chainMax;
  // 注意：e.stun 是「这个单位当前被眩晕的剩余秒数」，不是卡牌上的眩晕值，
  // 所以「命中附加眩晕」必须从卡牌数据里取
  const stunAmt = (CARDS[e.cardId] && CARDS[e.cardId].stun) || 0;

  // —— 爆炸外观：四种精灵各一套配色 ——
  if (icy){
    // 冰雪：冷白核心 + 冰蓝双圈
    G.fx.push({ type:'spell', x:e.x, y:e.y, r: r * 0.95, a: 0.85, t:0, life:0.32, color:'#7fd4ff',
                core:'#f2fdff', edge:'rgba(110,205,255,0)' });
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 8, r1: r * 1.15, t:0, life:0.42, color:'#d8f4ff' });
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 4, r1: r * 0.80, t:0, life:0.26, color:'#ffffff' });
  } else if (healy){
    // 治疗：柔和绿光 + 飘「+400」
    G.fx.push({ type:'spell', x:e.x, y:e.y, r: r * 0.95, a: 0.60, t:0, life:0.34, color:'#4fdc86',
                core:'#f0fff6', edge:'rgba(60,200,120,0)' });
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 10, r1: r * 1.20, t:0, life:0.50, color:'#8ef0b0' });
    G.fx.push({ type:'banner', x:e.x, y:e.y - 34, t:0, life:0.95,
                text:'+' + e.healAmt, color:'#9dffc4' });
  } else if (zappy){
    // 雷电：金色冲击圈，电弧本体在下面按目标逐个画
    G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: r * 0.95, t:0, life:0.32, color:'#fff3a8' });
    G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 3, r1: r * 0.60, t:0, life:0.20, color:'#ffffff' });
  } else {
    // 烈焰：白热核心 + 橙色外焰 + 双圈冲击波
    G.fx.push({ type:'spell', x:e.x, y:e.y, r: r * 0.95, a: 0.85, t:0, life:0.30, color:'#ff8a3a' });
    G.fx.push({ type:'boom',  x:e.x, y:e.y, r: r * 1.9,  t:0, life:0.45, color:'#ff9a3a' });
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 8, r1: r * 1.15, t:0, life:0.38, color:'#ffd27a' });
    G.fx.push({ type:'ring',  x:e.x, y:e.y, r0: 4, r1: r * 0.80, t:0, life:0.24, color:'#ffffff' });
  }

  // —— 伤害 ——
  if (zappy){
    // 雷电精灵：从自己出发，按距离由近到远连锁，最多 chainMax 个目标。
    //   **不是一次性全部结算**：每一跳间隔 chainGap（0.25s），电弧一段一段打出去，
    //   伤害和眩晕都在那一段电弧到达时才结算（见 update() 里的 G.pending 处理）。
    //   这样能明显看出「链」在跳，而不是所有目标同时掉血。
    const hits = G.ents
      .filter(o => !o.dead && o.team !== e.team &&
                   (!o.flying || e.targetsAir) &&
                   dist(o, e) <= r + o.radius * 0.7)
      .sort((a, b) => dist(a, e) - dist(b, e))
      .slice(0, e.chainMax);
    const gap = (CARDS[e.cardId] && CARDS[e.cardId].chainGap) || 0.25;
    let prev = e;
    hits.forEach((o, i) => {
      // from 存**实体引用**（不是坐标）：电弧从上一跳目标的当前位置拉过来，
      // 目标在连锁途中走动时电弧也跟着走，不会指向它原来的站位
      G.pending.push({ t: i * gap, chain: true, from: prev, target: o,
                       dmg: e.dmg, stun: stunAmt, src: e });
      prev = o;
    });
  } else {
    for (const o of G.ents){
      if (o.dead || o.team === e.team) continue;
      if (o.flying && !e.targetsAir) continue;
      if (dist(o, e) > r + o.radius * 0.7) continue;
      damage(o, e.dmg, e);
      // 冰雪精灵：命中的目标一起冻住
      if (icy) applyStun(o, e.freeze);
    }
  }

  // —— 治疗精灵：范围内友军（不含塔）挂 1 秒匀速回血 ——
  if (healy){
    for (const o of G.ents){
      if (o.dead || o.team !== e.team || o.isTower) continue;
      if (dist(o, e) > r + o.radius * 0.7) continue;
      o.healRate = e.healAmt / (e.healDur || 1);
      o.healT = Math.max(o.healT || 0, e.healDur || 1);
    }
  }

  if (e.cardId === 'wallBreakers') sfxWallBoom();
  else if (icy) sfxFreeze(); else if (healy) sfxHeal(); else if (zappy) sfxZap(); else sfxBoom();
  e.hp = 0;
  // 骷髅气球这类「炸开之后还要走亡语」的单位：交给 kill() 统一结算
  //   （163 范围伤害 + 掉 7 个骷髅）。其它自爆单位没有亡语，保持原来的直接消失。
  const ec = e.cardId ? CARDS[e.cardId] : null;
  if (ec && (ec.deathBlast || ec.deathSpawn)){ e.selfDestruct = true; kill(e); return; }
  e.dead = true;
}

// ---------------- 移动 ----------------
function sideOf(y){ return y < RIVER_MID ? 'top' : 'bottom'; }

function firstWaypoint(u, t){
  if (u.flying) return t;
  if (u.jumpRiver) return t;               // 野猪骑士不绕桥，直线走，到河边起跳
  if (sideOf(u.y) === sideOf(t.y)) return t;
  // 有固定进攻路就直接走那条桥。召唤单位必须这样 —— 否则两个同点出生的兵
  // 被互相挤开 ±14px 后，「最近的桥」会各自判成左右两路，看起来就是「分路」。
  if (u.lane != null) return { x: BRIDGE[u.lane].x, y: RIVER_MID };
  let b = BRIDGE[0], bd = Math.abs(u.x - b.x);
  for (const br of BRIDGE){
    const d = Math.abs(u.x - br.x);
    if (d < bd){ bd = d; b = br; }
  }
  return { x: b.x, y: RIVER_MID };
}

// 野猪骑士跳河：走进河道带就起跳，落点锁定在河对岸
function tryJump(e, ang){
  if (!e.jumpRiver || e.jump > 0) return false;
  if (e.y < RIVER_TOP - 8 || e.y > RIVER_BOT + 8) return false;
  const sy = Math.sin(ang);
  if (Math.abs(sy) < 0.12) return false;                       // 几乎横向走，不触发
  const dy = sy > 0 ? (RIVER_BOT + 8 - e.y) : (RIVER_TOP - 8 - e.y);
  const len = dy / sy;                                          // 沿 ang 方向要走的路程
  e.jump      = JUMP_TIME;
  e.jumpT     = JUMP_TIME;
  e.jumpFromX = e.x;
  e.jumpFromY = e.y;
  e.jumpToX   = clamp(e.x + Math.cos(ang) * len, e.radius + 4, AW - e.radius - 4);
  e.jumpToY   = e.y + dy;
  e.jumpAng   = ang;
  G.fx.push({ type:'ring', x:e.x, y:e.y, r0: 6, r1: 40, t:0, life:0.35, color:'#ffe07a' });
  sfxJump();
  return true;
}

// ---------------- 圣水倍率 ----------------
// 常规时间：前 2 分钟 1 倍 → 最后 1 分钟 2 倍
// 加时赛  ：前 1 分钟 2 倍（延续）→ 最后 1 分钟 3 倍
function elixirMult(){
  if (G.phase === 'overtime') return G.timeLeft <= 60 ? 3 : 2;
  return G.timeLeft <= 60 ? 2 : 1;
}

// ---------------- 更新 ----------------
function update(dt){
  G.t += dt;

  // 计时
  G.timeLeft -= dt;
  if (G.timeLeft <= 0){
    if (G.phase === 'regular'){
      if (G.player.crowns !== G.ai.crowns){
        finish(G.player.crowns > G.ai.crowns ? 'win' : 'lose');
        return;
      }
      G.phase = 'overtime';
      G.timeLeft = 120;
      toast('加时赛！');
      BGM.play('sudden');
      beep(660,0.2,'triangle',0.06);
    } else if (G.phase === 'overtime'){
      finish('draw');
      return;
    }
  }

  // 圣水（阶梯加速）
  const mult = elixirMult();
  if (mult !== G.mult){
    if (G.mult > 0 && mult === 2) toast('双倍圣水！');
    else if (G.mult > 0 && mult === 3) toast('三倍圣水！');
    G.mult = mult;
  }
  const rate = mult / 2.8;          // 基础：2.8 秒 1 点
  G.player.elixir = Math.min(10, G.player.elixir + rate * dt);
  G.ai.elixir = Math.min(10, G.ai.elixir + rate * dt);

  // AI
  aiUpdate(dt);

  // 分波法术：到点就落下一波（万箭齐发）
  if (G.pending.length){
    for (const q of G.pending) q.t -= dt;
    const due = G.pending.filter(q => q.t <= 0);
    if (due.length){
      G.pending = G.pending.filter(q => q.t > 0);
      for (const q of due){
        if (q.shotHit){
          // 远程弹道飞到了：这一刻才结算伤害
          const h = q.shotHit;
          applyHit(h.u, h.target, { x: h.x, y: h.y });
          continue;
        }
        if (q.shotgun){
          // 猎人的霰弹飞到了：按命中颗数一次性结算
          const sh = q.shotgun;
          if (sh.target && !sh.target.dead){
            damage(sh.target, sh.dmg, sh.u);
            G.fx.push({ type:'spark', x: sh.target.x, y: sh.target.y, t:0, life:0.22 });
          }
          continue;
        }
        if (q.burrow){
          // 掘地矿工钻到地方了：原地冒头（0.15 秒）+ 一圈土花
          const b = q.burrow;
          const u = spawnUnit(b.cardId, b.team, b.x, b.y, b.x < AW / 2 ? 0 : 1, { deploy: 0.15 });
          G.fx.push({ type:'ring', x:b.x, y:b.y, r0: 6, r1: 46, t:0, life:0.36, color:'#d8b878' });
          G.fx.push({ type:'boom', x:b.x, y:b.y, r: 26, t:0, life:0.30, color:'#a8813f' });
          sfxDeploy();
          continue;
        }
        if (q.summonUnit){
          // 召唤型建筑排队的后续兵（骷髅墓碑一次 2 个，第二个晚 0.35 秒）
          summonAt(q.cardId, q.team, q.x, q.y, q.lane);
        }
        else if (q.summon){
          // 哥布林飞桶落地：砸开 + 召唤 3 个哥布林（三角形，一个尖朝敌方）
          const sc = q.card;
          const n = sc.spawnCount || 3;
          const fwd = q.team === 'ai' ? 1 : -1;
          for (let i = 0; i < n; i++){
            const a = (i / n) * Math.PI * 2 - Math.PI / 2 * fwd;
            // 桶里蹦出来的哥布林：几乎立刻开咬（0.3 秒蓄力），不再吃「落地 1 秒 + 蓄力 0.7 秒」
            summonAt(sc.spawnTroops, q.team, q.x + Math.cos(a) * 26, q.y + Math.sin(a) * 26,
                     q.x < AW / 2 ? 0 : 1, { deploy: SUMMON_DEPLOY, firstHit: 0.30 });
          }
          G.fx.push({ type:'boom', x:q.x, y:q.y, r: 44, t:0, life:0.32, color:'#b7e08a' });
          G.fx.push({ type:'ring', x:q.x, y:q.y, r0: 8, r1: 52, t:0, life:0.36, color:'#dff0b8' });
          sfxBarrelBoom();
        }
        else if (q.chain){
          // 雷电精灵连锁的一跳：电弧到达时才结算伤害与眩晕
          const o = q.target;
          if (o && !o.dead){                       // 到达前目标已经死了 → 这一跳跳过
            const x0 = q.from ? q.from.x : o.x, y0 = q.from ? q.from.y : o.y;
            G.fx.push({ type:'shot', kind:'zap', x0, y0, x1: o.x, y1: o.y, t:0,
                        life: 0.14, color:'#bfe0ff', w: 2.6, arc: 0, seed: Math.random() * 6.283 });
            damage(o, q.dmg, q.src);
            if (q.stun) applyStun(o, q.stun);
          }
        }
        else if (q.bolt) strikeBolt(q.card, q.target, q.sx, q.sy, true);
        else {
          // 火球落地那一下放爆炸音（出手音已在施法时放过，只取它的嗖声段）
          if (q.id === 'fireball' && q.i === 0) sfxFireballBoom();
          spellVolley(q.card, q.team, q.x, q.y, q.i);
        }
      }
    }
  }

  // 地面区域（狂暴 / 藤蔓）
  if (G.zones && G.zones.length){
    for (const z of G.zones){
      z.t -= dt;
      if (z.kind === 'tornado'){
        // 每帧把圈里的**敌方**单位往中心拽（空中地面都拽，己方不受影响），同时按 0.2 秒结算伤害
        const pull = 460 * dt;
        for (const e of G.ents){
          if (e.dead || e.team === z.team || e.isTower || e.isBuilding || e.hidden) continue;
          const d = dist(e, z);
          if (d > z.r + e.radius * 0.6 || d < 14) continue;
          const k = pull * (0.35 + 0.65 * (1 - d / z.r));    // 越靠外卷得越猛
          e.x += (z.x - e.x) / d * k;
          e.y += (z.y - e.y) / d * k;
        }
        z.tick -= dt;
        if (z.tick <= 0){
          z.tick += 0.2;
          for (const e of G.ents){
            if (e.dead || e.team === z.team || e.hidden) continue;
            if (dist(e, z) > z.r + e.radius * 0.6) continue;
            damage(e, (e.isTower ? z.towerDps : z.dps) * 0.2, null, true);
          }
        }
        continue;
      }
      if (z.kind === 'poison'){
        // 毒药：每 0.5 秒跳一次伤害（空中地面都吃），并刷新 15% 减速
        z.tick -= dt;
        if (z.tick <= 0){
          z.tick += 0.5;
          for (const e of G.ents){
            if (e.dead || e.team === z.team || e.hidden) continue;
            if (dist(e, z) > z.r + e.radius * 0.6) continue;
            damage(e, (e.isTower ? z.towerDps : z.dps) * 0.5, null, true);
            if (!e.isTower) e.poisonT = Math.max(e.poisonT || 0, 0.6);
          }
        }
        continue;
      }
      if (z.kind === 'quake'){
        // 地震：每 0.2 秒结算一次；只打地面，建筑吃 283/秒，皇家塔 49/秒，地面兵 81/秒并减速
        z.tick -= dt;
        if (z.tick <= 0){
          z.tick += 0.2;
          for (const e of G.ents){
            if (e.dead || e.team === z.team || e.hidden || e.flying) continue;
            if (dist(e, z) > z.r + e.radius * 0.6) continue;
            const rate = e.isTower ? z.towerDps : (e.isBuilding ? z.buildingDps : z.dps);
            damage(e, rate * 0.2, null, true);
            if (!e.isTower) e.quakeT = Math.max(e.quakeT || 0, 0.3);
          }
        }
        continue;
      }
      if (z.kind === 'vines'){
        // 藤蔓：每 0.2 秒结算一次持续伤害；最多同时缠住 max 个（先近后远）
        //   一旦缠住就「粘」到区域结束 —— 否则每帧按距离重排，被缠的兵会一会儿松开一会儿又被抓住
        z.tick -= dt;
        if (z.tick <= 0){
          z.tick += 0.2;
          const hit = [];
          for (const e of G.ents){
            if (e.dead || e.team === z.team || e.hidden) continue;
            if (dist(e, z) > z.r + e.radius * 0.6) continue;
            hit.push(e);
          }
          for (const e of hit)
            damage(e, (e.isTower ? z.towerDps : z.dps) * 0.2, null, true);
          // 已缠住的：还在圈里就继续缠
          z.rooted = (z.rooted || []).filter(id => {
            const u = G.ents.find(o => o.id === id);
            return u && !u.dead && dist(u, z) <= z.r + u.radius * 0.6;
          });
          hit.sort((a, b) => dist(a, z) - dist(b, z));
          for (const e of hit){
            if (e.isTower || z.rooted.length >= z.max) continue;
            if (!z.rooted.includes(e.id)) z.rooted.push(e.id);
          }
          for (const id of z.rooted){
            const u = G.ents.find(o => o.id === id);
            if (u) applyRoot(u, 0.26);
          }
        }
        continue;
      }
      // 狂暴区域：区域内的己方单位持续获得增益（离开区域 0.12 秒后失效）
      for (const e of G.ents){
        if (e.dead || e.team !== z.team || e.isTower) continue;
        if (dist(e, z) > z.r + e.radius * 0.6) continue;
        e.rageT = Math.max(e.rageT || 0, 0.12);
      }
    }
    G.zones = G.zones.filter(z => z.t > 0);
