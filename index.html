      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, Math.PI*2); ctx.fill();
    } else {
      // 火球：拖尾 → 外焰 → 白核
      const tx = x - ux * 84, ty = y - uy * 84;
      const tg = ctx.createLinearGradient(tx, ty, x, y);
      tg.addColorStop(0, 'rgba(255,120,40,0)');
      tg.addColorStop(0.55, 'rgba(255,150,60,0.42)');
      tg.addColorStop(1, 'rgba(255,220,140,0.85)');
      ctx.strokeStyle = tg; ctx.lineWidth = 13; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();

      const gr = 27 + Math.sin(k * 46) * 2.5;     // 轻微脉动，别像颗死球
      const gg = ctx.createRadialGradient(x, y, 0, x, y, gr);
      gg.addColorStop(0, 'rgba(255,255,235,1)');
      gg.addColorStop(0.3, 'rgba(255,196,90,0.95)');
      gg.addColorStop(0.62, 'rgba(240,110,40,0.62)');
      gg.addColorStop(1, 'rgba(200,60,10,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#fffdf2';
      ctx.beginPath(); ctx.arc(x, y, 7.5, 0, Math.PI*2); ctx.fill();
    }
  } else if (f.type === 'shot'){
    // 远程单位的弹道：从射手飞向目标，最后 12% 补一圈命中闪光
    const p = clamp(k, 0, 1);
    const x = f.x0 + (f.x1 - f.x0) * p;
    const y = f.y0 + (f.y1 - f.y0) * p - (f.arc ? Math.sin(Math.PI * p) * f.arc : 0);
    const ang = Math.atan2(f.y1 - f.y0, f.x1 - f.x0);
    const ux = Math.cos(ang), uy = Math.sin(ang);
    ctx.lineCap = 'round';

    // 出手闪光：射手脚下一小簇火光，一眼能看出是谁开的火
    if (k < 0.22){
      const a = 1 - k / 0.22;
      const mg = ctx.createRadialGradient(f.x0, f.y0, 0, f.x0, f.y0, 15);
      mg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a) + ')');
      mg.addColorStop(0.4, f.kind === 'zap' ? 'rgba(190,225,255,' + (0.7 * a) + ')' : 'rgba(255,226,150,' + (0.68 * a) + ')');
      mg.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(f.x0, f.y0, 15, 0, 7); ctx.fill();
    }

    if (f.kind === 'zap'){
      // 电磁塔：整条电弧一次画完，闪一下就没
      ctx.globalAlpha = 1 - k * 0.55;
      const N = 7;
      for (const [lw, col] of [[14, 'rgba(120,180,255,0.22)'], [7, 'rgba(150,200,255,0.45)'], [3.6, 'rgba(215,238,255,0.95)'], [1.8, '#ffffff']]){
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(f.x0, f.y0);
        for (let i = 1; i <= N; i++){
          const q = i / N;
          const jx = (i === N) ? 0 : Math.sin(f.seed + i * 3.1) * 16 * (1 - q * 0.35);
          const jy = (i === N) ? 0 : Math.cos(f.seed + i * 2.3) * 16 * (1 - q * 0.35);
          ctx.lineTo(f.x0 + (f.x1 - f.x0) * q + jx, f.y0 + (f.y1 - f.y0) * q + jy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (f.kind === 'bomb' || f.kind === 'cannonball' || f.kind === 'shell'){
      // 炮弹 / 炸弹：深色实心球 + 尾烟 + 暖色高光
      for (let i = 3; i >= 1; i--){
        ctx.globalAlpha = (1 - k) * (0.30 - i * 0.07);
        ctx.fillStyle = '#e6e6e6';
        ctx.beginPath(); ctx.arc(x - ux * i * 13, y - uy * i * 13, 5 + i * 1.6, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.shadowColor = (f.kind === 'bomb' || f.kind === 'shell') ? 'rgba(255,140,60,0.85)' : 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(x, y, f.w, 0, 7);
      ctx.fillStyle = f.color; ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.8; ctx.stroke();
      // 左上高光，读起来像一颗球而不是一个点
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(x - f.w * 0.32, y - f.w * 0.34, f.w * 0.28, 0, 7); ctx.fill();
      if (f.kind === 'bomb' || f.kind === 'shell'){   // 引信火花
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath();
        ctx.arc(x + ux * 5, y + uy * 5 - 5, 3.2 + Math.sin(k * 40) * 1.1, 0, 7);
        ctx.fill();
      }
    } else if (f.kind === 'pellet'){
      // 猎人的霰弹丸：小亮点 + 短拖尾
      ctx.globalAlpha = 1 - k * 0.45;
      ctx.strokeStyle = 'rgba(255,225,160,0.42)';
      ctx.lineWidth = f.w * 0.9;
      ctx.beginPath(); ctx.moveTo(x - ux * 11, y - uy * 11); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(x, y, f.w * 0.85, 0, 7); ctx.fill();
    } else if (f.kind === 'bone'){
      // 亡灵巨人：扔出去一根骨头，边飞边转（两端各两个骨节，一眼看得出是骨头）
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((f.seed || 0) + k * 16);
      const L = 7.5, W = 3.2;
      ctx.fillStyle = f.color;
      ctx.strokeStyle = 'rgba(120,110,90,0.55)';
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.rect(-L, -W / 2, L * 2, W); ctx.fill(); ctx.stroke();
      for (const sx of [-L, L]) for (const sy of [-1, 1]){
        ctx.beginPath(); ctx.arc(sx, sy * W * 0.8, W * 0.95, 0, 7);
        ctx.fill(); ctx.stroke();
      }
      // 一点残影，速度感
      ctx.globalAlpha = 0.25 * (1 - k);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(-ux * 16, -uy * 16, 6, 3, Math.atan2(uy, ux), 0, 7); ctx.fill();
      ctx.restore();
    } else if (f.kind === 'magic'){
      // 法师：能量球 + 拖尾
      const tx = x - ux * 62, ty = y - uy * 62;
      const tg = ctx.createLinearGradient(tx, ty, x, y);
      tg.addColorStop(0, 'rgba(90,168,224,0)');
      tg.addColorStop(0.55, 'rgba(130,195,255,0.45)');
      tg.addColorStop(1, 'rgba(185,228,255,0.9)');
      ctx.strokeStyle = tg; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
      const gr = 18 + Math.sin(k * 40) * 2;
      const gg = ctx.createRadialGradient(x, y, 0, x, y, gr);
      gg.addColorStop(0, '#ffffff');
      gg.addColorStop(0.30, 'rgba(170,220,255,0.98)');
      gg.addColorStop(0.62, 'rgba(90,168,240,0.55)');
      gg.addColorStop(1, 'rgba(60,130,220,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, 7); ctx.fill();
    } else if (f.kind === 'flame'){
      // 飞龙宝宝：小火球 + 一路掉火星
      // 尾巴：四团渐隐的余焰，越靠后越小越淡
      for (let i = 4; i >= 1; i--){
        const q = i / 4.4;
        const px = x - ux * i * 10, py = y - uy * i * 10;
        const rr = f.w * (1.05 - q * 0.46) + Math.sin(k * 34 + i * 1.7) * 1.3;
        const tg2 = ctx.createRadialGradient(px, py, 0, px, py, rr);
        tg2.addColorStop(0, 'rgba(255,228,145,' + (0.80 - q * 0.24).toFixed(2) + ')');
        tg2.addColorStop(0.5, 'rgba(255,142,38,' + (0.50 - q * 0.16).toFixed(2) + ')');
        tg2.addColorStop(1, 'rgba(210,60,0,0)');
        ctx.fillStyle = tg2;
        ctx.beginPath(); ctx.arc(px, py, rr, 0, 7); ctx.fill();
      }
      // 火球本体：白热芯 → 亮黄 → 橙红 → 透明，尺寸轻微跳动
      const R = f.w * (1.05 + Math.sin(k * 28) * 0.06) * 1.85;
      const fg = ctx.createRadialGradient(x - ux * R * 0.18, y - uy * R * 0.18, 0, x, y, R);
      fg.addColorStop(0, '#fffdf0');
      fg.addColorStop(0.26, '#ffe680');
      fg.addColorStop(0.55, 'rgba(255,150,40,0.96)');
      fg.addColorStop(0.82, 'rgba(226,72,12,0.55)');
      fg.addColorStop(1, 'rgba(200,50,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
      // 白热芯：让火球有"烧"的实心感，而不是一团雾
      ctx.fillStyle = 'rgba(255,255,236,0.92)';
      ctx.beginPath(); ctx.arc(x - ux * 2.5, y - uy * 2.5, R * 0.28, 0, 7); ctx.fill();
      // 两颗随机的余烬，让它看起来在烧
      ctx.fillStyle = 'rgba(255,206,110,0.95)';
      for (let i = 0; i < 2; i++){
        const a = f.seed + k * 22 + i * 3.1;
        const ex = x - ux * 22 + Math.cos(a) * 8;
        const ey = y - uy * 22 + Math.sin(a) * 8;
        ctx.beginPath(); ctx.arc(ex, ey, 1.8 + (i ? 0.7 : 0), 0, 7); ctx.fill();
      }
    } else {
      // 箭 / 长矛 / 弩箭 / 子弹：光晕拖尾 → 深色描边 → 亮色主体 → 箭头
      const isBullet = f.kind === 'bullet', isSpear = f.kind === 'spear', isRoyal = f.kind === 'royal';
      const isDart = f.kind === 'dart';
      const L  = isBullet ? 20 : (isSpear ? 34 : (isDart ? 23 : 27));
      const hl = isRoyal ? 12 : (isDart ? 7 : 9);                        // 箭头长度
      const hw = isRoyal ? 7.5 : (isSpear ? 4.4 : (isDart ? 3.4 : 5.4));  // 箭头半宽
      const dark = isBullet ? 'rgba(70,45,10,0.45)' : 'rgba(22,38,16,0.55)';

      // 1) 光晕 + 渐隐拖尾：草地背景上细线容易被吃掉，靠这层把弹道"点"出来
      ctx.save();
      ctx.shadowColor = f.color; ctx.shadowBlur = isBullet ? 12 : 9;
      const tg = ctx.createLinearGradient(x - ux * L * 2.1, y - uy * L * 2.1, x, y);
      tg.addColorStop(0, 'rgba(255,255,255,0)');
      tg.addColorStop(0.6, f.color);
      tg.addColorStop(1, f.color);
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = tg; ctx.lineWidth = f.w * 1.5;
      ctx.beginPath(); ctx.moveTo(x - ux * L * 2.1, y - uy * L * 2.1); ctx.lineTo(x, y); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;

      // 2) 深色描边 + 3) 亮色主体
      for (const [lw, col] of [[f.w + 2.6, dark], [f.w, f.color]]){
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(x - ux * L, y - uy * L); ctx.lineTo(x, y); ctx.stroke();
        if (!isBullet){
          ctx.beginPath();
          ctx.moveTo(x - ux * hl - uy * hw, y - uy * hl + ux * hw);
          ctx.lineTo(x, y);
          ctx.lineTo(x - ux * hl + uy * hw, y - uy * hl - ux * hw);
          ctx.stroke();
        }
      }
      // 4) 尾羽（箭）/ 枪尖光点（子弹）
      if (isBullet){
        ctx.fillStyle = '#fffdf0';
        ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.55; ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(x - ux * 9, y - uy * 9, 2.6, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (isRoyal){
        ctx.fillStyle = '#fffdf0';
        ctx.beginPath(); ctx.arc(x, y, 3.6, 0, 7); ctx.fill();
      } else if (!isSpear){
        // 箭尾两片羽
        ctx.strokeStyle = f.color; ctx.lineWidth = 2.4;
        for (const s of [1, -1]){
          ctx.beginPath();
          ctx.moveTo(x - ux * L, y - uy * L);
          ctx.lineTo(x - ux * (L - 7) - uy * 5 * s, y - uy * (L - 7) + ux * 5 * s);
          ctx.stroke();
        }
      }
    }

    if (p > 0.88){
      const a = (p - 0.88) / 0.12;
      ctx.globalAlpha = (1 - a) * 0.8;
      ctx.fillStyle = f.kind === 'zap' ? 'rgba(205,232,255,0.95)' : 'rgba(255,242,200,0.95)';
      ctx.beginPath(); ctx.arc(f.x1, f.y1, 7 + a * 13, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (f.type === 'banner'){
    // 飘字：快速淡入 → 停留 → 淡出上浮
    let a = 1;
    if (k < 0.15) a = k / 0.15;
    else if (k > 0.6) a = 1 - (k - 0.6) / 0.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.72)';
    const ty = f.y - 26 * k;
    ctx.strokeText(f.text, f.x, ty);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, ty);
  }
  ctx.restore();
}

// ---------------- UI ----------------
const handEl = document.getElementById('hand');
const nextEl = document.getElementById('nextCard');
const elixirFill = document.getElementById('elixirFill');
const elixirBar = document.getElementById('elixirBar');
const elixirNum = document.getElementById('elixirNum');
const elixirMultEl = document.getElementById('elixirMult');
const timerEl = document.getElementById('timer');
const toastEl = document.getElementById('toast');
const cdWrap = document.getElementById('countdown');
const cdNumEl = document.getElementById('cdNum');
const cdCapEl = document.getElementById('cdCap');
let lastCdShown = null;          // 上一帧显示的数字，变了才重放动画 / 响一声
let handSig = '';

function refreshHand(){
  const sig = G.player.hand.join(',');
  if (sig !== handSig){
    handSig = sig;
    handEl.innerHTML = G.player.hand.map((id, i) => {
      const c = CARDS[id];
      return '<div class="card" data-i="' + i + '" style="--c1:' + c.c1 + ';--c2:' + c.c2 + '">' +
        '<div class="cost">' + c.cost + '</div>' +
        '<div class="art">' + c.glyph + '</div>' +
        '<div class="nm">' + c.name + '</div>' +
      '</div>';
    }).join('');
    for (const el of handEl.children){
      el.addEventListener('pointerdown', ev => startDrag(parseInt(el.dataset.i, 10), ev));
    }
    const nc = CARDS[G.player.next];
    if (nc){
      nextEl.innerHTML = '<div class="cost">' + nc.cost + '</div>' + nc.glyph;
      nextEl.style.background = 'linear-gradient(160deg,' + nc.c1 + ',' + nc.c2 + ')';
    }
  }
  const kids = handEl.children;
  for (let i = 0; i < kids.length; i++){
    const c = CARDS[G.player.hand[i]];
    kids[i].classList.toggle('off', G.player.elixir < c.cost);
    kids[i].classList.toggle('sel', G.selected === i);
  }
  const pct = G.player.elixir / 10 * 100;
  elixirFill.style.width = pct + '%';
  elixirBar.classList.toggle('full', G.player.elixir >= 10);
  elixirNum.textContent = Math.floor(G.player.elixir);

  // 圣水倍率徽章
  const mult = elixirMult();
  elixirMultEl.textContent = mult > 1 ? '×' + mult + ' 圣水' : '';
  elixirMultEl.className = 'elixirMult' + (mult > 1 ? ' on m' + mult : '');
  elixirBar.classList.toggle('m2', mult === 2);
  elixirBar.classList.toggle('m3', mult === 3);

  const t = Math.max(0, Math.ceil(G.timeLeft));
  timerEl.textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  timerEl.classList.toggle('hot', G.timeLeft <= 60);

  // 最后 10 秒：屏幕正中央倒数 10 → 1，第一秒带一行「还剩十秒」
  const cdLeft = Math.ceil(G.timeLeft);
  if (G.running && G.timeLeft > 0 && cdLeft <= 10){
    cdWrap.classList.add('on');
    if (cdLeft !== lastCdShown){
      lastCdShown = cdLeft;
      cdNumEl.textContent = cdLeft;
      cdCapEl.style.display = cdLeft >= 10 ? '' : 'none';
      cdNumEl.classList.remove('pop');
      void cdNumEl.offsetWidth;                 // 强制重排，动画才会重播
      cdNumEl.classList.add('pop');
      beep(cdLeft <= 3 ? 900 : 620, 0.09, 'square', cdLeft <= 3 ? 0.05 : 0.035);
    }
  } else if (lastCdShown !== null){
    lastCdShown = null;
    cdWrap.classList.remove('on');
  }

  document.getElementById('plCrowns').textContent = '👑 ' + G.player.crowns;
  document.getElementById('aiCrowns').textContent = '👑 ' + G.ai.crowns;
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1400);
}

// ---------------- 交互 ----------------
const ghost = document.getElementById('ghost');
let dragState = null;

function startDrag(i, ev){
  if (!G || G.phase === 'over' || !G.running) return;
  ev.preventDefault();
  const id = G.player.hand[i];
  const c = CARDS[id];
  if (G.player.elixir < c.cost){
    beep(150, 0.09, 'square', 0.03);
    return;
  }
  G.selected = i;
  dragState = { i, x: ev.clientX, y: ev.clientY };
  ghost.style.display = 'flex';
  ghost.style.background = 'linear-gradient(160deg,' + c.c1 + ',' + c.c2 + ')';
  ghost.innerHTML = '<span style="font-size:30px">' + c.glyph + '</span>';
  moveGhost(ev.clientX, ev.clientY);
  updateHover(ev.clientX, ev.clientY);
  refreshHand();
}

function moveGhost(x, y){
  ghost.style.left = x + 'px';
  ghost.style.top = y + 'px';
}

function updateHover(cx, cy){
  const r = cv.getBoundingClientRect();
  if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom){
    G.hover = toArena(cx, cy);
  } else {
    G.hover = null;
  }
}

function tryDeployAt(x, y){
  if (G.selected === null) return;
  const idx = G.selected;
  const id = G.player.hand[idx];
  const c = CARDS[id];
  if (G.player.elixir < c.cost) return;
  if (!canDeploy('player', x, y, c)){
    toast('这里不能部署');
    beep(150, 0.09, 'square', 0.03);
    return;
  }
  G.player.elixir -= c.cost;
  doSpawn(id, 'player', x, y);
  cycleCard(G.player, idx);
  G.selected = null;
  G.hover = null;
  handSig = '';
  refreshHand();
}

document.addEventListener('pointermove', ev => {
  if (dragState){
    dragState.x = ev.clientX; dragState.y = ev.clientY;
    moveGhost(ev.clientX, ev.clientY);
    updateHover(ev.clientX, ev.clientY);
  } else if (G && G.selected !== null && G.running){
    updateHover(ev.clientX, ev.clientY);
  }
});
document.addEventListener('pointerup', ev => {
  if (dragState){
    const r = cv.getBoundingClientRect();
    const inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    if (inside){
      const p = toArena(ev.clientX, ev.clientY);
      tryDeployAt(p.x, p.y);
    }
    dragState = null;
    ghost.style.display = 'none';
    G.hover = null;
  }
});
document.addEventListener('pointercancel', () => {
  dragState = null;
  ghost.style.display = 'none';
});

cv.addEventListener('pointerdown', ev => {
  if (!G || !G.running || G.phase === 'over') return;
  ev.preventDefault();
  const p = toArena(ev.clientX, ev.clientY);
  if (G.selected !== null){
    tryDeployAt(p.x, p.y);
  }
});

// ---------------- 流程 ----------------
const scrMenu = document.getElementById('scrMenu');
const scrDeck = document.getElementById('scrDeck');
const scrGame = document.getElementById('scrGame');
const scrResult = document.getElementById('scrResult');

function showScreen(el){
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('on');
  el.classList.add('on');
  // 主菜单 / 选卡界面各自的背景音乐（战斗音乐由 startGame 接棒）
  if (el === scrMenu) BGM.play('menu');
  else if (el === scrDeck) BGM.play('deck');
}

let playerDeck = DEFAULT_DECK.slice();

function startGame(){
  newGame();
  handSig = '';
  G.running = true;
  showScreen(scrGame);
  BGM.play('battle');
  requestAnimationFrame(() => { resizeCanvas(); refreshHand(); });
  toast('战斗开始！');
}

function finish(result){
  if (G.phase === 'over') return;
  G.phase = 'over';
  G.result = result;
  G.selected = null;
  G.hover = null;
  dragState = null;
  ghost.style.display = 'none';
  const title = document.getElementById('resTitle');
  if (result === 'win'){ title.textContent = '胜  利'; title.style.color = '#7dffb0'; sfxWin(); }
  else if (result === 'lose'){ title.textContent = '失  败'; title.style.color = '#ff8a8a'; sfxLose(); }
  else { title.textContent = '平  局'; title.style.color = '#ffe07a'; beep(400,0.3,'sine',0.06); }
  document.getElementById('resCrowns').textContent = '👑 ' + G.player.crowns + ' : ' + G.ai.crowns;
  // 亮出 AI 这局抽到的卡组
  document.getElementById('resAiDeck').innerHTML = G.ai.deck.map(id => {
    const c = CARDS[id];
    return '<div class="chip" style="background:linear-gradient(160deg,' + c.c1 + ',' + c.c2 + ')" title="' + c.name + '">' +
           '<span class="c">' + c.cost + '</span>' + c.glyph + '</div>';
  }).join('');
  setTimeout(() => showScreen(scrResult), 700);
}

// ---------------- 卡组界面 ----------------
let poolFilter = 'all';        // 卡池筛选：all / building / spell

function renderDeck(){
  const row = document.getElementById('deckRow');
  row.innerHTML = '';
  for (let i = 0; i < 8; i++){
    const id = playerDeck[i];
    const d = document.createElement('div');
    d.className = 'slot' + (id ? ' full' : '');
    if (id){
      const c = CARDS[id];
      d.style.background = 'linear-gradient(160deg,' + c.c1 + ',' + c.c2 + ')';
      d.innerHTML = '<div class="cost">' + c.cost + '</div><div style="font-size:26px">' + c.glyph + '</div><div class="nm">' + c.name + '</div>';
      d.onclick = () => { playerDeck.splice(i, 1); renderDeck(); };
    } else {
      d.textContent = '+';
      d.style.color = '#b6c6de';
    }
    row.appendChild(d);
  }

  // 平均圣水：按当前已放入的卡算，空卡组显示「—」
  const n = playerDeck.length;
  const sum = playerDeck.reduce((s, id) => s + CARDS[id].cost, 0);
  document.getElementById('avgVal').textContent = n ? (sum / n).toFixed(1) : '—';
  document.getElementById('avgElixir').classList.toggle('empty', !n);

  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  // 筛选条：全部 / 建筑 / 法术
  const fbar = document.getElementById('poolFilter');
  if (fbar){
    [...fbar.children].forEach(b => {
      b.classList.toggle('on', b.dataset.f === poolFilter);
      b.onclick = () => { poolFilter = b.dataset.f; renderDeck(); };
    });
  }
  const shown = CARD_POOL_SORTED.filter(id => {
    const c = CARDS[id];
    if (poolFilter === 'all') return true;
    if (poolFilter === 'building') return c.type === 'building';
    if (poolFilter === 'spell') return c.type === 'spell';
    if (poolFilter === 'ground') return c.type === 'troop' && !c.flying;
    if (poolFilter === 'air') return c.type === 'troop' && !!c.flying;
    return true;
  });
  for (const id of shown){
    const c = CARDS[id];
    const used = playerDeck.includes(id);
    const d = document.createElement('div');
    d.className = 'pcard' + (used ? ' used' : '');
    d.style.background = 'linear-gradient(160deg,' + c.c1 + ',' + c.c2 + ')';
    const tp = c.type === 'spell' ? '法术' : (c.type === 'building' ? '建筑' : (c.flying ? '空中' : '地面'));
    d.innerHTML = '<div class="cost">' + c.cost + '</div><div class="art">' + c.glyph + '</div>' +
                  '<div class="nm">' + c.name + '</div><div class="tp">' + tp + '</div>';
    d.title = c.desc;
    d.onclick = () => {
      if (used) return;
      if (playerDeck.length >= 8){ toast('卡组已满，先点掉一张'); return; }
      playerDeck.push(id);
      renderDeck();
    };
    pool.appendChild(d);
  }
}

// 随机卡组：纯随机经常凑出「一张法术都没有」或者「一堆七费」的死组，
// 所以带约束重采样 —— 必须有进攻核心、1~2 张法术、至少一张对空、
// 平均费用落在 3.0~4.2。300 次还抽不中就把条件放宽到只剩平均费用。
//
// 进攻核心（Win Condition）：这张卡的**主要用途就是拆塔**，没有它整套牌只能被动挨打。
//   · 只打建筑、真能拆塔：巨人（3968 血坦克）/ 野猪骑士（越河高速）/ 攻城炸弹人（自爆 302×2）
//     / 骷髅气球（飞到塔上炸 163 + 掉 7 个骷髅）
//   · 能直接落到塔上输出：哥布林飞桶（3 个哥布林砸在塔边）
//   注意：骑士、皮卡、武神、野蛮人这类是「防守后反打」的兵，不算核心；
//   戈仑冰人虽然只打建筑，但 84 伤 / 2.5 秒，拆不动塔，只能算小坦克。
const WIN_CONDS = ['giant', 'hogRider', 'wallBreakers', 'goblinBarrel', 'skeletonBarrel', 'miner', 'battleRam', 'giantSkeleton'];

function randomDeck(){
  const avg = d => d.reduce((s, id) => s + CARDS[id].cost, 0) / d.length;
  // 先钉一张随机核心，再从剩下的卡里补 7 张 —— 这样「有核心」是构造出来的，不是撞运气
  const pick = () => {
    const core = WIN_CONDS[(Math.random() * WIN_CONDS.length) | 0];
    return [core, ...shuffle(CARD_POOL.filter(id => id !== core)).slice(0, 7)];
  };
  const good = d => {
    const spells = d.filter(id => CARDS[id].type === 'spell').length;
    const a = avg(d);
    return spells >= 1 && spells <= 2 &&
           d.some(id => CARDS[id].targetsAir) &&
           d.some(id => WIN_CONDS.includes(id)) &&      // 构造上必然满足，留作兜底断言
           a >= 3.0 && a <= 4.2;
  };
  for (let t = 0; t < 300; t++){ const d = pick(); if (good(d)) return d; }
  for (let t = 0; t < 300; t++){ const d = pick(); const a = avg(d); if (a >= 2.8 && a <= 4.4) return d; }
  return pick();
}

// AI 卡组：每局现抽一套，但避免和玩家撞成同一套（8 张全同就重抽）
function pickAiDeck(){
  const key = d => d.slice().sort().join(',');
  const mine = key(playerDeck);
  for (let t = 0; t < 40; t++){
    const d = randomDeck();
    if (key(d) !== mine) return d;
  }
  return randomDeck();
}

// ---------------- 主循环 ----------------
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTs){ lastTs = ts; return; }
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05);
  if (!G || !G.running) return;
  if (G.phase !== 'over') update(dt);
  draw();
  refreshHand();
}
requestAnimationFrame(loop);

// ---------------- 事件绑定 ----------------
document.getElementById('btnStart').onclick = () => {
  if (playerDeck.length !== 8){ toast('卡组需要 8 张卡'); showScreen(scrDeck); renderDeck(); return; }
  startGame();
};
document.getElementById('btnDeck').onclick = () => { renderDeck(); showScreen(scrDeck); };
for (const b of document.getElementById('diffRow').querySelectorAll('.dbtn')){
  b.onclick = () => {
    aiLevel = b.dataset.lv;
    for (const o of document.getElementById('diffRow').querySelectorAll('.dbtn')) o.classList.toggle('on', o === b);
  };
}
document.getElementById('btnDeckBack').onclick = () => { showScreen(scrMenu); };
document.getElementById('btnDeckClear').onclick = () => {
  if (!playerDeck.length){ toast('卡组已经是空的'); return; }
  playerDeck.length = 0;          // 就地清空，保持数组引用不变
  renderDeck();
  toast('卡组已清空');
};
document.getElementById('btnDeckRandom').onclick = () => {
  playerDeck = randomDeck();
  renderDeck();
  toast('已生成随机卡组');
};
document.getElementById('btnAgain').onclick = () => startGame();
document.getElementById('btnHome').onclick = () => { G = null; showScreen(scrMenu); };
document.getElementById('btnQuit').onclick = () => {
  if (!G) return;
  G.running = false;
  showScreen(scrMenu);
};
document.getElementById('btnSound').onclick = (e) => {
  muted = !muted;
  e.currentTarget.textContent = muted ? '🔇' : '🔊';
  BGM.applyMute();          // 音乐和音效共用一个开关
};
window.addEventListener('resize', () => { if (G && G.running) resizeCanvas(); });
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

renderDeck();
// 进页面就试播主菜单音乐；被自动播放策略拦下的话，等第一次点击/按键再补播
BGM.play('menu');
</script>
